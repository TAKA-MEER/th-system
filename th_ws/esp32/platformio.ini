; ============================================================
; TH System ESP32 Firmware
; Platform: PlatformIO + Arduino framework
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; micro-ROS ライブラリ (pre-built for ROS2 Humble)
; 初回セットアップ手順:
;   1. https://github.com/micro-ROS/micro_ros_arduino/releases から
;      "Humble" 対応の latest release .zip をダウンロード
;   2. PlatformIO IDE → Libraries → Add .zip を選択
;      または lib/ ディレクトリに展開して lib_extra_dirs で指定
; lib_extra_dirs = lib/micro_ros_arduino

lib_deps =
    ; micro_ros_arduino をグローバルインストール後は自動検出
    ; micro-ros/micro_ros_arduino  ← PIO Registry 未掲載のため手動インストール

; ビルド設定
build_flags =
    -DROS_DOMAIN_ID=10
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

board_build.partitions = huge_app.csv   ; micro-ROS は Flash を多く使う
board_build.mcu        = esp32
board_build.f_cpu      = 240000000L

; シリアル設定
monitor_speed  = 115200
upload_speed   = 921600
upload_port    = /dev/esp32             ; udev ルールで固定

; フラッシュサイズ
board_upload.flash_size = 4MB
