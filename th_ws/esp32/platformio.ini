; ============================================================
; TH System ESP32 Firmware
; Platform: PlatformIO + Arduino framework
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; WebSocket クライアントライブラリ (PlatformIO レジストリから取得)
lib_deps =
    links2004/WebSockets @ ^2.4.1

; ビルド設定
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

board_build.mcu        = esp32
board_build.f_cpu      = 240000000L

; シリアル設定
monitor_speed  = 115200
upload_speed   = 921600
;upload_port    = COM3                   ; Windows: Silicon Labs CP210x

; フラッシュサイズ
board_upload.flash_size = 4MB

; トールチェーン/フレームワークのバージョン固定
; (キャッシュ破損によるビルド失敗を実機テストで確認・修正した際の既知良好バージョン)
platform_packages =
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
