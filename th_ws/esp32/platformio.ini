; ============================================================
; TH System ESP32 Firmware
; Platform: PlatformIO + Arduino framework
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; micro-ROS ライブラリ (pre-built for ROS2 Humble)
; セットアップ手順:
;   1. https://github.com/micro-ROS/micro_ros_arduino/releases から
;      "Humble" 対応の latest release .zip をダウンロード
;   2. esp32/lib/ に展開 → esp32/lib/micro_ros_arduino/ となるようにする
lib_extra_dirs = lib/micro_ros_arduino

lib_deps =
    ; micro_ros_platformio は Linux 専用ビルドツールのため Windows 非対応
    ; pre-built の micro_ros_arduino を lib_extra_dirs で指定すること

extra_scripts = pre:link_microros.py

; ビルド設定
build_flags =
    -DROS_DOMAIN_ID=10
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

board_build.partitions = huge_app.csv   ; micro-ROS は Flash を多く使う
board_build.mcu        = esp32
board_build.f_cpu      = 240000000L

; シリアル設定
monitor_speed  = 115200
upload_speed   = 921600
;upload_port    = COM3                   ; Windows: Silicon Labs CP210x

; フラッシュサイズ
board_upload.flash_size = 4MB
