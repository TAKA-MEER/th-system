esp32_bridge:
  ros__parameters:
    wheel_base:    0.39     # m — キャリブ後に apply_calib で更新 (再起動不要で即時反映)
    odom_frame:    "odom"
    base_frame:    "base_link"
    # odom → base_link TF は ekf_filter_node (robot_localization) が発行するため
    # ここでは出さない。両方が出すと TF ツリーが二重親になり壊れる。
    # 本ノードは /odom (エンコーダ生値) の発行のみを担当し、EKF がそれを
    # IMU と融合して TF を出す (2026-08-06 変更・docs/architecture.md「オドメトリと TF」)。
    # シミュレーション (gazebo.launch.py) では本ノード自体が起動しないため無関係。
    publish_tf:    false
    feedback_timeout_ms: 500   # ESP32 フィードバック死活監視タイムアウト (ms)
    feedback_period_ms:  100   # ESP32 の制御周期 (esp32/src/config.h の CTRL_PERIOD_MS)。
                               # WHEEL_FEEDBACK 1 フレームが表す走行時間 = オドメトリ積分の dt。
                               # config.h を変更したらここも必ず合わせること。
    # 2026-11-19 (Spec-safety §6.4): esp32_bridge はクライアント。接続先は
    # ラズパイの pi_serial_relay（サーバー）の bind アドレス（br0 = 192.168.5.1）。
    # PC のアドレスは決め打ちにしない（どの PC でも使える）。
    esp32_ws_host: "192.168.5.1"  # WebSocket 接続先（ラズパイ中継）
    # ラズパイの pi_serial_relay (--ws-port) と一致させる (2026-09-05〜。
    # 旧 ESP32 側 wifi_credentials.h の WS_SERVER_PORT は廃止。向きは 2026-11-19 に逆転)。
    # パラメータ名は registry.yaml の esp32_ws_port（SG-B21 で ws_port から改名。
    # 生成 esp32_bridge.yaml が後段に重なりこちらを上書きする）。
    esp32_ws_port: 8766   # 中継サーバーの待ち受けポート
