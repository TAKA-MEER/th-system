# ============================================================
# planning_params.yaml — follow_planner 全パラメータ
# (距離帯ベース追従ロジック v2 対応版 / followLogic.md)
# ============================================================
follow_planner:
  ros__parameters:
    # ── 状態A: TRACKING（軌跡追従） ─────────────────────────
    lookback_distance: 1.0           # m 軌跡追従時に遡る距離
    trail_sample_interval_m: 0.05    # m 軌跡点を追加する最小移動距離
    trail_max_points: 2000           # 軌跡の最大保持点数

    # ── 状態遷移（距離帯・ヒステリシス） ──────────────────
    d_prepare: 3.0                   # m TRACKING/PREPARE の切替距離
    d_evade: 2.0                     # m PREPARE/EVADING の切替距離
    distance_hysteresis_m: 0.2       # m 復帰判定に加える余裕距離（チャタリング防止）

    # ── 状態B: PREPARE（退避準備・最空きスペース探索） ────
    evade_scan_directions: 16        # 空きスペース探索の走査方向数
    evade_scan_max_dist: 3.0         # m 空きスペース探索の最大走査距離
    evade_route_length_m: 2.0        # m 退避ルートの長さ
    retreat_check_clearance: 0.5     # m 退避方向に必要な最小自由空間

    # ── 状態C: EVADING（退避走行・Pure Pursuit） ──────────
    retreat_speed: 0.15              # m/s 退避速度
    evade_k_ang: 2.0                 # 旋回 / Pure Pursuit の角度ゲイン
    evade_stop_radius_m: 0.2         # m Pure Pursuit の停止半径
    evade_orient_tolerance_rad: 0.05  # rad 向き合わせ完了とみなす角度誤差

    # ── 共通 ──────────────────────────────────────────────
    goal_deadzone_m: 0.30            # m ゴール更新のデッドゾーン
    update_rate_hz: 10.0             # Hz 制御ループ周期
    base_frame: "base_link"
    map_frame: "map"

follow_planner_mapless:
  ros__parameters:
    # ── 軌跡追従（MAP不要・Nav2不使用） ────────────────────
    # 狭い部屋での実機検証 (2026-07-11) に合わせて近接寄りに調整。
    # 広い現場では stop 1.0 / resume 1.3 / obstacle 1.0 / lookback 1.0 が目安。
    lookback_distance: 1.0           # m 軌跡追従時に遡る距離
    trail_sample_interval_m: 0.05    # m 軌跡点を追加する最小移動距離
    trail_max_points: 2000           # 軌跡の最大保持点数

    # ── 試験員接近時の停止/再開（ヒステリシス） ────────────
    stop_distance: 1.0               # m これ未満で停止（退避せずその場停止）
    resume_distance: 1.2             # m これ以上で追従再開

    # ── 進路上障害物チェック（生 LiDAR スキャン） ──────────
    obstacle_check_distance_m: 0.45      # m この距離未満に障害物があれば停止
    obstacle_check_half_width_deg: 20.0  # deg 進行方位を中心とした走査半幅

    # ── Pure Pursuit 駆動 ─────────────────────────────────
    v_max: 0.3                       # m/s 人の歩行速度に追従できる上限
    k_ang: 2.0                       # 角度ゲイン
    stop_radius_m: 0.2               # m ゴール到達とみなす半径
    w_max_rad_s: 0.5                 # rad/s 旋回速度の上限(未検証値。狭所で
                                      # 曲がりきれない場合はここを上げる前に
                                      # 実機の最大旋回性能を確認すること)

    # ── 速度プロファイル（急加減速防止・追突防止） ──────────
    # 目標点(lookback_distance)までの距離ではなく試験員との実距離で速度を
    # 決める(常に低速に頭打ちになるのを防ぐ)。かつ stop_distance に達する
    # までに max_linear_accel_mps2 の減速度で確実に止まれる速度を上限にする
    # (制動距離ベース。v_max を上げても追従対象への追突を防げる)。
    # 加えて、大きく曲がる必要がある時(cos(角度誤差))は並進を絞り、
    # 曲がりきれず壁に衝突するのを防ぐ。
    max_linear_accel_mps2: 0.5       # m/s^2 加速側のレート制限 (急発進防止)
    max_linear_decel_mps2: 0.5       # m/s^2 減速側のレート制限 兼 制動距離計算の減速度
                                      # (停止応答優先のため加速と別枠。実機の実制動性能を
                                      #  超える値にすると計算上の制動距離が実際より短くなり
                                      #  接近しすぎるので注意)
    max_angular_accel_rad_s2: 3.0    # rad/s^2 旋回速度のレート制限 (急旋回防止)
                                      # (実機検証 2026-07-24: これが無いと軌跡ノイズによる
                                      #  bearing の揺れが1周期でw_maxまでの旋回指令に直結し
                                      #  機体が激しく揺れる)

    # ── 試験員ロスト判定のデバウンス ────────────────────────
    lost_debounce_sec: 0.3           # s is_lost が連続でこの秒数続いたら停止する
                                      # (DR-SPAAMは約2Hzでしか推論されず、1フレームの
                                      #  検知ミスだけで is_lost が一瞬 true になり得る。
                                      #  2026-07-24 決定・VISION.md §3 参照。障害物・
                                      #  接近側の即時停止仕様はこの対象外で変更しない)

    # ── 共通 ──────────────────────────────────────────────
    update_rate_hz: 10.0             # Hz 制御ループ周期
    odom_frame: "odom"
    base_frame: "base_link"

face_planner:
  ros__parameters:
    # ── 正対制御(並進なし・その場旋回のみ・展示用) ──────────
    k_ang: 2.0                       # 角度ゲイン(evade_k_ang / mapless k_ang と同値。実績あり)
    w_max_rad_s: 0.6                 # rad/s 旋回速度の上限。実機IMUあり検証(2026-08-07)で
                                      # 0.5 だと振幅の大きい発振と頻繁なロストが発生。原因は
                                      # 制御ゲインではなく、旋回中に人物トラッカーが別の脚
                                      # (家具等)へ乗り移る誤対応付け(VISION.md §4 の既知の
                                      # 失敗モード、§9 行19 参照)。旋回を遅くして1フレーム
                                      # あたりの見かけの移動量(ω·d·0.5)を抑え、対応付けゲート
                                      # (leg_tracking_range)を試験員の実移動量に対して確保する
                                      # のが現状の対策。トラッカー側の補償が改善するまでは
                                      # 上げないこと
    max_angular_accel_rad_s2: 3.0    # rad/s^2 旋回速度の加速側レート制限(急旋回防止。mapless と
                                      # 同値。2026-07-24 実機検証: これが無いとbearingノイズが
                                      # 1周期で w_max までの旋回指令に直結し機体が激しく揺れる)
    max_angular_decel_rad_s2: 6.0    # rad/s^2 旋回速度の減速側レート制限。加速側より大きくして
                                      # 目標を通り過ぎたと分かってから素早く止まれるようにする。
                                      # 実機検証(2026-08-07)では発振の主因ではなかった(上記
                                      # w_max_rad_s 参照)が、コマンドの滑らかさ自体は改善する
                                      # ため維持する
    angle_tolerance_rad: 0.05        # rad 正対完了とみなす角度誤差(evade_orient_tolerance_rad と同値)
    min_confidence: 0.5              # 0.0-1.0 これ未満の confidence では旋回停止(summon_navigator と同値)

    # ── 試験員ロスト判定のデバウンス ────────────────────────
    lost_debounce_sec: 0.3           # s (mapless と同値・同根拠。DR-SPAAM 約2Hz推論での
                                      # 単発検知ミスによる瞬間停止を防ぐ)

    # ── 共通 ──────────────────────────────────────────────
    update_rate_hz: 10.0             # Hz 制御ループ周期

panel_navigator:
  ros__parameters:
    arrival_threshold_m: 0.3
    map_frame: "map"

summon_navigator:
  ros__parameters:
    stop_distance_m: 1.0             # m 試験員手前でこの距離を残して停止
    min_confidence: 0.5              # 0.0-1.0 これ未満の confidence では起動を拒否
    nav_wait_timeout_sec: 2.0        # s Nav2 アクションサーバ待機タイムアウト
    map_frame: "map"
    base_frame: "base_link"
