# ============================================================
# perception_params.yaml
# ============================================================
lidar_filter:
  ros__parameters:
    input_topic:  "/scan"
    output_topic: "/scan_filtered"
    # 死角範囲 [start_deg, end_deg, ...] (フラットリスト、ペアで指定)
    # 0° = 前方、右回り正
    # 初期値: 各角柱 ±5° (合計 4 箇所) — 実測後に更新すること
    # 更新方法:
    #   1. ros2 run rviz2 rviz2 で /scan を表示
    #   2. ロボットを静止させ、アルミパイプが映る角度帯を確認
    #   3. この YAML を更新して再起動 (ランタイム変更も可能)
    blind_angle_ranges:
      - 40.0    # 右前 開始
      - 50.0    # 右前 終了
      - 130.0   # 右後 開始
      - 140.0   # 右後 終了
      - 220.0   # 左後 開始
      - 230.0   # 左後 終了
      - 310.0   # 左前 開始
      - 320.0   # 左前 終了

person_predictor:
  ros__parameters:
    history_sec:     2.0
    max_predict_sec: 5.0
    publish_rate_hz: 10.0
