# ============================================================
# 配電盤座標登録ファイル
# 地図作成後に RViz2 で座標を確認して入力する
#
# 座標系: map フレーム (m)
# yaw: ロボットが配電盤正面に向く角度 (rad)
#      例: 配電盤が北壁 → yaw=π/2, 南壁 → yaw=-π/2, 東壁 → yaw=0
#
# 現在の値は panel_room ワールド (panel_room_no_actor.world) の
# 実配置から算出したシミュレーション用の値:
#   配電盤は北壁 y=3.55 の x=-3.0 / 0.0 / 3.0、
#   待機位置は正面 0.85 m 手前 (y=2.7)・北向き (yaw=π/2)。
#   th_map は Gazebo world 座標とほぼ一致
#   (map origin [-5.03,-4.02] ≒ 部屋南西角 [-5.1,-4.1])。
# 実機地図に切り替える際は RViz2 で実測して更新すること。
# ============================================================
panels:
  - id: "panel_01"
    name: "第1配電盤"
    x: -3.0
    y: 2.7
    yaw: 1.5708    # π/2 = 北向き (配電盤に正対)

  - id: "panel_02"
    name: "第2配電盤"
    x: 0.0
    y: 2.7
    yaw: 1.5708

  - id: "panel_03"
    name: "第3配電盤"
    x: 3.0
    y: 2.7
    yaw: 1.5708

