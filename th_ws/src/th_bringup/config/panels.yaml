# ============================================================
# 配電盤座標登録ファイル
# 地図作成後に RViz2 で座標を確認して入力する
#
# 座標系: map フレーム (m)
# yaw: ロボットが配電盤正面に向く角度 (rad)
#      例: 配電盤が北壁 → yaw=0, 南壁 → yaw=π, 東壁 → yaw=-π/2
# ============================================================
panels:
  - id: "panel_01"
    name: "第1配電盤"
    x: 2.0        # TODO: 地図作成後に実測値を入力
    y: 0.0
    yaw: 0.0      # rad (配電盤に向く方向)

  - id: "panel_02"
    name: "第2配電盤"
    x: 4.0
    y: 0.0
    yaw: 0.0

  - id: "panel_03"
    name: "第3配電盤"
    x: 6.0
    y: 0.0
    yaw: 0.0

