# ============================================================
# twist_mux 設定
# 優先度: 高い数値が優先
# lock: true のトピックが HIGH (true) を受信している間は
#        他の全入力を捨てて何も publish しない（0 は出さない）
#
# 【重要: このファイルは bringup.launch.py / gazebo.launch.py からは
# 読まれない】実ノードが読むのは `<data>/generated/twist_mux.yaml` で、
# その locks/topics の構造は `th_bringup/launch/params_generation.py` の
# `TWIST_MUX_STRUCTURE` が持ち、registry.yaml 由来の timeout 3種だけが
# 上書きされる（G-3・二重管理の防止。`test_params_launch.py` が検査）。
# ここを直しても Gazebo/実機の挙動は変わらない（`slam.launch.py` だけは
# この静的ファイルを読む）。挙動を変えたいときは params_generation.py を直すこと。
#
# 【ロック中に 0 が出ないこと（twist_mux 4.3.0 のソースで確認・2026-09-28）】
# `LockTopicHandle::callback` は値を覚えるだけで publish せず、
# `VelocityTopicHandle::callback` は `hasPriority()` が真のときだけ転送する。
# ロックの priority（255 / 254）は velocity 側の priority（30 / 20 / 10）より
# 全部高いため、ロック中は全入力がマスクされて `/cmd_vel_muxed` は無音になる。
# 実際に 0 を送って機体を止めるのは後段の `obstacle_limiter` と `esp32_bridge`。
# （`DetailedDesign-safety.md` §1.1）
# ============================================================
twist_mux:
  ros__parameters:

    # ── ロック（下位入力を捨てて無音にする。0 は出さない） ─────────
    locks:
      estop:
        topic:    /safety/estop        # safety_monitor が発行
        timeout:  0.5                  # 0.5s 以内に更新がなければロック解除扱い
        priority: 255                  # 最優先

      fault:
        topic:    /safety/fault_lock   # safety_monitor が FaultStatus.active=true 時に発行
        timeout:  0.5
        priority: 254

    # ── 速度入力トピック ─────────────────────────────────
    topics:
      # 挙動系ノード (th_transit/th_onsite/th_route/th_maintenance が発行。
      # WP-SAFE-03: 旧 retreat トピック（優先度20）から改名。優先度は維持。
      behavior:
        topic:   /cmd_vel_behavior
        timeout: 0.5
        priority: 20

      # Nav2 controller_server 出力 (追従/手動ゴール/配電盤移動で共用)
      nav:
        topic:   /cmd_vel_nav
        timeout: 0.5
        priority: 10

      # タブレットUIのジョグ操作 (MANUAL モード時のみ UI 側が発行。
      # Nav2/map 不要の直接速度指令。timeout で押下をやめれば止まる。
      # 実機検証: WiFi(ESP32 AP)経由の rosbridge WebSocket は他の安全系
      # トピックと同様に 0.5〜1.2秒程度の受信ギャップが時折発生するため、
      # 0.5s のままだとキーを押し続けていても一時的に停止してしまう。
      # 1.0s に緩和(手放し/タブレット切断時の停止までの遅れとのトレードオフ。
      # 2026-07-24 決定)。
      manual_joy:
        topic:   /cmd_vel_manual
        timeout: 1.0
        priority: 30
