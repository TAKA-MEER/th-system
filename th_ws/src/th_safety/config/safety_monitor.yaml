# ============================================================
# safety_monitor パラメータ
#
# タイムアウト値の調整指針:
#   - 短くしすぎると電磁ノイズ・通信ジッタで誤検知が増える
#   - 長くしすぎると実際の故障への反応が遅れる
#   - ESP32 ウォッチドッグ (300ms) よりは長く設定し、
#     ウォッチドッグが先に作動してからフォルト通知する設計
#   - 現場検証後に最終調整すること (設計書 TBD 参照)
# ============================================================
safety_monitor:
  ros__parameters:
    lidar_timeout_ms:    500    # ms /scan タイムアウト
    esp32_timeout_ms:    500    # ms /esp32/wheel_feedback タイムアウト
                                # (ESP32 ウォッチドッグ 300ms + ジッタ余裕)
    person_timeout_ms:   500    # ms /person/status タイムアウト
    check_period_ms:     100    # ms 監視ループ周期
