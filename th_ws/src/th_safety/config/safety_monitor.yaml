# ============================================================
# safety_monitor パラメータ（静的な土台。G-4）
#
# タイムアウト・保持時間などの安全パラメータは registry.yaml から導出・生成
# される（/root/th_data/generated/safety_monitor.yaml が後段で重ね書きする。
# DEBT-3・DetailedDesign-wp2.md WP-SAFE-01）。ここに残すのは registry.yaml
# の対象外（ノードのループ周期など、安全上の意味を持たない値）だけ。
#
# 根拠のコメントは registry.yaml の各行の note へ移した
# （DetailedDesign-reuse.md §2.3「値の根拠コメントは registry.yaml の note へ移す」）。
# ============================================================
safety_monitor:
  ros__parameters:
    check_period_ms:     100    # ms 監視ループ周期
    startup_grace_sec:     3    # s  起動直後のタイムアウト誤検知を防ぐ猶予
