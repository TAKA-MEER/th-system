# repair_hints.yaml — 始業点検の NG（校正では直らないもの）に応じたチェック手順（S-31 故障診断）。
#
# 正本: docs/plan/detailed/DetailedDesign-maintenance.md §2.6（チェック手順は yaml に持ち、コードに埋めない）。
# 対象は ESTOP と MOTOR だけ（IMU・LiDAR の NG は校正へ誘導する）。キーは check_core.py の NG 理由
# （CheckStatus.detail）と一致させる。WebUI は YAML を読めないので
# th_ws/web_ui/scripts/gen_repair_hints.py が src/generated/repair_hints.json に変換する
# （test_repair_hints_sync.py が変換漏れを止める）。
#
# この画面は診断結果を示すだけで、修理そのものは人が行う。
ESTOP:
  no_data:
    - GPIO の配線（信号線・GND）が外れていないか確認する
    - プルアップ抵抗が入っているか確認する
    - ボタン本体の導通をテスターで確認する
  no_press:
    - ボタンを押したときに導通が変わるかテスターで確認する（GPIO 配線・プルアップ・ボタン自体）
    - ESTOP_BENCH_TEST_BYPASS（開発用の非常停止バイパス）が有効になっていないか確認する
  stuck_release:
    - ボタンを解除したときに導通が元に戻るかテスターで確認する（短絡・固着の疑い）
    - ボタンが戻りきっているか（機械的に引っかかっていないか）を確認する
  answer_mismatch:
    - 画面の表示（押された／解除された）と実物の状態が逆になっていないか確認する
    - GPIO の極性（押下で High か Low か）の設定を確認する
    - ESTOP_BENCH_TEST_BYPASS が有効になっていないか確認する
MOTOR:
  no_samples:
    - モーターの配線（電源線・信号線）が外れていないか確認する
    - モータードライバの電源と LED の状態を確認する
    - バッテリー電圧が足りているか確認する
    - ESP32 との接続（シリアル）が生きているか確認する
  sign_mismatch_L:
    - 左右の配線が入れ替わっていないか確認する
    - 左輪のエンコーダの極性（A 相・B 相の入れ替わり）を確認する
  sign_mismatch_R:
    - 左右の配線が入れ替わっていないか確認する
    - 右輪のエンコーダの極性（A 相・B 相の入れ替わり）を確認する
  no_follow_L:
    - 左輪のモーター配線とエンコーダ配線を確認する
    - 左輪が機械的に引っかかっていないか（手で回して確認）
  no_follow_R:
    - 右輪のモーター配線とエンコーダ配線を確認する
    - 右輪が機械的に引っかかっていないか（手で回して確認）
