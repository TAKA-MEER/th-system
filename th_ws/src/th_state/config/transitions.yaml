# transitions.yaml
#
# DetailedDesign-state.md §4.1（共通・layer 0・18行）と §4.2（モード内・layer 10・110行）を
# 加工せずに転記したもの（唯一の正）。spec_ref の実値は §4.4 の写像を転記している。
# id は詳細設計・pytest・UI がそのまま参照する（DetailedDesign-state.md §3）。
#
# 注意:
#   - to_mode は §4.2 の表でモード跨ぎが無いモードでは列自体が省略されているが、
#     このファイルでは全行に "="（不変）を明示する。
#   - C-06r は C-06b より前に置く（layer 0 内は記載順に走査するため。§3.1 規則1）。
#   - LINE/LEASH の一部行は実装を段階8へ後回しにしており、§3.3 のeffect一覧に無い効果名
#     （例: plan_line_route）は転記していない（空リスト）。表そのものは含める。

- id: C-01
