  mode: '*'
  state: '*'
  event: ui.jog.hold
  guard: jog_allowed
  to_mode: '='
  to_state: PAUSE
  effects:
  - name: set_jog
    args:
      'on': true
  spec_ref: SM-3.1.1-01
