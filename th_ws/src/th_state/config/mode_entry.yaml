# mode_entry.yaml
#
# DetailedDesign-state.md §8.3 の許可表（Spec-modes.md §4.2 の転写）を転記したもの。
# C-13 / C-15 / T-OPC-07 / T-CAL-09 のガード mode_entry_allowed が読む。
# 表に無い組合せは拒否する（reject_reason_key: mode_entry_denied）。
#
# 注意: mode_entry_allowed はこの表に加えて前提条件も見る
# （教示済み経路の有無・tracker_enabled・デバイス接続。DetailedDesign-transit.md §0.4）。
# その前提条件はこのパケット（WP-STATE-01）の対象外（§2 に読む節として挙げられていない）。

