# attributes.yaml
#
# DetailedDesign-state.md §8.2 の実値表（18行×9列）を転記したもの（Spec-modes.md §6 の転写）。
# キーの意味は §8.1 を参照。
#
# 注意:
#   - resume_state は全モード必須（C-05 が全モードの PAUSE に効くため）。
#   - PREP の needs_tracker は REGISTER 状態のときだけ required、他は optional（※※）。
#     この分岐は th_state の外（呼び出し側）が state を見て判断する。
#   - has_record が true の REPLAY / PANEL_NAV / SUMMON / HOME_NAV / AT_PANEL は
#     map_update が ON のときだけ意味を持つ（既定 false。※）。
#   - AT_PANEL / AT_HOME の speed_limit は停止だが、jog_active の間だけ v_jog_panel（※※※）。

INIT:
  initial_state: CHECK
  run_state: null
  resume: none
  resume_state: null
  needs_tracker: optional
  speed_limit: stop
  auto_brake_default: on_locked
  jog: denied
  has_record: false
IDLE:
  initial_state: NONE
  run_state: null
  resume: none
  resume_state: null
  needs_tracker: optional
  speed_limit: stop
  auto_brake_default: on_locked
  jog: denied
  has_record: false
ESTOP:
  initial_state: NONE
  run_state: null
  resume: ack_only
  resume_state: NONE
  needs_tracker: keep
  speed_limit: stop
  auto_brake_default: on_locked
  jog: denied
  has_record: false
CARRY:
  initial_state: NONE
  run_state: null
  resume: none
  resume_state: null
  needs_tracker: keep
  speed_limit: stop
  auto_brake_default: on_locked
  jog: denied
  has_record: false
FOLLOW:
  initial_state: SELECT
  run_state: RUN
  resume: yes_no
  resume_state: PAUSE
  needs_tracker: required
  speed_limit: v_max
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
MANUAL:
  initial_state: PAUSE
  run_state: RUN
  resume: ack_only
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_max
  auto_brake_default: 'off'
  jog: is_drive
  has_record: false
TEACH_FOLLOW:
  prep_states: [ROUTE_SEL]
  initial_state: ROUTE_SEL
  run_state: REC
  resume: yes_no
  resume_state: PAUSE
  needs_tracker: required
  speed_limit: v_max
  auto_brake_default: on_locked
  jog: allowed
  has_record: true
TEACH_MANUAL:
  prep_states: [ROUTE_SEL]
  initial_state: ROUTE_SEL
  run_state: REC
  resume: ack_only
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_max
  auto_brake_default: 'off'
  jog: is_drive
  has_record: true
REPLAY:
  prep_states: [ROUTE_SEL, LOCALIZE, READY]
  initial_state: ROUTE_SEL
  run_state: RUN
  resume: yes_no
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_max
  auto_brake_default: on_locked
  jog: allowed
  has_record: true
LINE:
  initial_state: SETUP
  run_state: RUN
  resume: yes_no
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_max
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
LEASH:
  initial_state: DEV_CHECK
  run_state: RUN
  resume: yes_no
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_leash
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
PREP:
  # RETURN（自動帰還）だけ PAUSE を持つ（Spec-modes.md §3.0-② 追記・2026-10-05 決定）。
  # prep_states に残した状態では C-01（ジョグ介入）/ C-03（回復フォルト）の
  # $pause_unless_prep が状態を保つ（地図作成中の連れ回しで PAUSE に落ちない）。
  # resume は yes_no（PREP/PAUSE の W-1 で「はい／いいえ」を出す。
  # 「はい」は T-PREP-16 で RETURN（残りの経路で帰還を続ける）、
  # 「いいえ」は T-PREP-17 で MAPPING。汎用の C-04（$resume_run=MAPPING）は
  # override_common の T-PREP-16 が先に拾う。C-05 は resume_state_available が
  # PREP を弾くので T-PREP-17 が担う）。
  prep_states: [MAPPING, REGISTER, EDIT, SAVED]
  initial_state: MAPPING
  run_state: MAPPING
  resume: yes_no
  resume_state: null
  needs_tracker: required
  speed_limit: v_slow
  auto_brake_default: on_locked
  jog: allowed
  has_record: true
PANEL_NAV:
  initial_state: NAV
  run_state: NAV
  resume: yes_no
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_slow
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
AT_PANEL:
  initial_state: IDLE_P
  run_state: null
  resume: ack_only
  resume_state: IDLE_P
  needs_tracker: unused
  speed_limit: stop
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
SUMMON:
  initial_state: POINT
  run_state: NAV
  resume: ack_only
  resume_state: POINT
  needs_tracker: required
  speed_limit: v_slow
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
HOME_NAV:
