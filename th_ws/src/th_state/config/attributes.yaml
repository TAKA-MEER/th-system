  resume: yes_no
  resume_state: PAUSE
  needs_tracker: unused
  speed_limit: v_slow
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
AT_HOME:
  # Spec-modes.md §2.3 / §6（2026-09-08 追加）。AT_PANEL と同じ属性。
  # speed_limit は停止だが、jog_active の間だけ v_jog_panel（※※※。zones.mode_speed_limit）。
  initial_state: IDLE_H
  run_state: null
  resume: ack_only
  resume_state: IDLE_H
  needs_tracker: unused
  speed_limit: stop
  auto_brake_default: on_locked
  jog: allowed
  has_record: false
OPCHECK:
  initial_state: LIST
  run_state: null
  resume: ack_only
  resume_state: LIST
  needs_tracker: unused
  speed_limit: v_check
  auto_brake_default: on_locked
  jog: denied
  has_record: false
CALIB:
  initial_state: LIST
  run_state: null
  resume: ack_only
  resume_state: LIST
  needs_tracker: unused
  speed_limit: v_calib
  auto_brake_default: on_locked
  jog: denied
