  note: "OPCHECK のモーター確認。押している間だけ動く極低速（方針値）。obstacle_limiter は SystemState.speed_limit=\"v_check\" を数値へ解決するために必要（attributes.yaml の OPCHECK が speed_limit: v_check）"
