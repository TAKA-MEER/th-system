  note: "CALIB の自律走行・旋回。校正の再現性が出る速度（方針値）。obstacle_limiter は SystemState.speed_limit=\"v_calib\" を数値へ解決するために必要（attributes.yaml の CALIB が speed_limit: v_calib）"
