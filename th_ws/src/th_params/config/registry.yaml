# registry.yaml — 数値が存在する唯一の場所（WP-PARAM-01）。
#
# スキーマは DetailedDesign-params.md §1.1。規則 S1〜S5 は th_params/schema.py が検証する。
# 名前の正本は DetailedDesign-names.md §7（`test_names_match_names_md` が突き合わせる）。
#
# 数値を書けるのは class: b(given) と given の行だけ。class: c は全行
# value: TBD_MEASURE ＋ blocking: true ＋ blocking_from_stage を持つ（S1）。
# class: a で status: placeholder の行（O-a2/O-a4 未決）も value: TBD_MEASURE（S2）。
#
# 実測値そのものは WP-MEAS-01 / WP-MEAS-04 が後から入れる。ここではまだ入れない
# （brake_accel_mps2 が TBD_MEASURE のままなのは正しい状態）。
#
# 数値の根拠について: brake_accel_mps2 などの class:c は測定するまで分からない値。
# venue_clearance_m 等の class:a は O-a2/O-a4 が決まるまで方針未定。
# それ以外の class:b(given) / given の値は、実機データシートや現行コードから明示的な
# 数値が読み取れる場合はその値を使い（出典を note に明記）、明示的な数値が文書中に
# 無い場合は P1（暫定値は安全側の極値）に従い保守的な仮値を置いた
# （note に "暫定値。実機データ未確認" と明記。数値そのものの根拠は WP-PARAM-01 の
# 完了報告を参照）。

# =========================================================================
# 7.1 速度（names §7.1 / params §6.1・§6.4）
# =========================================================================

- name: drivetrain_ceiling_mps
  unit: m/s
  class: b
  status: given
  value: 1.4
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §6.1"
  note: "出力上限 ÷ フィードフォワード係数。暫定値。実機データシート未確認（P1 fail-slow）。v_max の逆算元"

- name: v_max_headroom_ratio
  unit: null
  class: b
  status: given
  value: 0.8
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1"
  note: "v_max を天井の何割にするか。補正の余地を残すための暫定値"

- name: v_max
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [drivetrain_ceiling_mps, v_max_headroom_ratio]
  formula: v_max_from_ceiling
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, replay_runner, jog_gate, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1・§6.4"
  note: "ゾーン OUT の上限。A1 の 2 本制約を満たせなければ 1 回だけ引き下げられる（P-5）"

- name: venue_clearance_m
  unit: m
  class: a
  status: placeholder
  value: TBD_MEASURE
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "v_slow の逆算元（O-a2 が決まるまで placeholder）"

- name: blind_clearance_m
  unit: m
  class: a
  status: placeholder
  value: TBD_MEASURE
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "v_reverse の逆算元（LiDAR 死角。O-a2 が決まるまで placeholder）"

- name: panel_clearance_m
  unit: m
  class: a
  status: placeholder
  value: TBD_MEASURE
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "v_jog_panel の逆算元（O-a2 が決まるまで placeholder）"

- name: v_slow
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [venue_clearance_m, brake_accel_mps2, brake_delay_s]
  formula: speed_from_braking_distance
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "ゾーン IN の上限。venue_clearance_m と brake_accel_mps2 のどちらかが placeholder なら placeholder（S5）"

- name: v_reverse
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [blind_clearance_m, brake_accel_mps2, brake_delay_s]
  formula: speed_from_braking_distance
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "後退（全モード共通の上限）"

- name: v_jog_panel
