# registry.yaml — 数値が存在する唯一の場所（WP-PARAM-01）。
#
# スキーマは DetailedDesign-params.md §1.1。規則 S1〜S5 は th_params/schema.py が検証する。
# 名前の正本は DetailedDesign-names.md §7（`test_names_match_names_md` が突き合わせる）。
#
# 数値を書けるのは class: b(given) と given の行だけ。class: c は全行
# value: TBD_MEASURE ＋ blocking: true ＋ blocking_from_stage を持つ（S1）。
# class: a で status: placeholder の行（O-a2/O-a4 未決）も value: TBD_MEASURE（S2）。
#
# 実測値そのものは WP-MEAS-01 / WP-MEAS-04 が後から入れる。ここではまだ入れない
# （brake_accel_mps2 が TBD_MEASURE のままなのは正しい状態）。
#
# 数値の根拠について: brake_accel_mps2 などの class:c は測定するまで分からない値。
# venue_clearance_m 等の class:a は O-a2/O-a4 が決まるまで方針未定。
# それ以外の class:b(given) / given の値は、実機データシートや現行コードから明示的な
# 数値が読み取れる場合はその値を使い（出典を note に明記）、明示的な数値が文書中に
# 無い場合は P1（暫定値は安全側の極値）に従い保守的な仮値を置いた
# （note に "暫定値。実機データ未確認" と明記。数値そのものの根拠は WP-PARAM-01 の
# 完了報告を参照）。

# =========================================================================
# 7.1 速度（names §7.1 / params §6.1・§6.4）
# =========================================================================

- name: drivetrain_ceiling_mps
  unit: m/s
  class: b
  status: given
  value: 1.4
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §6.1"
  note: "出力上限 ÷ フィードフォワード係数。暫定値。実機データシート未確認（P1 fail-slow）。v_max の逆算元"

- name: v_max_headroom_ratio
  unit: null
  class: b
  status: given
  value: 0.8
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1"
  note: "v_max を天井の何割にするか。補正の余地を残すための暫定値"

- name: v_max
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [drivetrain_ceiling_mps, v_max_headroom_ratio]
  formula: v_max_from_ceiling
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, replay_runner, jog_gate, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1・§6.4"
  note: "ゾーン OUT の上限。A1 の 2 本制約を満たせなければ 1 回だけ引き下げられる（P-5）"
  # speed_limit_strictness_rank（N-15・A13）: この行の値が「speed_limit 名の厳しさ順」
  # （th_state/zones.py の LIMIT_STRICTNESS。数値が小さいほど厳しい＝低速）のどこに
  # 位置するかを宣言する。"stop" は registry に行が無いので rank 0 は予約済み・暗黙。
  # A13（assertions.a13_speed_limit_strictness_order）がこの rank 順に並べた名前の列と、
  # 解決済みの数値の昇順が一致するかを起動時に検査する。この宣言自体と
  # th_state/zones.py の LIMIT_STRICTNESS が一致することは
  # test_state_registry_consistency.py（th_testing）が機械的に照合する
  # （2 か所の重複は残るが、N-14 のような静かな乖離にはしない）。
  speed_limit_strictness_rank: 6

- name: venue_clearance_m
  unit: m
  class: a
  status: placeholder
  value: TBD_MEASURE
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "v_slow の逆算元（O-a2 が決まるまで placeholder）"

- name: blind_clearance_m
  unit: m
  class: a
  status: placeholder
  value: TBD_MEASURE
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "v_reverse の逆算元（LiDAR 死角。O-a2 が決まるまで placeholder）"

- name: panel_clearance_m
  unit: m
  class: a
  status: placeholder
  value: TBD_MEASURE
  consumers: [params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "v_jog_panel の逆算元（O-a2 が決まるまで placeholder）"

- name: v_slow
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [venue_clearance_m, brake_accel_mps2, brake_delay_s]
  formula: speed_from_braking_distance
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "ゾーン IN の上限。venue_clearance_m と brake_accel_mps2 のどちらかが placeholder なら placeholder（S5）"
  speed_limit_strictness_rank: 4  # N-15・A13。v_max(43行目のコメント) 参照

- name: v_reverse
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [blind_clearance_m, brake_accel_mps2, brake_delay_s]
  formula: speed_from_braking_distance
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "後退（全モード共通の上限）"

- name: v_jog_panel
  unit: m/s
  class: b
  status: derived
  value: null
  derived_from: [panel_clearance_m, brake_accel_mps2, brake_delay_s]
  formula: speed_from_braking_distance
  consumers: [jog_gate, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "AT_PANEL のジョグ。A2a は課さない（極低速軸。params.md §4.1）"
  speed_limit_strictness_rank: 3  # N-15・A13。v_max(43行目のコメント) 参照

- name: v_leash
  unit: m/s
  class: b
  status: given
  value: 1.0
  consumers: [leash_runner, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "LEASH（一定速）。逆算対象が無いため given（方針値）。人の歩行速度を想定した暫定値。obstacle_limiter は SystemState.speed_limit=\"v_leash\" を数値へ解決するために必要（attributes.yaml の LEASH が speed_limit: v_leash）"
  speed_limit_strictness_rank: 5  # N-15・A13。v_max(43行目のコメント) 参照

- name: v_check
  unit: m/s
  class: b
  status: given
  value: 0.05
  consumers: [opcheck_runner, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "OPCHECK のモーター確認。押している間だけ動く極低速（方針値）。obstacle_limiter は SystemState.speed_limit=\"v_check\" を数値へ解決するために必要（attributes.yaml の OPCHECK が speed_limit: v_check）"
  speed_limit_strictness_rank: 1  # N-15・A13。v_max(43行目のコメント) 参照

- name: v_calib
  unit: m/s
  class: b
  status: given
  value: 0.15
  consumers: [calib_runner, obstacle_limiter, params_audit]
  spec_ref: "DetailedDesign-names.md §7.1 / DetailedDesign-params.md §3.1.1"
  note: "CALIB の自律走行・旋回。校正の再現性が出る速度（方針値）。obstacle_limiter は SystemState.speed_limit=\"v_calib\" を数値へ解決するために必要（attributes.yaml の CALIB が speed_limit: v_calib）"
  speed_limit_strictness_rank: 2  # N-15・A13。v_max(43行目のコメント) 参照

- name: w_max
  unit: rad/s
  class: b
  status: given
  value: 0.6
  consumers: [follow_runner, line_runner, leash_runner, venue_navigator, obstacle_limiter, jog_gate, params_audit]
