- name: blind_angle_ranges
  unit: deg_pairs
  class: c
  status: measured
  value: [-132.8, -117.5, -59.5, -38.9, 45.9, 61.5, 130.3, 143.5]
  measured_at: "2026-09-09"
  source: "上部構造（四隅の支柱）搭載後に実測。周囲 500mm 以内の実体を除去した状態で /scan を 300 スキャン集計（scripts/measure_blind_sectors.py）。laser_link 基準・反時計回り正・平坦配列。四隅の支柱が laser 中心から約 0.33m の距離に前左 +45.9..+61.5 / 前右 -59.5..-38.9 / 後左 +130.3..+143.5 / 後右 -132.8..-117.5 の 4 セクタとして恒常的に映る。いずれも obstacle_limiter の前方コーン(±28.6°)・後方コーン(±34.4°)の外なので L5 の v_reverse キャップは発火しない。

    【2026-09-09 追記】初回実測値（前左 +45.9..+54.9 / 前右 -51.9..-45.4 / 後左 +130.3..+138.8 / 後右 -132.8..-125.8）は、支柱をかすめるグレージング角のビームが measure_blind_sectors.py の 90% persist 判定と NEAR_M=0.5m しきい値の境界で本来より 4〜7 度過小に切り詰められており、実機で /scan_filtered を確認すると各セクタの端から支柱の点群（0.32〜0.67m の近距離リターン）が漏れて地図（slam_toolbox）に写り込む不具合があった。/scan と /scan_filtered をセクタ境界の内外で突き合わせて実測し直し、支柱の点群が完全に消え、かつ境界の外側では実環境の距離（0.75m以上）が masking されずそのまま出ることを実機で確認した上でこの値に更新。measure_blind_sectors.py 側も MARGIN を 1.0→5.0 度、NEAR_M 既定値を 0.5→0.6m に変更済み（再測定時は同じ余裕を引き継ぐ）"
  consumers: [lidar_filter, obstacle_limiter, opcheck_runner]
  spec_ref: "DetailedDesign-names.md §7.2 / DetailedDesign-wp0.md WP-PARAM-01 §5"
  note: "死角セクタ（O-4）。平坦配列 [a0,a1, a2,a3, ...]（度）で持ち、lidar_filter._build_blind_ranges() / th_safety::flat_to_range_pairs() が 2 個ずつ組にする。空配列と『未校正』は別物であり、その判定は blind_calibrated（class:b）に委ねる（DetailedDesign-open.md 参照）。上部構造の形状を変えたら WP-CALIB-01 の手順で再測定すること"

- name: blind_calibrated
  unit: null
  class: b
  status: given
  value: true
  consumers: [obstacle_limiter, lidar_filter]
  spec_ref: "DetailedDesign-safety.md §4.4 / DetailedDesign-open.md"
  note: "死角マスクが校正済みかどうか。既定は false 側（拒否）が安全だが、現構成は死角が無いことを確認済みなので true。DetailedDesign-safety.md §4.4 は『全ペアが幅ゼロ→拒否』と定めるが、空リストは sanitize_node_params() が落とすため配列の形からは『死角なし』と『バグで消えた』を区別できない。明示フラグで判定する"

