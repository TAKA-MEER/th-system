#version: "3.8"

services:
  th_robot:
    build:
      context: .
      network: host
    container_name: th_robot
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=10
      # ESP32 SoftAP 経由のマルチキャストが不安定で pi の /scan が発見できない
      # 場合のみ有効化する (ラズパイ側にも対になるピア設定が必要。
      # fastdds_profile.xml 内コメント参照)。
      # 2026-07-17 実機検証: コンテナ全体にこれを適用すると mode_manager /
      # safety_monitor 等ローカルノード間の通信まで道連れで壊れることを確認
      # (ros2 node list / 同一ホスト内トピックが軒並み不通になった)。実際に
      # 有効化・検証済みの箇所は bringup.launch.py の lidar_filter ノード
      # (additional_env でノード単位に絞ってある。リモート /scan を実際に
      # 購読する唯一のノードのため)。常用すると一部ノード間のローカル発見が
      # 不安定になる事象も観測されたため、ここ(コンテナ全体)では既定で無効。
      # - FASTRTPS_DEFAULT_PROFILES_FILE=/root/th_ws/src/th_bringup/config/fastdds_profile.xml
      - DISPLAY=${DISPLAY:-:0}
      - LIBGL_ALWAYS_INDIRECT=0        # GPU レンダリング許可
      - GAZEBO_MODEL_PATH=/root/th_ws/src/th_description/meshes
    volumes:
      - ./src:/root/th_ws/src
      - ./esp32:/root/th_ws/esp32
      - ./scripts:/root/th_ws/scripts
      # 設計書（完了条件が /docs を読む。DetailedDesign-wp0.md WP-MSG-01 §10-③ など）。読み取り専用
      - ../docs:/docs:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Gazebo モデルキャッシュ（再起動時の高速化）
      - gazebo_models:/root/.gazebo
      # DR-SPAAM 重みファイル（Google Drive から手動DL、docs/setup.md 参照。--rm でも消えないようホストに永続化）
      - ./dr_spaam_weights:/root/th_ws/install/dr_spaam_ros/share/dr_spaam_ros/weights
    # LiDAR を PC に USB 直結する場合のみ必要 (現行の実機構成では LiDAR は
    # ラズパイ側に接続し /scan をネットワーク経由で受信するため不要)。
    # 直結構成に戻す場合はコメント解除するか docker-compose.override.yml に書く。
    # devices:
    #   - /dev/lidar:/dev/lidar
    # GPU サポート（NVIDIA の場合のみ有効化）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  gazebo_models:
