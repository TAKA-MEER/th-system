; ============================================================
; TH System ESP32 — 実機駆動系 段階テストプログラム
; Platform: PlatformIO + Arduino framework
;
; 本体ファームウェア (th_ws/esp32) とは独立したベンチ試験用プロジェクト。
; 4つの環境 (stage1〜stage4) はそれぞれ src/stageN_*.cpp のみをビルドし、
; 低レベルドライバ (lib/hw_common) を共通利用する。
;
;   pio run -e stage1_motor_encoder -t upload
;   pio device monitor
; ============================================================

[platformio]
default_envs = stage1_motor_encoder

[env]
platform  = espressif32
board     = esp32dev
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

board_build.mcu   = esp32
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed  = 921600
;upload_port  = COM3                  ; Windows: Silicon Labs CP210x

board_upload.flash_size = 4MB

; th_ws/esp32/platformio.ini と同じ既知良好バージョンに固定
platform_packages =
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b

; ── Stage 1: モーター単体・エンコーダ反応確認 ──────────────────
[env:stage1_motor_encoder]
build_src_filter =
    +<*>
    -<stage2_straight_line.cpp>
    -<stage3_distance_stop.cpp>
    -<stage4_timed_distance.cpp>

; ── Stage 2: 直進性確認 (オープンループ) ────────────────────────
[env:stage2_straight_line]
build_src_filter =
    +<*>
    -<stage1_motor_encoder.cpp>
    -<stage3_distance_stop.cpp>
    -<stage4_timed_distance.cpp>

; ── Stage 3: 指定距離での停止 ────────────────────────────────
[env:stage3_distance_stop]
build_src_filter =
    +<*>
    -<stage1_motor_encoder.cpp>
    -<stage2_straight_line.cpp>
    -<stage4_timed_distance.cpp>

; ── Stage 4: 指定時間・指定距離への到達 (PID ゲイン調整) ─────────
[env:stage4_timed_distance]
build_src_filter =
    +<*>
    -<stage1_motor_encoder.cpp>
    -<stage2_straight_line.cpp>
    -<stage3_distance_stop.cpp>
