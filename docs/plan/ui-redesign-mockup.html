/* ---------------- 試験準備 ---------------- */
const METHODS = [['person','人の位置で'],['pose','いまの姿勢で'],['tap','地図をタップして']]
function prepView(){
  const p=S.prep, s=p.sub
  const mapping = s==='mapping'
  const reserved = p.reserved==='dim' ? 'dis' : 'inert'
  let stop='cur', run=reserved, runNote='追従走行（今後の予約）'
  if (s==='return'){ stop='en'; run='cur'; runNote='' }
  const canReg = mapping
  const needTrk = p.method==='person' && !S.tracker
  const needTgt = p.method==='person' && S.tracker && S.target==null
  const st = {
    entry:['前回の地図とピンが残っています', `ピン ${p.pins} 件（待機場所 1・配電盤 5）`],
    mapping:['地図作成中　未保存の変更あり', `ピン ${p.pins} 件`],
    reg:['待機場所を登録中（人の位置で）', ''],
    return:['待機場所へ戻る途中', ''],
  }[s]
  // ピンを押すと編集（2026-11-22 ユーザー指摘。Spec-onsite.md §2.3: 名前の変更・削除・位置と向きの登録し直し）。地図作成中だけ
  const pinsNow = PINS.filter(q=>!p.del.includes(q.id))
  const MNAME = {person:'人の位置で', pose:'いまの姿勢で', tap:'地図をタップして'}
  const editBody = !p.sel ? null
    : p.edit==='rename' ? `<input class="pin-name" value="${pinById(p.sel).name}" aria-label="ピンの名前"><div class="row">${btn('pinRenameOk','決める',{cls:'adv'})}${btn('pinEditCancel','やめる')}</div>`
    : `${pinById(p.sel).kind==='panel' ? `<div class="ordrow"><span>順番 <b>${S.order.indexOf(p.sel)+1}</b> / ${S.order.length}</span>${btn('ordUp','前へ',{dis:S.order.indexOf(p.sel)===0,why:'いちばん前です'})}${btn('ordDown','後へ',{dis:S.order.indexOf(p.sel)===S.order.length-1,why:'いちばん後ろです'})}</div>` : ''}${btn('pinRename','名前を変える')}${btn('pinRereg', `${MNAME[p.method]}登録し直す`)}${btn('pinDel', p.edit==='delArm' ? 'もう一度押すと削除' : '削除', {cls:'caution'+(p.edit==='delArm'?' armed':'')})}`
  let mainInner = mapSVG({robot:s==='return'?C(172,100,90):C(150,66,180), path:s==='return'?[C(172,100),C(172,150),C(175,176)]:null, partial:true, scan:true, pins:pinsNow, sel:p.ordering?null:p.sel, bubBody:editBody, order:true, orderList:p.ordering})
  // 地図の道具の段（地図の左上）。地図に対する操作はここへ足す（拡張の仕方: options §3.5）
  mainInner += `<div class="mapctl">${btn('rotL','左へ回す',{dis:!mapping,why:'地図作成中に変えられます'})}${btn('rotR','右へ回す',{dis:!mapping,why:'地図作成中に変えられます'})}${btn('ordStart','順番を決める',{dis:!mapping||!!p.ordering,why:'地図作成中に決められます'})}</div>`
  if (s==='entry') mainInner += `<div class="center"><div class="card"><p>前回の試験場内地図とピン（${p.pins} 件）が残っています</p>
      ${btn('resume','続きから再開',{icon:'play',cls:'fwd'})}
      ${btn('fresh','新しい試験日として開始（前回を消す）',{icon:'close',cls:'caution'})}</div></div>`
  const lay = p.lay
  if (mapping && p.method==='person' && (lay==='cur'||lay==='A')) mainInner += radarSVG(false, !S.tracker)
  if (lay==='cur') mainInner += stickHTML()   // D54: 常設（いまの案）

  // ---- 帯（地図の下・登録の帯の上。地図を塞がない）。出すのは 1 つだけ: 壁に近い ＞ 順番 ＞ 地図タップ ＞ 人の位置で登録 ----
  let mk='', band='', bandCls=''
  const arrow=(x,y,a,len,col)=>{ const ex=x+len*Math.cos(a), ey=y+len*Math.sin(a)
    return `<path d="M${x} ${y}L${ex} ${ey}" stroke="${col}" stroke-width="6"/><path d="M${ex} ${ey}l${-18*Math.cos(a-0.5)} ${-18*Math.sin(a-0.5)}M${ex} ${ey}l${-18*Math.cos(a+0.5)} ${-18*Math.sin(a+0.5)}" stroke="${col}" stroke-width="6" stroke-linecap="round"/>` }
  if (p.warn){ const w=p.warn, [x,y]=w.pos, deg=w.ang*180/Math.PI, ax=x-56*Math.cos(w.ang), ay=y-56*Math.sin(w.ang)
    // 壁から離して登録したときのピンを点線で重ねる
    mk += pinShape(w.kind, x, y, deg, {fill:'var(--act,#2f6bc6)', stroke:'#fff'})
       + pinShape(w.kind, ax, ay, deg, {fill:'rgba(255,255,255,.75)', stroke:'var(--act,#2f6bc6)', dash:'5 4'})
       + `<text x="${ax}" y="${ay+44}" text-anchor="middle" font-size="20" font-weight="800" style="fill:var(--act,#2f6bc6);stroke:#fff" stroke-width="5" paint-order="stroke">離した位置</text>`
       + `<text x="${x}" y="${y-30}" text-anchor="middle" font-size="20" font-weight="800" style="fill:#161b22;stroke:#fff" stroke-width="5" paint-order="stroke">このまま</text>`
    bandCls='ab'
    band = `<span class="stp">${ic('warn')}壁に近い</span><span class="msg">${w.kn}　壁まで 0.32 m</span>${btn('wallMove','壁から離して登録',{cls:'adv'})}${btn('wallKeep','このまま登録')}${btn('wallCancel','やめる')}` }
  else if (p.ordering){ const n=p.ordering.length, all=S.order.length
    band = `<span class="stp">順番 ${n} / ${all}</span><span class="msg">${n<all ? `${n+1} 番目の配電盤を押す` : 'すべて決めました'}</span>${btn('ordOk','決める',{cls:'adv',dis:n===0,why:'配電盤を 1 つ以上押してから'})}${btn('ordRedo','やり直す',{dis:n===0,why:'まだ押していません'})}${btn('ordCancel','やめる')}` }
  else if (p.tap){ const t=p.tap, kn = t.kind==='HOME' ? '待機場所' : '配電盤'
    if (t.pt){ const [x,y]=t.pt; mk += `<circle cx="${x}" cy="${y}" r="14" fill="var(--act,#2f6bc6)" stroke="#fff" stroke-width="3"/>`
      if (t.dir){ const a=Math.atan2(t.dir[1]-y, t.dir[0]-x); mk += arrow(x,y,a,Math.min(90,Math.hypot(t.dir[0]-x,t.dir[1]-y)),'var(--act,#2f6bc6)') } }
    const deg = t.dir ? Math.round((Math.atan2(t.dir[1]-t.pt[1], t.dir[0]-t.pt[0])*180/Math.PI+360)%360) : null
    const msg = !t.pt ? `${kn}の位置を押し、そのまま向けたい方へドラッグ` : `x 3.42 m　y 1.18 m　向き ${deg==null?'－':deg+'°'}`
    band = `<span class="stp">${t.re ? t.re+' を登録し直す' : kn}</span><span class="msg">${msg}</span>${btn('tapOk','この位置で確定',{cls:'adv',dis:!t.done,why:'地図を押してドラッグしてから'})}${btn('tapCancel','やめる')}` }
  else if (s==='reg'){
    band = `<span class="stp">待機場所 ${p.regStep}/2</span><span class="msg">${p.regStep===2?'機体に向いてほしい方向へ 1 歩動いて「記録」':'待機場所に立って「記録」'}</span>${btn('regRec','記録',{cls:'adv',dis:!S.tracker||S.target==null,why:'対象を選んでから（レーダーの候補を押す）'})}${btn('regCancel','やめる')}` }
  if (s==='reg' && (lay==='cur'||lay==='A')) mainInner += radarSVG(false, !S.tracker)
  if (mk) mainInner += `<svg class="map tapmk" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" style="pointer-events:none">${mk}</svg>`
  // A 以外（比べるために残した配置）は、いままでどおり地図の上に重ねる
  if (band && lay!=='A') mainInner += `<div class="flow ${bandCls}">${band}</div>`
  const regWhy = s==='entry' ? '地図作成を始めてから登録できます' : s==='reg' ? '登録中です（やめるときは帯の「やめる」）' : s==='return' ? '待機場所へ戻る途中は登録できません' : (needTrk ? '人検出を動かすと「人の位置で」登録できます（左上）' : needTgt ? '対象を選んでから（レーダーの候補を押す）' : '')
  const mseg = `<div class="mseg ${canReg?'':'dis'}" data-btn ${canReg?'':'data-dis'}>${METHODS.map(([k,n])=>`<div class="${p.method===k?'on':''}" data-act="${canReg?'method':''}" data-id="${k}">${n}</div>`).join('')}</div>`
  const regDis = !canReg || needTrk || needTgt || !!p.tap || !!p.warn || !!p.ordering
  // 2026-11-17 案（§6.1）: 先頭の行は状態（ヘッダの札と「未保存」が言う）ではなく、ピンの件数と登録中の行き先だけ
  const top = S.wt.v==='new'
    ? `<div class="where full"><span>${({entry:'',mapping:'',reg:'待機場所を登録',return:'待機場所へ'})[s]||'&nbsp;'}</span><b>ピン ${p.pins} 件</b></div>`
    : `<div class="state full"><div class="s1">${st[0]}</div><div class="s2">${st[1]}</div></div>`
  const ctl = `<div class="ctl">
    ${top}
    <div class="sec full"><h3>操作</h3>${tog(stop, run, {note: runNote})}
      <div class="row" style="margin-top:8px">${btn('toast:地図とピンを保存した','保存',{icon:'save',cls:'save',dis:!(mapping)})}</div></div>
    <div class="sec full"><h3>登録</h3>${mseg}
      <div class="row">${btn('regHome','待機場所を登録',{icon:'home',dis:regDis,why:regWhy})}${btn('regPanel','配電盤を登録',{icon:'panel',dis:regDis,why:regWhy})}</div></div>
    <div class="sec full"><h3>戻す</h3>${btn('goHome','待機場所に戻る',{icon:'home',cls:'go',dis:!mapping})}</div>
  </div>`
  const unsaved = s!=='entry' ? '<span class="pill">未保存</span>' : ''
  const opbar = `<div class="opbar">${btn('toast:未保存があれば保存するか確かめてからメインメニューへ','終了',{icon:'close',cls:'exit'})}${trackerBar(s!=='reg')}${prepBrake()}${unsaved}</div>`
  if (lay==='cur') return header('試験準備', true, PREP_STATE[s]||'') + `<div class="body">${opbar}
    <div class="content"><div class="mainv">${mainInner}</div>${ctl}</div></div>`
  // 配置案 A〜C。部品は同じで、並べ方だけ違う
  const saveB = btn('toast:地図とピンを保存した','保存',{cls:'save',dis:!mapping})
  const homeB = btn('goHome','待機場所に戻る',{cls:'go',dis:!mapping})
  const regH = btn('regHome','待機場所を登録',{dis:regDis,why:regWhy}), regP = btn('regPanel','配電盤を登録',{dis:regDis,why:regWhy})
  const toggle = tog(stop, run, {note: runNote})
  const pins = `<div class="where"><span>${({reg:'待機場所を登録',return:'待機場所へ'})[s]||'&nbsp;'}</span><b>ピン ${p.pins} 件</b></div>`
  let blocks = ''
  if (lay==='A') blocks =
    `<div class="blk b-ops">${pins}${toggle}<div class="row">${saveB}${homeB}</div></div>
     <div class="blk b-jog"><h3>手動</h3>${jogConsoleHTML()}</div>
     <div class="blk b-reg"><div class="regbar">${mseg}${regH}${regP}</div>${band ? `<div class="bandc over ${bandCls}">${band}</div>` : ''}</div>`
  else { const msegV = mseg
    blocks =
    `<div class="blk b-jog"><h3>走らせる</h3>${toggle}${jogConsoleHTML()}${homeB}</div>

let toastT
// 押せない理由を、押したボタンのそばに出す（§6.6）。ヘッダには重ねない。非常停止（D39）より下
let whyT
function whyAt(el, msg){
  const dev=document.getElementById('dev'); dev.querySelector('.why-pop')?.remove()
  const dr=dev.getBoundingClientRect(), W=parseFloat(dev.style.width), H=parseFloat(dev.style.height), sc=dr.width/W, r=el.getBoundingClientRect()
  const x=(r.left-dr.left)/sc, y=(r.top-dr.top)/sc, w=r.width/sc, h=r.height/sc
  const box=document.createElement('div'); box.className='why-pop'; box.textContent=msg; dev.appendChild(box)
  const bw=box.offsetWidth, bh=box.offsetHeight, top0=(dev.querySelector('.hdr')?.offsetHeight||110)+8
  const left=Math.min(Math.max(x+w/2-bw/2, 8), W-bw-8)
  const up = y-bh-12 >= top0
  box.classList.add(up?'up':'down'); box.style.left=left+'px'; box.style.top=(up ? y-bh-12 : Math.min(y+h+12, H-bh-8))+'px'
  box.style.setProperty('--ax', Math.min(Math.max(x+w/2-left, 16), bw-16)+'px')
  clearTimeout(whyT); whyT=setTimeout(()=>box.remove(), 3200)
}
function toast(msg){ const t=document.querySelector('#dev .toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600) }
function act(a, id){
  if (!a) return
  // 対象を選ぶ（M2）: レーダーの候補を押す。もう一度押すと外す
  if (a==='cand'){ S.target = S.target===+id ? null : +id; return render() }
  // 異常（全画面）
  if (a==='estopPress'){ if (S.ab.k!=='carry') setAb('estop'); return render() }
  if (a==='release'||a==='carryRel'){ setAb('resolved'); return render() }   // 案の画面では、機体のボタンの絵を押すと「戻した」とみなす
  if (a==='ack'){ S.ab.recent=S.ab.cause||'fault'; S.ab.k='none'; S.ab.cause=null; return render() }
  if (a.startsWith('toast:')) return toast(a.slice(6))
  if (a.startsWith('go:')){ S.menu.lvl=a.slice(3); return render() }
  if (a.startsWith('open:')){ S.scr=a.slice(5); if (S.scr==='prep') setSub('entry'); else setSub('unloaded'); return render() }
  if (a==='trkOn'){ S.tracker=true; return render() }
  if (a==='trkOff'){ S.tracker=false; return render() }
  if (extAct(a, id)) return render()   // 2026-11-23 全画面への展開
  const d=S.day, p=S.prep
  if (S.scr==='day'){
    const depart = dest => { d.dest=dest; d.sel=null; d.sub='moving'; d.robot='mid' }
    switch(a){
      case 'openMap': d.sub='home'; d.robot='home'; break   // 待機場所の宣言は廃止（D58）
      case 'pin': if (d.sub==='home'||d.sub==='panel'){ d.sel = d.sel===id?null:id } break
      case 'pinGo': depart(d.sel); break
      case 'goHome': depart('HOME'); break
      case 'goNext': depart(d.sub==='panel' ? S.order[1] : S.order[0]); break
      case 'run': if (d.sub==='paused'){ d.sub='moving'; d.robot='mid'; S.ab.recent=null } break
      case 'stop': d.sub='paused'; break
      case 'abort':
        if (d.sub==='moving'||d.sub==='paused'||d.sub==='blocked'){ d.robot='off'; d.sub='home'; toast('止めて、行き先の選び直しへ戻った') }
        else if (d.sub==='summon'){ d.sub='home' }
        d.dest=null; d.flowStep=0; break
      case 'measure': d.sub='working'; toast('測定機能の画面を開き、停止命令（測定中）に入る'); break
      case 'unstop': d.modal='stow'; break
      case 'stowOk': d.sub='panel'; d.modal=null; toast('停止を解いた（盤の前で待つ）'); break
      case 'stowNo': d.modal=null; break
      case 'reroute': d.sub='moving'; toast('経路を引き直して走り出す'); break
      case 'waitStop': d.sub='home'; toast('呼び寄せをやめた（その場で止まる）'); break
      case 'summon': d.sub='summon'; d.flowStep=1; d.sel=null; d.dest=null; break
      case 'rec': if (d.flowStep<2){ d.flowStep=2 } else { d.sub='waitclear'; d.flowStep=0; toast('呼び寄せの位置に人がいるので、退くのを待つ') } break
      case 'jog': toast('手動操作パネル（W-6）が開く。触れたら一時停止'); if (d.sub==='moving'){ d.sub='paused' } break
    }
    return render()
  }
  if (S.scr==='prep'){
    const s0=p.sub
    // 登録したピンが壁に近ければ警告の窓（M3）。案の画面では切り替え「登録するピンが壁に近い」で出す
    // 登録したピンが壁に近ければ帯で警告し、地図に「離した位置」を重ねる。pos・ang は地図の座標（画面の上）
    const robotPos = () => { const {P}=mapProj(), q=C(150,66); return {pos:P(q[0],q[1]), ang:(180+S.map.rot)*Math.PI/180} }
    const registered = (kn, at=robotPos()) => { if (p.nearWall) p.warn={kn, kind: kn==='待機場所'?'home':'panel', ...at}; else { p.pins++; toast(`${kn}を登録した`) } }
    switch(a){
      case 'rotL': S.map.rot=(S.map.rot+345)%360; break
      case 'rotR': S.map.rot=(S.map.rot+15)%360; break
      case 'resume': p.sub='mapping'; break
      case 'fresh': p.sub='mapping'; p.pins=0; toast('前回の地図とピンを消して、地図作成を始めた'); break
      case 'method': p.method=id; break
      case 'ordStart': p.ordering=[]; p.sel=null; p.edit=null; break
      case 'ordOk': S.order=[...p.ordering, ...S.order.filter(q=>!p.ordering.includes(q))]; p.ordering=null; toast('順番を決めた'); break
      case 'ordRedo': p.ordering=[]; break
      case 'ordCancel': p.ordering=null; break
      case 'pin': if (p.ordering){ if (pinById(id).kind==='panel' && !p.ordering.includes(id)) p.ordering.push(id); break }
        if (s0==='mapping'){ p.sel = p.sel===id ? null : id; p.edit=null } else toast('ピンの編集は地図作成中にできます'); break
      case 'pinRename': p.edit='rename'; break
      case 'pinRenameOk': { const v=document.querySelector('#dev .pin-name')?.value.trim(); if (v) pinById(p.sel).name=v; p.sel=null; p.edit=null; break }
      case 'pinEditCancel': p.edit=null; break
      case 'pinDel': if (p.edit==='delArm'){ p.del.push(p.sel); S.order=S.order.filter(q=>q!==p.sel); p.pins--; toast('ピンを削除した'); p.sel=null; p.edit=null } else p.edit='delArm'; break
      case 'pinRereg': { const nm=pinById(p.sel).name; p.sel=null; p.edit=null
        if (p.method==='person'){ p.sub='reg'; p.regStep=1; toast(`${nm} を人の位置で登録し直す`) }
        else if (p.method==='pose') toast(`${nm} をいまの機体の位置と向きで登録し直した`)
        else p.tap={kind:'PANEL', pt:null, dir:null, re:nm}
        break }
      case 'regHome': case 'regPanel': {
        const kind = a==='regHome' ? '待機場所' : '配電盤'
        if (p.method==='person'){ p.sub='reg'; p.regStep=1 }
        else if (p.method==='pose'){ registered(kind) }
        else { p.tap={kind: a==='regHome'?'HOME':'PANEL', pt:null, dir:null}; p.sel=null }
        break }
      case 'regRec': if (p.regStep<2) p.regStep=2; else { p.sub='mapping'; registered('待機場所') } break
      case 'tapOk': { const t=p.tap, kn = t.kind==='HOME' ? '待機場所' : '配電盤'; p.tap=null; registered(kn, {pos:t.pt, ang:Math.atan2(t.dir[1]-t.pt[1], t.dir[0]-t.pt[0])}); break }
      case 'tapCancel': p.tap=null; break
      case 'wallMove': p.warn=null; toast('壁から離した位置で登録した'); p.pins++; break
      case 'wallKeep': p.warn=null; toast('このまま登録した'); p.pins++; break
      case 'wallCancel': p.warn=null; toast('登録をやめた'); break
      case 'ordUp': case 'ordDown': { const o=S.order, i=o.indexOf(p.sel), j=i+(a==='ordUp'?-1:1); [o[i],o[j]]=[o[j],o[i]]; break }
      case 'regCancel': p.sub='mapping'; break
      case 'goHome': p.sub='return'; break
      case 'stop': p.sub='mapping'; toast('止まった（帰還を取りやめ）'); break
      case 'inert': toast('押しても何も起きない（追従走行の予約）'); break
      case 'jog': toast('手動操作パネル（W-6）が開く'); break
      case 'stick': toast(p.sub==='return' ? '触れている間だけ動く。待機場所へ戻る途中は一時停止になる' : '触れている間だけ動く（離すと止まる）'); break
    }
    return render()
  }
}

// 吹き出し（HTML）をピンの上に置く。地図の SVG は viewBox 1000×620 を枠に「meet」で収めている
function placeBubble(dev){
  const b=dev.querySelector('.bub'); if (!b) return
  const mv=b.parentElement, cw=mv.clientWidth, ch=mv.clientHeight, s=Math.min(cw/1000, ch/620)
  const x=(cw-1000*s)/2 + (+b.dataset.x)*s, y=(ch-620*s)/2 + (+b.dataset.y)*s, r=(+b.dataset.r)*s
  const bw=b.offsetWidth, bh=b.offsetHeight
  const above = y - r - 8 - bh, below = y + r + 8
  b.style.left = Math.min(Math.max(x - bw/2, 8), cw - bw - 8) + 'px'
  b.style.top = (above >= 8 ? above : Math.min(below, ch - bh - 8)) + 'px'
}
function fit(){
  const wrap=document.getElementById('stageWrap'), dev=document.getElementById('dev'), box=document.getElementById('devBox')
  const W=parseFloat(dev.style.width), H=parseFloat(dev.style.height)
  const sc=Math.min((wrap.clientWidth-24)/W,(wrap.clientHeight-24)/H,1.4)
  dev.style.transform=`scale(${sc})`; box.style.width=W*sc+'px'; box.style.height=H*sc+'px'
}

  follow:()=>[...(S.follow.teach?[['entry','経路を選ぶ（入口）']]:[]),['pick','対象を選ぶ'],['ready','選んだ・止まっている'],['run',S.follow.teach?'記録中':'追従中'],['paused','一時停止']],
  manual:()=>[...(S.manual.teach?[['entry','経路を選ぶ（入口）']]:[]),['idle','止まっている'],['drive','走らせている'],['near','障害物に近い'],['paused','一時停止'],...(S.manual.teach?[['saved','保存した']]:[])],
  replay:[['select','経路を選ぶ'],['loading','地図の読み込み'],['search','位置を探している'],['notfound','見つからない'],['far','経路から離れている'],['ready','位置が決まった'],['run','再生中'],['paused','一時停止'],['end','終点']],
  check:[['list','一覧'],['estop','非常停止ボタン'],['motor','モーター'],['imu','IMU（測っている）'],['lidarNg','LiDAR（だめ）'],['repair','S-31 故障診断']],
  calib:[['list','一覧'],['s1','直進 案内'],['s2','直進 実行'],['s3','直進 確認'],['s4','直進 検証'],['imu1','IMU 案内'],['blind','LiDAR 死角'],['hist','履歴']],
  settings:[['run','速さとブレーキ'],['loc','再生の位置合わせ'],['notify','知らせる'],['screen','画面'],['link','つなぎ先'],['log','異常の履歴'],['blind','LiDAR 死角'],['dev','開発モード']],
  auto:[['wait','測定中'],['turn','測定機能の指示で旋回中'],['paused','一時停止']],
})
const EXT_SCR = ['connect','follow','manual','replay','check','calib','settings','auto']
const subsOf = scr => typeof SUBS[scr]==='function' ? SUBS[scr]() : SUBS[scr]
function extSetSub(v){
  S.w6=false; S.modal=null; S.reArm=null; S.dropArm=false
  S.pb={on:true, lock:true, arm:false}   // 状態が変わったら ON に戻してロック（D68）
  if (S.scr==='menu'){ if (v==='shutdown'||v==='autoask'){ S.menu.lvl='top'; S.menu.win=v; S.menu.sd={map:'pending',route:'pending',arm:null,phase:'list'} } else { S.menu.win=null; S.menu.lvl=v } return true }
  if (!EXT_SCR.includes(S.scr)) return false
  const o=S[S.scr]; o.sub=v
  if (S.scr==='check'){ const c=o; c.pushed=false; c.released=false
    c.sel = {list:'motor', estop:'estop', motor:'motor', imu:'imu', lidarNg:'lidar', repair:'motor'}[v] }
  if (S.scr==='follow' && (v==='pick')) S.target=null
  if (S.scr==='follow' && v!=='pick' && S.target==null) S.target=0
  return true
}
// 異常になったら必ず一時停止（D47）を、走らせる型の画面にも当てはめる
function pauseOnAb(){
  if (S.scr==='follow' && S.follow.sub==='run') S.follow.sub='paused'
  if (S.scr==='replay' && S.replay.sub==='run') S.replay.sub='paused'
  if (S.scr==='manual' && (S.manual.sub==='drive'||S.manual.sub==='near')) S.manual.sub='paused'
  if (S.scr==='auto' && S.auto.sub==='turn') S.auto.sub='paused'
}

/* ---------- 共通の部品 ---------- */

// ON／OFF の切り替え（ON のときだけ明るく点ける。D35 と同じ）。自動ブレーキ
function brakeTog(on, where){

// 走らせる型（§0）: 主表示＋右列（① どこへ・あとどれだけ ② 停止│走行 ③ その画面の操作 ④ 手動）

const exitBtn = (act='exit', label='終了') => btn(act, label, {icon:'close', cls:'exit', help:'exit'})
// 機体のまわりの図（S-11 手動）: 機体を中心に LiDAR の点・機体の外形・減速が始まる距離の輪。近い点は橙
function surroundSVG({near=false, blind='fig', moving=false}={}){
  const M=120, cx=300, cy=320, r=rand(7)
  let pts=''
  const dot=(x,y,c)=>{ pts+=`<circle cx="${(cx+x*M).toFixed(1)}" cy="${(cy-y*M).toFixed(1)}" r="3.2" fill="${c}"/>` }
  for (let y=-2.4;y<=2.3;y+=0.07){ dot(-2.2+r()*0.03, y, 'var(--mut)'); if (y<1.6||y>2.0) dot(2.1+r()*0.03, y, 'var(--mut)') }
  for (let x=-2.2;x<=2.1;x+=0.07){ dot(x, 2.3+r()*0.03, 'var(--mut)'); if (x<-0.6||x>0.4) dot(x, -2.4+r()*0.03, 'var(--mut)') }
  const ox=near?-0.15:-1.0, oy=near?0.40:1.30
  for (let i=0;i<14;i++) dot(ox+(i%7)*0.05, oy+Math.floor(i/7)*0.05, near?'var(--warn)':'var(--mut)')
  const ring = `<circle cx="${cx}" cy="${cy}" r="${0.62*M}" fill="none" stroke="var(--bd-hi)" stroke-width="2" stroke-dasharray="8 8"/>`
  const fp = 0.55*M
  // D69（2026-11-23）: 後方に死角は無い。死角は機体の 4 本の柱だけ（斜め 4 方向の細い扇形）
  const pil = d => { const a1=(d-4)*Math.PI/180, a2=(d+4)*Math.PI/180, R=2.6*M, r0=0.55*M*0.71
    const P=(r,a)=>`${(cx+r*Math.sin(a)).toFixed(1)} ${(cy-r*Math.cos(a)).toFixed(1)}`
    return `<path d="M${P(r0,a1)} L${P(R,a1)} A${R} ${R} 0 0 1 ${P(R,a2)} L${P(r0,a2)} Z" fill="var(--dim)" opacity=".2"/>` }
  const wedge = blind==='fig' ? [45,135,225,315].map(pil).join('') : ''
  const lab = near ? `<text x="${cx+ox*M+20}" y="${cy-oy*M-22}" font-size="26" font-weight="800" style="fill:var(--warn-tx)">前方 12 cm</text>` : ''
  return `<svg class="map" viewBox="0 0 600 620" preserveAspectRatio="xMidYMid meet">${wedge}${ring}${pts}
    <rect x="${cx-fp/2}" y="${cy-fp/2}" width="${fp}" height="${fp}" rx="4" style="fill:var(--robot-fp,rgba(63,138,224,.25));stroke:var(--robot,#7fb4ee)" stroke-width="2"/>
    <path d="M${cx-14} ${cy+12}L${cx} ${cy-22}L${cx+14} ${cy+12}Z" style="fill:var(--robot,#7fb4ee)" stroke="#fff" stroke-width="2"/>${lab}</svg>`
}

/* ---------- S-00 接続確認（型: 見る・変える） ---------- */
function connectView(){
  const s=S.connect.sub
  const N = {pc:[140,250,'PC',1], ap:[450,250,'Wi-Fi AP（ラズパイ）',1], tab:[450,70,'タブレット',1], lidar:[760,110,'LiDAR',1], esp:[760,250,'ESP32',1], cam:[760,400,'カメラ',0]}
  const st = k => s==='restart' ? 'none' : (s==='lidar'&&k==='lidar') || (s==='camera'&&k==='cam') ? 'ng' : 'ok'
  const edge=(a,b)=>{ const [x1,y1]=N[a], [x2,y2]=N[b], dead = st(b)!=='ok'
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${dead?'var(--bd-hi)':'var(--ok)'}" stroke-width="${dead?3:5}" ${dead?'stroke-dasharray="10 10"':''}/>` }
  const node=k=>{ const [x,y,nm,req]=N[k], m=st(k), w=k==='ap'?270:req?200:170, h=req?76:62
    const sym = {ok:'✓',ng:'×',none:'—'}[m], fill={ok:'var(--ok)',ng:'var(--jis-y,#ffd100)',none:'var(--ctrl-hi)'}[m]
    return `<g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="8" style="fill:var(--panel);stroke:${m==='ng'?'var(--warn)':'var(--bd-hi)'}" stroke-width="${m==='ng'?4:2}"/>
      <${m==='ng'?'rect':'circle'} ${m==='ng'?`x="${x-w/2+10}" y="${y-15}" width="30" height="30" rx="5"`:`cx="${x-w/2+26}" cy="${y}" r="${req?16:12}"`} style="fill:${fill}"/>
      <text x="${x-w/2+26-(m==='ng'?1:0)}" y="${y+7}" text-anchor="middle" font-size="${req?20:16}" font-weight="900" style="fill:${m==='ok'?'#fff':'#161b22'}">${sym}</text>
      <text x="${x-w/2+50}" y="${y+7}" font-size="${req?20:17}" font-weight="${req?800:600}" style="fill:var(--tx)">${nm}</text></g>` }
  const svg = `<svg viewBox="0 0 920 470" preserveAspectRatio="xMidYMid meet">${edge('pc','ap')}${edge('ap','tab')}${edge('ap','lidar')}${edge('ap','esp')}${edge('ap','cam')}
    ${Object.keys(N).map(node).join('')}</svg>`
  const fix = s==='lidar' ? `${mk('ng')}LiDAR の電源とケーブルを確かめる` : s==='camera' ? `${mk('ng',true)}カメラの電源を確かめる（なくても運用に入れます）` : ''
  const ready = s==='ok'||s==='camera'
  const auto = [['非常停止ボタン','ok'],['モーター','ok'],['IMU','ok'],['LiDAR', s==='lidar'?'none':'ok']]
  const state = s==='restart' ? '再起動中　2 回目' : ready ? '' : '確認中'
  return header('接続確認', false, state) + `<div class="body"><div class="opbar"></div>
    <div class="content g-conn"><div class="diag">${svg}<div class="fix">${fix}</div></div>
    <div class="side2">${btn('toMenu','メインメニューへ',{cls:'big',dis:!ready,why:s==='restart'?'制御系を立ち上げ直しています':'LiDAR がつながるまで進めません'})}
      <div><h3>始業点検の自動判定</h3><div class="ac">${auto.map(([n,m])=>`<div>${mk(m,true)}${n}</div>`).join('')}</div></div>
      <div style="margin-top:auto">${btn('toast:開発モードの設定（S-50 の開発モード）','開発モードの設定',{cls:'exit'})}</div></div></div>${modalHTML()}</div>`
}

/* ---------- S-10／S-12 追従系（型: 走らせる） ---------- */
// 「確認」（向くだけで動かない）の置き方は未決（screens §1.2 の a〜c）
function tog3(stop, look, run, runLabel){
  const side=(k,st,lab)=> st==='en'
    ? (k==='stop' ? `<div class="go-stop" data-act="stop"><span>${lab}</span></div>` : `<div class="${k==='run'?'go-run blink':'press'}" data-act="${k}"><span>${lab}</span></div>`)
    : `<div class="idle off" data-act="" data-why="${st==='cur'?(k==='stop'?'止まっています':k==='look'?'向いています':'走っています'):'対象を選んでから'}"><span>${lab}</span></div>`
  const pressable=[stop,look,run].includes('en')
  return `<div class="tg tg2 big" data-btn ${pressable?'':'data-dis'} data-help="toggle" data-nolong>${side('stop',stop,'停止する')}<span class="sep"></span>${side('look',look,'向く')}<span class="sep"></span>${side('run',run,runLabel+'する')}</div>`
}
function followView(){
  const f=S.follow, T=f.teach
  if (f.sub==='entry' && !T) f.sub='pick'
  if (f.sub==='pick' && S.target!=null) f.sub='ready'
  if (f.sub==='ready' && S.target==null) f.sub='pick'
  const s=f.sub
  const E = {stop:'cur', look:'dis', run:'dis'}
  if (s==='ready'){ E.look='en'; E.run='en' } else if (s==='run'){ E.stop='en'; E.run='cur'; E.look='dis' } else if (s==='paused'){ E.look='en'; E.run='en' }
  const runLabel = s==='paused' ? '再開' : '走行'
  const toggle = f.conf==='a' ? tog3(E.stop, E.look, E.run, runLabel) : tog(E.stop, E.run, {runLabel, note:'対象を選んでから', big:true, help:'toggle'})
  const lookBtn = f.conf==='b' ? btn('look','向く',{dis:E.look!=='en',why:s==='run'?'走っています':'対象を選んでから',help:'look'}) : ''
  const saveBtn = T ? btn('save','保存',{dis:!(s==='paused'),why:s==='run'?'止めてから保存します':'記録がまだありません',help:'save'}) : ''
  const ops = (lookBtn||saveBtn) ? `<div class="row">${lookBtn}${saveBtn}</div>` : ''
  const where = s==='entry' ? '' : T ? `<span>記録</span><b>${s==='pick'||s==='ready'?'0.0 m　0:00':'12.4 m　1:32'}</b>` : (S.target==null ? `<span style="color:var(--warn-tx)">対象を選んでいません</span>` : `<span>対象まで</span><b>1.8 m</b>`)
  let main = radarSVG(true).replace('class="radar big"','class="radar big full"')
  if (T && s!=='entry') main += `<div class="minimap" data-act="toast:押すと地図とレーダーの大きさを入れ替える（案）"><span class="cap">地図と経路</span>${mapSVG({robot:C(150,90,-90), path:[C(175,176),C(172,120),C(150,90)], pins:[], scan:false})}</div>`
  if (s==='entry') main += `<div class="center"><div class="card wide"><div class="rtl">
      <div class="rt" data-act="startRec"><span>新しい経路</span><small>名前　経路 4</small></div>
      ${reRec('R','廊下の往復','12.3 m')}${reRec('C2','試験ブロックC2','5.1 m')}</div></div></div>`
  const st = {entry:'', pick:'対象選択中', ready:'', run:T?'記録中':'追従中', paused:'一時停止中'}[s]
  const stCls = T && s==='run' ? ' rec-'+S.rec.col : s==='run' ? ' run' : undefined
  return drvView({title: T?'教示（追従）':'追従走行', state:st, stCls, opbar:exitBtn(), main, where, toggle, ops,
    jog:`<h3>手動</h3>${jogKit(true)}`})
}

// 録り直す（既存の経路の上書き）は二段階: 1 回目で黄にして「もう一度押すと上書き」、2 回目で記録を始める
function reRec(id, name, len){ const armed = S.reArm===id
  return `<div class="rt${armed?' armed':''}" data-act="reRec" data-id="${id}"><span>${armed?'もう一度押すと上書き　':'録り直す　'}${name}</span><small>${len}</small></div>` }
// D68（2026-11-23）: 試験準備の自動ブレーキは常に出す。誤タップを防ぐためロックをかけ、外すには 2 回押す（1 回目で黄の「もう一度押すと外す」）。
// 外したら「切」で OFF（ロックの確認が ON→OFF の確認を兼ねる。案）。「入」に戻すか、状態が変わると ON に戻ってロックがかかる
const LOCK_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
function prepBrake(){ const b=S.pb
  if (b.lock) return `<span class="cap">自動ブレーキ</span><button class="b lockb ${b.arm?'caution armed':''}" data-btn data-act="pbUnlock" data-help="brakelock">${LOCK_SVG}<span>${b.arm?'もう一度押すと外す':'入'}</span></button>`
  return `<span class="cap">自動ブレーキ</span>${brakeTog(b.on,'prep')}` }
/* ---------- S-11／S-13 手動系（型: 走らせる） ---------- */
function manualView(){
  const m=S.manual, T=m.teach
  if ((m.sub==='entry'||m.sub==='saved') && !T) m.sub='idle'
  const s=m.sub
  const moving = s==='drive'||s==='near'
  const stop = btn('stop','停止する',{cls:'stopone',dis:!moving,why:'止まっています',help:'toggle'})
  const ops = T ? `<div class="row">${btn('save','保存',{dis:moving||s==='saved'||s==='entry',why:moving?'スティックを離してから保存します':s==='saved'?'保存しました':'記録がまだありません',help:'save'})}</div>` : ''
  const where = T && s!=='entry' ? `<span>記録</span><b>${s==='idle'?'3.2 m　0:41':'8.6 m　1:55'}</b>` : ''
  let main
  if (T && s!=='entry') main = mapSVG({robot:C(160,110,-60), path:[C(175,176),C(172,140),C(160,110)], partial:true, pins:[], scan:true}) + (s==='near'?`<div class="nearlab">前方 12 cm</div>`:'')
  else main = surroundSVG({near:s==='near', blind:m.blind, moving})
  if (s==='entry') main += `<div class="center"><div class="card wide"><div class="rtl">
      <div class="rt" data-act="startRec"><span>新しい経路</span><small>名前　経路 4</small></div>
      ${reRec('R','廊下の往復','12.3 m')}</div></div></div>`
  const st = {entry:'', idle:T?'記録中':'', drive:T?'記録中':'走行中', near:T?'記録中':'走行中', paused:'一時停止中', saved:'保存済み'}[s]
  const stCls = T && (s==='idle'||moving) ? ' rec-'+S.rec.col : moving ? ' run' : undefined
  return drvView({title: T?'教示（手動）':'手動走行', state:st, stCls,
    opbar: exitBtn() + `<span class="cap">自動ブレーキ</span>${brakeTog(m.brake,'manual')}`,
    main, where, toggle:stop, ops, jog:`<h3>手動</h3>${jogKit(true)}`})
}

/* ---------- S-14 教示再生（型: 走らせる） ---------- */
const ROUTES = [{id:'C2', name:'試験ブロックC2', len:'5.1 m'}, {id:'R', name:'廊下の往復', len:'12.3 m'}, {id:'C', name:'試験ブロックC', len:'4.8 m', noimg:true}]
function replayView(){
  const r=S.replay, s=r.sub
  const route = ROUTES.find(q=>q.id===r.route)
  const path = [C(175,176),C(172,120),C(172,76),C(130,70),C(102,58)]
  const robot = {select:null, loading:null, search:C(174,170,-90), notfound:C(174,170,-90), far:C(230,150,0), ready:C(175,176,-90), run:C(172,110,-90), paused:C(172,110,-90), end:C(102,58,-150)}[s]
  const ends = [{id:'S',name:'始点',kind:'home',c:[175,176],yaw:-90},{id:'E',name:'終点',kind:'panel',c:[102,58],yaw:-150}].map(p=>({...p, x:C(...p.c)[0], y:C(...p.c)[1]}))
  let main = mapSVG({robot, path: s==='select'?null:path, pins: s==='select'?[]:ends, scan: !!robot})
  if (s==='select') main += `<div class="center"><div class="card wide"><div class="rtl">${ROUTES.map(q=>`<div class="rt ${q.id===r.route?'on':''}" data-act="route" data-id="${q.id}"><span>${q.name}</span>${q.noimg?'<span class="tagx">地図の画像なし</span>':''}<small>${q.len}</small></div>`).join('')}</div>
      ${route.noimg?`<div class="oneline" style="text-align:left">始点の印に置いて再生する（途中からの再開はできない）</div>`:''}
      <div class="mseg" style="margin:0">${[['fwd','順再生'],['rev','逆再生']].map(([k,n])=>`<div class="${r.dir===k?'on':''}" data-act="dir" data-id="${k}">${n}</div>`).join('')}</div>
      ${btn('proceed','この経路で進む',{cls:'fwd'})}</div></div>`
  if (s==='loading') main += `<div class="maplab">地図を読み込んでいます</div>`
  const Q = {search:['warn','探しています'], notfound:['ng','見つかりません'], far:['ng','経路から離れています'], ready:['ok','位置が決まりました']}
  const where = Q[s] ? `<span class="mkline">${mk(Q[s][0])}${Q[s][1]}</span>`
    : (s==='run'||s==='paused') ? `<span>ずれ</span><b>いま 0.08 m　最大 0.21 m</b>`
    : s==='end' ? `<span>${route.name}</span><b>終点</b>` : s==='loading' ? `<span>${route.name}</span>` : ''
  const why = {select:'経路を選んでから', loading:'地図を読み込んでいます', search:'位置を探しています', notfound:'位置が見つかりません', far:'経路から離れています。経路の近く（2 m 以内）に置き直す', end:'終点です。「終了」で抜けます'}[s] || ''
  let stop='cur', run='dis'
  if (s==='ready'||s==='paused') run='en'; if (s==='run'){ stop='en'; run='cur' }
  const toggle = tog(stop, run, {runLabel: s==='paused'?'再開':'再生', note:why, big:true, help:'toggle'})
  const searching = s==='search'||s==='notfound'||s==='far'
  const ops = `<div class="row">${btn('global','完全グローバルで探す',{dis:!searching,why:'位置を探している間に使えます',help:'global'})}</div>
    <div class="mseg" style="margin:0" data-btn data-help="speed">${[['low','低速'],['mid','中速'],['high','高速']].map(([k,n])=>`<div class="${r.speed===k?'on':''}" data-act="speed" data-id="${k}">${n}</div>`).join('')}</div>
    <div class="row">${btn('reselect','経路を選び直す',{dis:!(s==='paused'),why:'一時停止中に選び直せます',help:'reselect'})}</div>`
  const st = {select:'', loading:'読み込み中', search:'位置合わせ中', notfound:'位置合わせ中', far:'位置合わせ中', ready:'', run:'再生中', paused:'一時停止中', end:'終点'}[s]
  return drvView({title:'教示再生', state:st, stCls: s==='run'?' run':undefined,
    opbar: exitBtn() + (r.devab ? `<span class="cap">自動ブレーキ</span>${brakeTog(S.replayBrake!==false,'replay')}` : ''),
    main, where, toggle, ops, jog: btn('jog','手動',{help:'jog'})})
}

/* ---------- S-30 始業点検／S-31 故障診断（型: 手順を進める） ---------- */
const CHECKS = [['estop','非常停止ボタン'],['motor','モーター'],['imu','IMU'],['lidar','LiDAR']]
function checkView(){
  const c=S.check, s=c.sub
  const res = {estop:'ok', motor: s==='repair'?'ng':'none', imu: s==='imu'?'none':'ok', lidar: s==='lidarNg'?'ng':'none'}
  if (s==='estop') res.estop = c.pushed&&c.released ? 'ok' : 'none'
  const time = {estop:'08:41', motor:'', imu:'08:43', lidar: s==='lidarNg'?'08:47':''}
  const cnt = k => Object.values(res).filter(v=>v===k).length
  if (s==='repair'){
    const items=[['電源','モーターの電源スイッチが入っている'],['配線','左モーターのコネクタが奥まで挿さっている'],['極性','赤と黒の線が入れ替わっていない']]
    return listView({title:'故障診断', opbar:btn('quitRepair','戻る',{icon:'back',cls:'exit'}),
      lhd:'だめだった点検', rows:`<div class="lrow on" data-btn><span class="nm">モーター<small>左の車輪が回らない　0 rpm</small></span>${mk('ng')}</div>`,
      phd:`<span class="pt">確かめること</span>`,
      body: items.map(([k,t],i)=>`<div class="chk ${c.rep[i]?'on':''}" data-act="repChk" data-id="${i}"><span class="bx">${c.rep[i]?'✓':''}</span>${t}</div>`).join(''),
      foot:`${btn('quitRepair','やめる',{help:'quit'})}<span class="grow"></span>${btn('backCheck','始業点検へ戻る',{cls:'fwd'})}` })
  }
  const running = s==='estop'||s==='motor'||s==='imu'
  const rows = CHECKS.map(([k,n])=>`<div class="lrow ${c.sel===k?'on':''}" data-btn data-act="chkSel" data-id="${k}"><span class="nm">${n}<small>${time[k]||'&nbsp;'}</small></span>${mk(res[k])}</div>`).join('')
  let body=''
  if (c.sel==='estop'){
    const push = c.pushed ? 'ok':'none', rel = c.released ? 'ok':'none'
    body = `<div class="fig"><div class="cell" data-act="estopPushChk" style="cursor:pointer">${estopPict(true)}<span class="cap">${mk(push,true)}押す</span></div>
      <div class="cell" data-act="estopRelChk" style="cursor:pointer">${estopPict(false)}<span class="cap">${mk(rel,true)}戻す</span></div></div>`
  } else if (c.sel==='motor'){
    const a = (k,l)=>`<button class="b" data-btn data-act="motorHold" data-id="${k}" data-help="hold" data-nolong ${s==='motor'?'':'disabled'} style="${s==='motor'?'':'opacity:.4'}">${l}</button>`
    body = `<div class="fig"><div class="arrows"><span></span>${a('f','前')}<span></span>${a('l','左')}<span style="display:flex;align-items:center;justify-content:center">${robotMini()}</span>${a('r','右')}<span></span>${a('b','後')}<span></span></div></div>`
  } else if (c.sel==='imu'){
    body = s==='imu' ? `<div class="fig" style="flex-direction:column;align-items:stretch;justify-content:center;padding:0 40px"><div class="prog"><i style="width:60%"></i></div></div>`
      : `<div class="fig"><span class="mkline">${mk('ok')}08:43</span></div>`
  } else if (c.sel==='lidar'){
    body = s==='lidarNg' ? `<table class="tbl"><tr><th>測ったもの</th><th class="num">値</th><th>基準</th><th></th></tr>
      <tr><td>無効帯</td><td class="num">7.5°</td><td>20° 未満</td><td>${mk('ok',true)}</td></tr>
      <tr><td>周期</td><td class="num">0.1 秒</td><td>2 秒以内</td><td>${mk('ok',true)}</td></tr>
      <tr class="out"><td>死角のずれ</td><td class="num">95.1°</td><td>5° 以内</td><td>${mk('ng',true)}</td></tr></table>
      <div class="row" style="display:flex">${btn('toCalib','校正へ',{help:'tocalib'})}</div>`
      : `<div class="fig">${surroundSVG({blind:'fig'}).replace('class="map"','')}</div>`
  }
  const quitLabel = 'やめる'
  return listView({title:'始業点検', state: running?'確認中':'', opbar:btn('exitCheck','戻る',{icon:'back',cls:'exit',help:'back'}),
    lhd:`${mk('ok',true)} ${cnt('ok')}　${mk('ng',true)} ${cnt('ng')}　${mk('none',true)} ${cnt('none')}`, rows,
    phd:`<span class="pt">${CHECKS.find(q=>q[0]===c.sel)[1]}</span>`, body,
    foot:`${btn('chkQuit',quitLabel,{dis:!running,why:'確かめている間だけ使えます',help:'quit'})}<span class="grow"></span>${btn('chkRun','確かめる',{cls:'fwd',dis:running,why:'確かめています',help:'advance'})}`})
}

const robotMini = () => `<svg viewBox="0 0 60 60" width="60" height="60"><rect x="6" y="6" width="48" height="48" rx="4" style="fill:var(--robot-fp,rgba(63,138,224,.25));stroke:var(--robot,#7fb4ee)" stroke-width="2"/><path d="M20 40L30 16L40 40Z" style="fill:var(--robot,#7fb4ee)"/></svg>`

const CALIBS = [['straight','直進','11/10　誤差 0.4 %'],['rot','旋回','11/10　誤差 1.2°'],['imu','IMU','11/11'],['blind','LiDAR 死角','11/11']]

      '0': `<div class="fig"><svg viewBox="0 0 520 200"><rect x="20" y="70" width="70" height="70" rx="4" style="fill:var(--robot-fp,rgba(63,138,224,.25));stroke:var(--robot,#7fb4ee)" stroke-width="3"/><path d="M40 120L80 105L40 90Z" style="fill:var(--robot,#7fb4ee)"/>
        <path d="M100 105H470" stroke="currentColor" stroke-width="4" stroke-dasharray="14 10"/><path d="M470 80v50" stroke="currentColor" stroke-width="5"/><text x="285" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="currentColor">1 m</text></svg></div>
        <div class="oneline">機体の前を 1.5 m 空け、床に始点の印を付ける</div>`,
      '1': `<div class="fig" style="flex-direction:column;align-items:stretch;padding:0 40px"><div class="mkline" style="justify-content:center">0.62 m</div><div class="prog"><i style="width:62%"></i></div></div>`,
      '2': `<div class="fig" style="flex-direction:column;gap:18px"><div style="display:flex;align-items:center;gap:14px;font-size:20px">巻尺で測った距離 <input class="inp" value="0.987" aria-label="実測"> m</div>
        <table class="tbl" style="max-width:520px"><tr><th></th><th class="num">いま</th><th class="num">直したあと</th></tr><tr><td>車輪の半径の倍率</td><td class="num">1.012</td><td class="num">1.025</td></tr></table></div>`,
      '3': `<div class="fig" style="flex-direction:column;gap:14px"><span class="mkline">${mk('ok')}検証の誤差 0.3 %</span>${btn('toast:始業点検（S-30）へ','始業点検へ')}</div>`,
    }[String(step)]
    next = ['走らせる','走らせる','確定する','完了'][Math.max(step,0)] ; if (step===-1) next='始める'
    nextDis = step===1
  } else if (item==='imu'){

  if (s==='blind') body = `<div class="fig">${surroundSVG({blind:'fig'}).replace('class="map"','')}</div><div class="row" style="display:flex">${btn('toast:校正（S-40）の LiDAR 死角へ','校正で変える')}</div>`
  if (s==='dev') body = `<div class="grp">${row('開発モード',seg('devOn',[['off','切'],['on','入']],g.dev?'on':'off'))}</div>

/* ---------- メインメニューの窓（運用の終了・自律測定の許可） ---------- */
function menuWin(){
  const w=S.menu.win; if (!w) return ''
  if (w==='autoask') return `<div class="scrim"></div><div class="win"><div class="wt">自律動作を許可しますか</div><div class="wb">${btn('autoNo','許可しない')}${btn('autoYes','許可する',{cls:'fwd'})}</div></div>`
  const d=S.menu.sd
  if (d.phase==='stopping') return `<div class="scrim"></div><div class="win"><div class="wt">制御系を止めています</div><div class="prog"><i style="width:55%"></i></div></div>`
  if (d.phase==='done') return `<div class="scrim"></div><div class="win"><div class="wt">${mk('ok')}止まりました</div><div class="wl">機体の電源を切れます</div></div>`
  const row=(k,n)=>{ const v=d[k]
    return `<div class="gr" style="display:flex;align-items:center;gap:10px;min-height:60px;font-size:19px"><span style="flex:1">${n}</span>${v==='pending'
      ? btn('sdSave','保存',{id:k}) + btn('sdDrop', d.arm===k?'もう一度押すと破棄':'破棄', {id:k, cls: d.arm===k?'caution armed':''})
      : `<span class="mkline" style="font-size:18px">${mk('ok',true)}${v==='saved'?'保存した':'破棄した'}</span>`}</div>` }
  const left = ['map','route'].filter(k=>d[k]==='pending').length
  return `<div class="scrim"></div><div class="win"><div class="wt">運用の終了</div>${row('map','試験場内地図')}${row('route','教示経路　経路 4')}
    <div class="wb">${btn('sdClose','やめる')}${btn('sdStop','止める',{dis:left>0,why:`未保存が ${left} 件あります`})}</div></div>`
}

/* ---------- 操作（案の画面の中だけの動き） ---------- */
function extAct(a, id){
  // メインメニューから各画面へ（階層の「終了」で戻る先も持つ）
  const OPEN = {follow:['follow',false], teachF:['follow',true], manual:['manual',false], teachM:['manual',true], replay:['replay'], check:['check'], calib:['calib'], settings:['settings']}
  if (a.startsWith('openx:')){ const [scr,teach]=OPEN[a.slice(6)]; S.scr=scr; if (teach!==undefined) S[scr].teach=teach
    const first = {follow: teach?'entry':'pick', manual: teach?'entry':'idle', replay:'select', check:'list', calib:'list', settings:'run'}[scr]
    setSub(first); return true }
  if (a==='shutdown'||a==='autoask'){ setSub(a); return true }
  if (S.scr==='menu'){ const d=S.menu.sd
    switch(a){
      case 'autoNo': S.menu.win=null; return true
      case 'autoYes': S.menu.win=null; S.scr='auto'; S.auto.sub='wait'; return true
      case 'sdClose': S.menu.win=null; return true
      case 'sdSave': d[id]='saved'; d.arm=null; return true
      case 'sdDrop': if (d.arm===id){ d[id]='dropped'; d.arm=null } else d.arm=id; return true
      case 'sdStop': d.phase='stopping'; setTimeout(()=>{ if (S.menu.sd===d){ d.phase='done'; render() } },1500); return true
    }
    return false }
  if (S.scr==='prep' && (a==='pbUnlock' || ((a==='brakeOn'||a==='brakeOff') && id==='prep'))){ const b=S.pb
    if (a==='pbUnlock'){ if (b.arm){ b.arm=false; b.lock=false } else { b.arm=true; clearTimeout(S.pbT); S.pbT=setTimeout(()=>{ if (b.arm){ b.arm=false; render() } },3000) } }
    else if (a==='brakeOff') b.on=false
    else { b.on=true; b.lock=true }
    return true }
  // 試験（当日）の「手動」も手動の窓（W-6）を開く（A-18: 上＝自動ブレーキ・下＝手動の一式の縦並び）
  if (S.scr==='day' && a==='jog'){ S.w6=true; S.w6brake=true; if (S.day.sub==='moving') S.day.sub='paused'; return true }
  if (S.scr==='day' && ['w6close','mClose','brakeOn','brakeOff','brakeOffOk'].includes(a)){ if (a!=='w6close'&&a!=='mClose'){ /* 下の共通処理へ */ } else { if (a==='w6close') S.w6=false; else S.modal=null; return true } }
  else if (!EXT_SCR.includes(S.scr)) return false
  const toMenu = lvl => { S.scr='menu'; S.menu.lvl=lvl; S.menu.win=null; S.w6=false; S.modal=null }
  // 共通: 手動の窓・確認の窓・自動ブレーキ
  switch(a){
    case 'jog': S.w6=true; S.w6brake=true; return true
    case 'w6close': S.w6=false; return true
    case 'mClose': S.modal=null; return true
    case 'brakeOn': if (id==='manual') S.manual.brake=true; else if (id==='w6') S.w6brake=true; else S.replayBrake=true; return true
    case 'brakeOff': S.modal={t:'自動ブレーキを切りますか', l:'障害物に近づいても減速しません', b:btn('mClose','やめる')+btn('brakeOffOk','切る',{id})}; return true
    case 'brakeOffOk': if (id==='manual') S.manual.brake=false; else if (id==='w6') S.w6brake=false; else S.replayBrake=false; S.modal=null; return true
    case 'exit': {
      const t = S.scr==='follow'||S.scr==='manual' ? S[S.scr] : null
      if (t && t.teach && t.sub!=='entry' && t.sub!=='saved' && t.sub!=='pick'){
        S.modal={t:'記録を保存しますか', l:'経路 4　8.6 m', b:btn('mClose','やめる')+btn('exitDrop','破棄して終了')+btn('exitSave','保存して終了')}; S.dropArm=false; return true }
      toMenu('drive'); return true }
    case 'exitDrop': if (!S.dropArm){ S.dropArm=true; S.modal.b=btn('mClose','やめる')+btn('exitDrop','もう一度押すと破棄',{cls:'caution armed'})+btn('exitSave','保存して終了'); return true }
      S.dropArm=false; toast('破棄した'); toMenu('drive'); return true
    case 'exitSave': toast('保存した'); toMenu('drive'); return true
    case 'reRec': if (S.reArm===id){ S.reArm=null; S[S.scr].sub = S.scr==='follow' ? 'pick' : 'idle'; if (S.scr==='follow') S.target=null; toast('前の版を 1 世代残して録り直す') } else S.reArm=id; return true
  }
  if (S.scr==='day') return true
  if (S.scr==='connect'){ if (a==='toMenu'){ toMenu('top') } return true }
  if (S.scr==='follow'){ const f=S.follow
    switch(a){
      case 'startRec': f.sub='pick'; S.target=null; break
      case 'cand': break
      case 'run': f.sub='run'; break
      case 'stop': f.sub='paused'; break
      case 'look': toast('対象の方を向く（動かない）'); break
      case 'save': toast('保存した（終点を確定）'); f.sub='paused'; break
      case 'stick': toast('触れた瞬間にジョグ介入。追従は一時停止'); if (f.sub==='run') f.sub='paused'; break
    }
    if (f.sub==='pick' && S.target!=null) f.sub='ready'
    return true }
  if (S.scr==='manual'){ const m=S.manual
    switch(a){
      case 'startRec': m.sub='idle'; break
      case 'stick': m.sub = m.sub==='saved' ? 'saved' : 'drive'; if (m.sub==='saved') toast('保存のあとは記録を続けない（動かない）'); break
      case 'stop': m.sub='paused'; break
      case 'save': m.sub='saved'; toast('保存した'); break
    }
    return true }
  if (S.scr==='replay'){ const r=S.replay
    switch(a){
      case 'route': r.route=id; break
      case 'dir': r.dir=id; break
      case 'proceed': r.sub='loading'; setTimeout(()=>{ if (r.sub==='loading'){ r.sub= r.route==='C' ? 'ready' : 'search'; render() } },1200); break
      case 'global': r.sub='ready'; break
      case 'run': r.sub='run'; break
      case 'stop': r.sub='paused'; break
      case 'speed': r.speed=id; break
      case 'reselect': r.sub='select'; break
      case 'stick': r.sub = r.sub==='run' ? 'paused' : r.sub; toast('触れている間だけ動く。再生中に触れると一時停止'); break
    }
    return true }
  if (S.scr==='check'){ const c=S.check
    switch(a){
      case 'exitCheck': toMenu('maint'); break
      case 'chkSel': c.sel=id; c.sub='list'; break
      case 'chkRun': c.sub = {estop:'estop', motor:'motor', imu:'imu', lidar:'lidarNg'}[c.sel]; c.pushed=false; c.released=false
        if (c.sub==='imu') setTimeout(()=>{ if (c.sub==='imu'){ c.sub='list'; c.sel='imu'; render() } },1600); break
      case 'chkQuit': c.sub='list'; toast('やめた（結果は記録しない）'); break
      case 'estopPushChk': if (c.sub!=='estop') break
        c.pushed=true; break   // D71: この項目の間は非常停止の窓を出さない
      case 'estopRelChk': if (c.sub==='estop' && c.pushed){ c.released=true; if (S.ab.k==='carry') setAb('resolved'); setTimeout(()=>{ if (c.sub==='estop'){ c.sub='list'; render() } },900) } break
      case 'motorHold': toast('押している間だけ動く'); break
      case 'toCalib': S.scr='calib'; setSub('blind'); break
      case 'repChk': c.rep[id]=!c.rep[id]; break
      case 'quitRepair': c.sub='list'; c.sel='motor'; break
      case 'backCheck': c.sub='list'; c.sel='motor'; break
    }
    return true }
  if (S.scr==='calib'){ const k=S.calib
    switch(a){
      case 'exitCalib': toMenu('maint'); break
      case 'calSel': k.sub = {straight:'list', rot:'list', imu:'imu1', blind:'blind'}[id]; if (id==='rot') toast('（案の画面では直進だけ描いた）'); break
      case 'calNext': { const nx={list:'s1', s1:'s2', s2:'s3', s3:'s4', s4:'list', imu1:'list', blind:'list'}[k.sub]; if (k.sub==='s4'||k.sub==='blind'||k.sub==='imu1') toast('補正値を確定した'); k.sub=nx
        if (nx==='s2') setTimeout(()=>{ if (k.sub==='s2'){ k.sub='s3'; render() } },1500); break }
      case 'calQuit': k.sub='list'; toast('やめた（補正値は変えない）'); break
      case 'calHist': k.sub='hist'; break
      case 'calHistClose': k.sub='list'; k.arm=false; break
      case 'rollback': if (k.arm){ k.arm=false; toast('11/03 の値に戻した') } else k.arm=true; break
    }
    return true }
  if (S.scr==='settings'){ const g=S.settings
    switch(a){
      case 'exitSettings': toMenu('top'); break
      case 'secSel': g.sub=id; break
      case 'voice': g.voice=id==='on'; break
      case 'spk': g.spk=id==='on'; break
      case 'ori': g.ori=id; break
      case 'font2': g.font=id; break
      case 'cost': g.cost=id==='on'; break
      case 'helpSet': S.help.on=id==='on'; break
      case 'devOn': g.dev=id==='on'; break
      case 'devItem': g.devItems[id]=!g.devItems[id]; break
      case 'setSave': toast('保存した'); break
    }
    return true }
  if (S.scr==='auto'){ const t=S.auto
    switch(a){
      case 'autoExit': S.modal={t:'腕を格納しましたか', l:'測定機構の腕が格納位置にあることを確かめる', b:btn('mClose','やめる')+btn('autoExitOk','メインメニューへ')}; break
      case 'autoExitOk': toMenu('top'); break
      case 'stop': t.sub='paused'; break
      case 'stick': t.sub='paused'; toast('触れたら一時停止。測定機能の画面の「走行」を待つ'); break
    }
    return true }
  return false
}

function showHelp(el, sticky){
  closeHelp()
  const h=HELP[el.dataset.help]; if (!h) return
  const dev=document.getElementById('dev'), dr=dev.getBoundingClientRect(), r=el.getBoundingClientRect()
  const W=parseFloat(dev.style.width), H=parseFloat(dev.style.height), sc=dr.width/W
  const x=(r.left-dr.left)/sc, y=(r.top-dr.top)/sc, w=r.width/sc, hh=r.height/sc
  const box=document.createElement('div'); box.className='help'+(sticky?' sticky':'')
  const tail = el.dataset.help==='toggle' ? (S.wt.v==='new' ? '色の付いた側が、いま押せる側です。' : '青い側がいまの状態です。') : ''
  box.innerHTML=`<div class="ht"><span>${h[0]}</span><button class="hx" data-helpclose>${ic('close')}</button></div><p>${h[1]}${tail}</p>`
  dev.appendChild(box)
  const ph=box.offsetHeight
  // 出す場所（2026-11-15 決定）: ヘッダ（非常停止）には絶対に重ねない。停止│走行はなるべく避ける。
  // 候補を左・上・下・右の順に試し、停止│走行に重ならない最初のものを使う。どれも重なるなら最初の候補。
  const TOP=(dev.querySelector('.hdr')?.offsetHeight||110)+8, clampX=v=>Math.min(Math.max(v,8),W-348), clampY=v=>Math.min(Math.max(v,TOP),H-ph-8)
  const cands=[[x-348,clampY(y+hh/2-ph/2)],[clampX(x+w/2-170),y-ph-8],[clampX(x+w/2-170),y+hh+8],[x+w+8,clampY(y+hh/2-ph/2)]]
    .filter(([l,t])=>l>=8 && l<=W-348 && t>=TOP && t<=H-ph-8)
  const tg=dev.querySelector('.ctl .tg'); let avoid=null
  if (tg){ const t=tg.getBoundingClientRect(); avoid=[(t.left-dr.left)/sc,(t.top-dr.top)/sc,(t.right-dr.left)/sc,(t.bottom-dr.top)/sc] }
  const hits=([l,t])=>avoid && l<avoid[2] && l+340>avoid[0] && t<avoid[3] && t+ph>avoid[1]
  const [l,t]=cands.find(c=>!hits(c)) || cands[0] || [clampX(x),clampY(y+hh+8)]
  box.style.left=l+'px'; box.style.top=t+'px'
}
document.addEventListener('pointerover', e=>{
  if (!S.help.on || e.pointerType!=='mouse') return
  const el=e.target.closest('#dev [data-help]'); if (!el || document.querySelector('#dev .help.sticky')) return
  clearTimeout(helpT); helpT=setTimeout(()=>showHelp(el,false),700)
})
document.addEventListener('pointerout', e=>{
  if (e.pointerType!=='mouse') return
  const el=e.target.closest('#dev [data-help]'); if (!el || el.contains(e.relatedTarget)) return
  clearTimeout(helpT); if (!document.querySelector('#dev .help.sticky')) closeHelp()
})
document.addEventListener('pointerdown', e=>{
  if (!S.help.on || e.pointerType==='mouse') return
  const el=e.target.closest('#dev [data-help]'); if (!el || el.hasAttribute('data-nolong')) return
  clearTimeout(helpT); helpT=setTimeout(()=>{ helpSwallow=true; showHelp(el,true) },600)
})
for (const ev of ['pointerup','pointercancel','pointermove']) document.addEventListener(ev, e=>{
  if (e.pointerType==='mouse') return
  if (ev==='pointermove' && Math.abs(e.movementX)+Math.abs(e.movementY)<6) return
  clearTimeout(helpT)
})
document.addEventListener('contextmenu', e=>{ if (e.target.closest('#dev')) e.preventDefault() })

// 試験準備: 地図をタップして登録（M4。Spec-onsite.md §3.3）: 押した所が位置、押したまま向けたい方へドラッグし、離した所が向き
let tapDrag=false, tapRaf=0
function mapPt(e){ const sv=document.querySelector('#dev .mainv svg.map'); if (!sv) return null
  const pt=sv.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const q=pt.matrixTransform(sv.getScreenCTM().inverse()); return [q.x,q.y] }
document.addEventListener('pointerdown', e=>{
  const t=S.scr==='prep' && S.prep.tap; if (!t) return
  if (!e.target.closest('#dev .mainv') || e.target.closest('.mapctl,.radar,.bub,[data-act]')) return
  const q=mapPt(e); if (!q) return
  t.pt=q; t.dir=null; t.done=false; tapDrag=true; e.preventDefault(); render()
})
document.addEventListener('pointermove', e=>{
  if (!tapDrag) return; const q=mapPt(e); if (!q) return
  S.prep.tap.dir=q; if (!tapRaf) tapRaf=requestAnimationFrame(()=>{ tapRaf=0; render() })
})
document.addEventListener('pointerup', e=>{
  if (!tapDrag) return; tapDrag=false; const t=S.prep.tap
  t.done = !!t.dir && Math.hypot(t.dir[0]-t.pt[0], t.dir[1]-t.pt[1]) > 12   // 動かさずに離したら向きが無いので確定できない
  if (!t.done) t.dir=null
  render()
})
document.addEventListener('click', e=>{
  clearTimeout(helpT)
  // 長押しでヘルプを出した指を離しても、ボタンは押されない
  if (helpSwallow){ helpSwallow=false; return }
  // 出したままのヘルプは「×」か枠の外を押すと閉じる（その 1 回はボタンを押したことにしない）。
  // ただしヘッダ（非常停止を含む）と赤い「停止する」は対象外で、ヘルプが出ていても 1 回で効く（2026-11-15 決定）
  const hb=document.querySelector('#dev .help')
  if (hb){ const st=hb.classList.contains('sticky')
    if (e.target.closest('[data-helpclose]') || !e.target.closest('.help')){ closeHelp(); if (st && !e.target.closest('.hdr,.estop-top,.nstop,.go-stop')) return } else return }
  // 薄いボタンを押したら、そのボタンの理由を出す（D16。区切りは空白。「—」は「一」と紛れる）
  const dz=e.target.closest('#dev [data-why]')
  if (dz && dz.dataset.why && dz.matches('.dis,.off')){
    if (S.scr==='day' && S.day.sel){ S.day.sel=null; render() }
    return S.sz.v==='new' ? whyAt(dz, '押せません　'+dz.dataset.why) : toast('押せません　'+dz.dataset.why)
  }
  // 試験準備: ピンの編集の吹き出しも、ピンと吹き出し以外を押すと閉じる
  if (S.scr==='prep' && S.prep.sel && !S.prep.ordering && e.target.closest('#dev') && !e.target.closest('[data-act="pin"],.bub')){
    S.prep.sel=null; S.prep.edit=null
    const t0=e.target.closest('[data-act]')
    if (!t0 || !t0.dataset.act || t0.closest('.dis,[data-dis]')) return render()
  }
  // 試験（当日）: 吹き出しは、ピンと吹き出しのボタン以外を押すと消える（取り消し。D10）
  if (S.scr==='day' && S.day.sel && e.target.closest('#dev') && !e.target.closest('[data-act="pin"],[data-act="pinGo"],.bub')){
    S.day.sel=null
    const t0=e.target.closest('[data-act]')
    if (!t0 || !t0.dataset.act || t0.closest('.dis,[data-dis]')) return render()
  }
  const t=e.target.closest('[data-scr],[data-sub],[data-ori],[data-ab],[data-opt],[data-act]')
  if (!t) return
  if (t.dataset.scr){ S.scr=t.dataset.scr; return render() }
  if (t.dataset.sub){ setSub(t.dataset.sub); return render() }
  if (t.dataset.ori){ S.ori=t.dataset.ori; return render() }
  if (t.dataset.ab){ setAb(t.dataset.ab); return render() }
  if (t.dataset.opt!==undefined){ const o=optsOf()[+t.dataset.opt]; S[o.k[0]][o.k[1]]=JSON.parse(t.dataset.v); return render() }
  if (t.closest('.dis,[data-dis]') && !t.dataset.act) return
  act(t.dataset.act, t.dataset.id)
})
window.addEventListener('resize', fit)
render()
</script>
