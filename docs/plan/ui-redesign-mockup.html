<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 作り直しの案</title>
<style>
/* ============================================================
   WebUI の作り直し — 案の画面（docs/plan/ui-redesign.md）
   未確定の検討メモの付録。正本のモックアップ（spec/mockup/）ではない。
   外部リソースを一切読み込まない（機体の AP 配下にネットが無いため）。
   ============================================================ */
:root{
  --bg:#0f1117; --panel:#1a1d24; --inset:#12141b;
  --ctrl:#252830; --ctrl-hi:#343849; --ctrl-on:#2c4a74;
  --bd:#2a2d35; --bd-hi:#3a3f4c;
  --tx:#e6e8ec; --mut:#8b93a1; --dim:#5c6470;
  --brand:#3f8ae0; --brand-lt:#7fb4ee; --brand-dk:#12233d;
  --ok:#4caf50; --ok-tx:#8fd694;
  --warn:#ffb74d; --warn-tx:#ffcc80;
  --ng:#ef5350; --ng-tx:#ff9b98;
  --estop:#c62828; --estop-hi:#e53935;
  --g-field:#26a69a; --g-drive:#3f8ae0; --g-maint:#a1887f;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07090d;color:var(--tx);font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- 外側（説明・切り替え） ---------- */
#bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);background:#0b0d12}
#bar h1{font-size:15px;font-weight:700;color:var(--mut);margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--bd-hi);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--mut);border-right:1px solid var(--bd-hi)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ctrl-on);color:#fff;font-weight:700}
.lbl{font-size:12px;color:var(--dim);margin-right:4px}
#main{flex:1;display:flex;min-height:0}
#stageWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
#notes{width:360px;flex:none;border-left:1px solid var(--bd);background:#0b0d12;overflow:auto;padding:14px 16px;font-size:13px;line-height:1.65}
#notes h2{font-size:14px;margin:14px 0 6px;color:var(--brand-lt)}
#notes h2:first-child{margin-top:0}
#notes ul{padding-left:18px}
#notes li{margin:3px 0}
#notes .count{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px}
#notes .count b{font-size:18px}
#notes .opt{margin:6px 0 10px}
#notes .opt .q{color:var(--tx);font-weight:700;margin-bottom:4px}
#notes .ref{color:var(--dim);font-size:12px}
@media (max-width:1000px){#main{flex-direction:column}#notes{width:auto;border-left:none;border-top:1px solid var(--bd);max-height:40vh}}

/* ---------- 機体の画面（論理サイズで描き、縮小して見せる） ---------- */
#dev{position:relative;background:var(--bg);overflow:hidden;transform-origin:top left;flex:none;box-shadow:0 0 0 1px var(--bd-hi),0 10px 40px #000}
#devBox{flex:none}
.hdr{height:110px;display:flex;flex-direction:column;border-bottom:2px solid var(--brand)}
.hdr .r1{height:50px;display:flex;align-items:center;padding:0 14px;background:linear-gradient(#182a45,#121c2c)}
.hdr .brand{font-size:14px;line-height:1.2;color:#fff;font-weight:700}
.hdr .brand small{display:block;color:var(--brand-lt);font-size:11px;font-weight:400}
.hdr .title{margin-left:auto;font-size:26px;font-weight:800;letter-spacing:.05em}
.hdr .r2{flex:1;display:flex;align-items:stretch;background:#121722}
.hdr .st{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:16px}
.hdr .st i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.hdr .zone{align-self:center;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--warn);color:var(--warn-tx)}
.hdr .estop{margin-left:auto;width:320px;background:var(--estop);color:#fff;font-size:26px;font-weight:800;letter-spacing:.1em;display:flex;align-items:center;justify-content:center}
.body{position:absolute;left:0;right:0;top:110px;bottom:0;display:flex;flex-direction:column}
.opbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--bd)}
.opbar .crumb{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.opbar .crumb svg{width:28px;height:28px}
.opbar .pill{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--ng);color:var(--ng-tx)}
.content{flex:1;min-height:0;display:flex;gap:12px;padding:12px 14px}
.portrait .content{flex-direction:column}

.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);background:var(--ctrl);border:1px solid var(--bd-hi);font-size:18px;font-weight:700;white-space:nowrap}
.b svg{width:22px;height:22px;flex:none}
.b.dis{opacity:.32;cursor:not-allowed;background:var(--inset);border-style:dashed}
.b.exit{min-height:42px;font-size:16px}
.b.save{background:#1f4d2a;border-color:var(--ok);color:var(--ok-tx)}
.b.adv{background:var(--ctrl-on);border-color:var(--brand)}

/* 対のトグル（R4） */
.tg{display:flex;border-radius:12px;border:2px solid var(--bd-hi);overflow:hidden;min-height:56px;background:var(--inset)}
.tg > div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:800;gap:1px;position:relative}
.tg > div small{font-size:11px;font-weight:400;color:var(--mut)}
.tg .cur{background:var(--ctrl-on);color:#fff}
.tg .cur small{color:#cfe1f7}
.tg .nstop{background:#8e1f1f;color:#fff;cursor:pointer}
.tg .nrun{background:var(--ctrl);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 3px #fff}
.tg .nrun.blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}}
.tg .off{color:var(--dim)}
.tg .sep{flex:none;width:2px;background:var(--bd-hi)}
.tg .inert{color:var(--mut);cursor:pointer}

/* 右列（試験場内） */
.ctl{width:440px;flex:none;display:flex;flex-direction:column;gap:8px}
.portrait .ctl{width:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portrait .ctl .full{grid-column:1/-1}
.sec{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.sec h3{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px;letter-spacing:.05em}
.sec .row{display:flex;gap:8px}
.sec .row > *{flex:1}
.sec .why{height:18px;margin-top:6px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{padding:4px 2px}
.state .s1{font-size:22px;font-weight:800}
.state .s2{font-size:14px;color:var(--mut);margin-top:2px;min-height:20px}
.mseg{display:flex;border:1px solid var(--bd-hi);border-radius:10px;overflow:hidden;margin-bottom:8px}
.mseg > div{flex:1;text-align:center;padding:10px 4px;font-size:15px;font-weight:700;color:var(--mut);border-right:1px solid var(--bd-hi);cursor:pointer}
.mseg > div:last-child{border-right:none}
.mseg > div.on{background:var(--ctrl-on);color:#fff}
.mseg > div.dis{opacity:.35;cursor:not-allowed}
.mseg.dis > div{opacity:.35;cursor:not-allowed}

/* 主表示 */
.mainv{flex:1;min-width:0;min-height:0;position:relative;background:var(--inset);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.mainv svg.map{position:absolute;inset:0;width:100%;height:100%}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,17,23,.72)}
.center .card{background:var(--panel);border:1px solid var(--bd-hi);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:420px;text-align:center}
.center .card p{color:var(--mut);font-size:15px}
.center .card .b{min-height:64px;font-size:20px}
.flow{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(26,29,36,.96);border:1px solid var(--bd-hi);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px}
.flow .stp{font-size:13px;color:var(--brand-lt);font-weight:700;white-space:nowrap}
.flow .msg{flex:1;font-size:16px}
.radar{position:absolute;top:12px;right:12px;width:300px;height:300px;background:rgba(18,20,27,.95);border:1px solid var(--bd-hi);border-radius:12px}
.radar.big{position:absolute;inset:12px 12px 96px 12px;width:auto;height:auto}
.radar .cap{position:absolute;left:10px;top:8px;font-size:12px;color:var(--mut)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#263248;border:1px solid var(--brand);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:5}
.toast.show{opacity:1}

/* メインメニュー */
.tiles{flex:1;display:grid;gap:12px;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;min-height:0}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.portrait .tiles{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--panel);border:1px solid var(--bd-hi);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;padding:10px;text-align:center}
.tile svg{width:64px;height:64px}
.tile .nm{font-size:24px;font-weight:800}
.tile .nm .ar{font-size:18px;color:var(--mut);margin-left:4px}
.tile .why{font-size:13px;color:var(--warn-tx);min-height:18px}
.tile.dis{opacity:.38;cursor:not-allowed;border-style:dashed}
.tile.empty{visibility:hidden}
.tile.g{border-left-width:6px}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:12px}
.portrait .side{width:auto;display:grid;grid-template-columns:1fr 1fr}
.portrait .side .full{grid-column:1/-1}
.banner{display:flex;align-items:center;gap:12px;padding:0 14px;height:58px;font-size:22px;font-weight:800;border-radius:10px;margin-bottom:12px}
.banner svg{width:34px;height:34px}
.mcol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.kv{display:flex;align-items:center;gap:8px;font-size:15px}
.kv i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.cnt{margin-left:auto;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--ng);color:var(--ng-tx)}
.b.halt{background:#4a1717;border-color:#8e2b2b;color:var(--ng-tx);width:100%;margin-top:10px}
</style>
</head>
<body>
<div id="bar">
  <h1>UI 作り直しの案</h1>
  <span><span class="lbl">画面</span><span class="seg" id="scrSeg"></span></span>
  <span><span class="lbl">状態</span><span class="seg" id="subSeg"></span></span>
  <span><span class="lbl">向き</span><span class="seg" id="oriSeg"></span></span>
</div>
<div id="main">
  <div id="stageWrap"><div id="devBox"><div id="dev"></div></div></div>
  <div id="notes"></div>
</div>

<script>
/* ---------------- アイコン（インライン SVG・stroke） ---------------- */
const P = {
  field:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  drive:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M4.6 15.6l5.1-2.3M19.4 15.6l-5.1-2.3"/>',
  maint:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 10.5l1.6 1.6 3.4-3.4M8.5 16.5l1.6 1.6 3.4-3.4"/>',
  measure:'<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-5.5"/><circle cx="12" cy="17" r="1.4"/><path d="M6 13.5l1 .6M18 13.5l-1 .6M12 9v1.2"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  prep:'<path d="M3 6l6-2 6 2 6-2v8"/><path d="M3 6v14l6-2 4 1.4"/><path d="M9 4v14"/><path d="M15 21l1-3.5 5-5 2.5 2.5-5 5z"/>',
  day:'<path d="M5 21V3.5"/><path d="M5 4h12l-2.5 4.5L17 13H5"/>',
  follow:'<circle cx="7.5" cy="4.5" r="2"/><path d="M7.5 7.5v6l-2 6.5M7.5 13.5l2.5 6.5M4.5 10.5h6"/><path d="M14 12h7.5M18.5 9l3 3-3 3"/>',
  manual:'<circle cx="12" cy="6.5" r="3"/><path d="M12 9.5v6"/><rect x="4.5" y="15.5" width="15" height="5.5" rx="2"/>',
  teachF:'<circle cx="7" cy="4.5" r="2"/><path d="M7 7.5v6l-2 6.5M7 13.5l2.5 6.5M4 10.5h6"/><circle cx="17.5" cy="12" r="4.2"/><circle cx="17.5" cy="12" r="1.6" fill="currentColor"/>',
  teachM:'<circle cx="8" cy="7" r="2.6"/><path d="M8 9.6v5"/><rect x="2.5" y="14.6" width="11" height="5" rx="2"/><circle cx="17.5" cy="10" r="4.2"/><circle cx="17.5" cy="10" r="1.6" fill="currentColor"/>',
  replay:'<path d="M2.5 19c3.5-9 7.5 3 11.5-6.5"/><circle cx="2.5" cy="19" r="1" fill="currentColor"/><path d="M14.5 8.5l7 4-7 4z"/>',
  line:'<path d="M7 21.5L10.5 2.5M17 21.5L13.5 2.5"/><path d="M12 5.5v2.2M12 10.8v2.4M12 16.3v2.6"/>',
  leash:'<circle cx="6" cy="18" r="3.2"/><path d="M8.5 16C14 12 9.5 6.5 16.5 5"/><rect x="16" y="2" width="5.5" height="5.5" rx="1.2"/>',
  check:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 11.5l2 2 4.5-4.5"/>',
  calib:'<rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10.5 8v4M14.5 8v3M18.5 8v4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  home:'<path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v10h12V10"/>',
  panel:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  person:'<circle cx="12" cy="5" r="2.4"/><path d="M12 8.5v7l-2.5 6M12 15.5l2.5 6M8 12h8"/>',
  cam:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/><circle cx="12" cy="13.5" r="3.5"/>',
  jog:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  abort:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9l6 6M15 9l-6 6"/>',
  save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  stopSq:'<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/>',
  play:'<path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/>',
}
const ic = (k, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[k]}</svg>`

/* ---------------- 状態 ---------------- */
const S = {
  scr:'menu', ori:'L',
  menu:{lvl:'top', trackerOff:false, noRoute:false, cue:true},
  day:{sub:'home', how:'select', dest:null, sel:null, robot:'home', blink:true, flowStep:0},
  prep:{sub:'mapping', method:'person', reserved:'dim', reg:null, regStep:0, trackerOff:false, pins:6},
}
const SUBS = {
  menu:[['top','一番上'],['field','試験場 ▸'],['drive','走行 ▸'],['maint','点検と校正 ▸']],
  day:[['unloaded','地図未読込'],['undeclared','宣言前'],['home','待機'],['moving','移動中'],['paused','一時停止'],['panel','盤の前'],['summon','呼び寄せ']],
  prep:[['entry','入口'],['mapping','地図作成中'],['reg','人の位置で登録'],['return','待機場所へ戻る途中']],
}
const SCRS = [['menu','メインメニュー（M2）'],['day','試験（当日）F2'],['prep','試験準備']]
const subOf = () => S.scr==='menu' ? S.menu.lvl : S[S.scr].sub
function setSub(v){
  if (S.scr==='menu') S.menu.lvl=v
  else if (S.scr==='day'){ const d=S.day; d.sub=v; d.sel=null; d.flowStep=0
    d.robot = v==='panel' ? 'panel' : (v==='moving'||v==='paused') ? 'mid' : 'home'
    if ((v==='moving'||v==='paused') && !d.dest) d.dest='A-1'
    if (v==='home'||v==='panel'||v==='unloaded'||v==='undeclared') d.dest=null }
  else { const p=S.prep; p.sub=v; if (v==='reg'){ p.reg='HOME'; p.method='person'; p.regStep=1 } else { p.reg=null; p.regStep=0 } }
}

/* ---------------- 部品 ---------------- */
function btn(act, label, {icon, cls='', dis=false, id}={}){
  return `<button class="b ${cls} ${dis?'dis':''}" data-btn data-act="${dis?'':act}" ${id?`data-id="${id}"`:''}>${icon?ic(icon):''}<span>${label}</span></button>`
}
// 対のトグル。stop/run: 'cur' | 'en' | 'dis' | 'inert'（予約で押しても何も起きない）
function tog(stop, run, {runLabel='走行', blink=false, note=''}={}){
  const side = (k, st) => {
    const lab = k==='stop' ? '停止' : runLabel
    const icn = k==='stop' ? ic('stopSq','style="width:16px;height:16px"') : ic('play','style="width:16px;height:16px"')
    if (st==='cur') return `<div class="cur">${icn}<span>${lab}中</span><small>いまの状態</small></div>`
    if (st==='en') return k==='stop'
      ? `<div class="nstop" data-act="stop">${icn}<span>${lab}する</span><small>押すと止まる</small></div>`
      : `<div class="nrun ${blink?'blink':''}" data-act="run">${icn}<span>${lab}する</span><small>押すと続きを走る</small></div>`
    if (st==='inert') return `<div class="inert" data-act="inert">${icn}<span>${lab}</span><small>${note}</small></div>`
    return `<div class="off">${icn}<span>${lab}</span><small>${note}</small></div>`
  }
  const pressable = [stop,run].some(s=>s==='en'||s==='inert')
  return `<div class="tg" data-btn ${pressable?'':'data-dis'}>${side('stop',stop)}<span class="sep"></span>${side('run',run)}</div>`
}
function header(title, zone){
  return `<div class="hdr"><div class="r1"><div class="brand"><small>MIRS2602-</small>高見舎プロジェクト</div><div class="title">${title}</div></div>
  <div class="r2"><div class="st"><i></i>正常</div>${zone?'<span class="zone">試験場内・低速</span>':''}<div class="estop">非常停止</div></div></div>`
}

/* ---------------- 地図 ---------------- */
const PINS = [
  {id:'HOME', name:'待機場所', kind:'home', x:130, y:500},
  {id:'A-1', name:'盤 A-1', kind:'panel', x:300, y:110},
  {id:'A-2', name:'盤 A-2', kind:'panel', x:540, y:110},
  {id:'B-1', name:'盤 B-1', kind:'panel', x:800, y:130},
  {id:'B-2', name:'盤 B-2', kind:'panel', x:840, y:390},
  {id:'C-1', name:'盤 C-1', kind:'panel', x:540, y:440},
]
const pinById = id => PINS.find(p=>p.id===id)
function rand(seed){ let s=seed; return ()=>((s=(s*9301+49297)%233280)/233280) }
function mapSVG({robot, path, sel, selLabel, partial=false, pins=PINS, scan=true}){
  const r = rand(7); let pts=''
  if (scan) for (let i=0;i<140;i++){ const t=r()
    const [x,y] = t<.25?[40+r()*920,40]:t<.5?[40+r()*920,580]:t<.75?[40,40+r()*540]:[960,40+r()*540]
    pts += `<circle cx="${x+(r()-.5)*8}" cy="${y+(r()-.5)*8}" r="2.2" fill="#e05252" opacity=".55"/>` }
  const walls = `<rect x="40" y="40" width="920" height="540" fill="#1b1f27" stroke="#7d8696" stroke-width="5"/>
    <rect x="380" y="200" width="300" height="60" fill="#0f1117" stroke="#7d8696" stroke-width="4"/>
    <rect x="160" y="250" width="70" height="140" fill="#0f1117" stroke="#7d8696" stroke-width="4"/>
    <rect x="700" y="470" width="160" height="50" fill="#0f1117" stroke="#7d8696" stroke-width="4"/>`
  const clip = partial ? `<clipPath id="exp"><path d="M40 40H700L760 180L640 330L480 380L330 600H40Z"/></clipPath>` : ''
  let pinG=''
  for (const p of pins){
    const isSel = sel===p.id
    pinG += `<g data-act="pin" data-id="${p.id}" style="cursor:pointer">
      <circle cx="${p.x}" cy="${p.y}" r="34" fill="transparent"/>
      ${p.kind==='home'
        ? `<path d="M${p.x-16} ${p.y+2}L${p.x} ${p.y-14}L${p.x+16} ${p.y+2}V${p.y+16}H${p.x-16}Z" fill="${isSel?'#8fd694':'#4caf50'}" stroke="#0f1117" stroke-width="2"/>`
        : `<rect x="${p.x-14}" y="${p.y-14}" width="28" height="28" rx="4" fill="${isSel?'#7fb4ee':'#3f8ae0'}" stroke="#0f1117" stroke-width="2"/>`}
      ${isSel?`<circle cx="${p.x}" cy="${p.y}" r="26" fill="none" stroke="#fff" stroke-width="3"/>`:''}
      <text x="${p.x}" y="${p.y+40}" text-anchor="middle" font-size="22" font-weight="700" fill="#e6e8ec" stroke="#0f1117" stroke-width="5" paint-order="stroke">${p.name}</text></g>`
  }
  let bubble=''
  if (sel){ const p=pinById(sel); const bx=Math.min(Math.max(p.x-130,50),690), by=p.y>300?p.y-170:p.y+60
    bubble = `<g><rect x="${bx}" y="${by}" width="260" height="104" rx="12" fill="#232733" stroke="#7fb4ee" stroke-width="2"/>
      <text x="${bx+16}" y="${by+34}" font-size="24" font-weight="800" fill="#fff">${p.name}</text>
      <g data-act="pinGo" data-btn style="cursor:pointer"><rect x="${bx+14}" y="${by+48}" width="232" height="44" rx="8" fill="#2c4a74" stroke="#3f8ae0" stroke-width="2"/>
      <text x="${bx+130}" y="${by+78}" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">${selLabel}</text></g></g>`
  }
  const rb = robot ? `<g transform="translate(${robot[0]} ${robot[1]}) rotate(${robot[2]})"><circle r="24" fill="#3f8ae0" opacity=".25"/><path d="M-14 -14L18 0L-14 14Z" fill="#7fb4ee" stroke="#fff" stroke-width="2"/></g>` : ''
  const pl = path ? `<polyline points="${path.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ffd54f" stroke-width="5" stroke-dasharray="14 9"/>` : ''
  return `<svg class="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">${clip}
    <g ${partial?'clip-path="url(#exp)"':''}>${walls}</g>${partial?'<path d="M40 40H700L760 180L640 330L480 380L330 600H40Z" fill="none" stroke="#3a3f4c" stroke-dasharray="6 6"/>':''}
    ${pts}${pl}${pinG}${rb}${bubble}</svg>`
}
function radarSVG(big){
  const cands=[[60,-90,true],[-110,-40,false],[130,60,false],[-70,110,false]]
  let c=''
  cands.forEach(([x,y,s],i)=>{ c+=`<g><circle cx="${150+x}" cy="${150+y}" r="${s?15:11}" fill="${s?'#4caf50':'#8b93a1'}"/>${s?`<circle cx="${150+x}" cy="${150+y}" r="24" fill="none" stroke="#8fd694" stroke-width="3"/>`:''}<text x="${150+x}" y="${150+y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1117">${i+1}</text></g>` })
  return `<div class="radar ${big?'big':''}"><span class="cap">対象: 1 番（信頼度 87%）— 別の人を押すと切り替え</span>
    <svg viewBox="0 0 300 300" style="width:100%;height:100%"><circle cx="150" cy="150" r="60" fill="none" stroke="#2a2d35"/><circle cx="150" cy="150" r="120" fill="none" stroke="#2a2d35"/>
    <path d="M150 20V280M20 150H280" stroke="#2a2d35"/><path d="M140 160L150 135L160 160Z" fill="#7fb4ee"/>${c}</svg></div>`
}

function dayView(){
  const d=S.day, s=d.sub
  const ROBOT = {home:[130,450,-90], mid:[300,300,-90], panel:[300,170,-90], off:[620,330,180]}
  const destPin = d.dest && pinById(d.dest)
  const atHomeLike = s==='home'
  const choose = (s==='home'||s==='panel')
  // 9 個のボタンの押せる・押せない（位置は固定）
  const E = {stop:'cur', run:'dis', manual:true, abort:false, home:false, next:false, summon:false, measure:false, cam:false}
  let whyDest='', whyPanel='盤の前に着いたら押せます', runNote=''
  if (s==='unloaded'){ whyDest='会場地図を開いてから選べます'; runNote='行き先がありません' }
  else if (s==='undeclared'){ whyDest='待機場所にいることを宣言してから選べます'; runNote='行き先がありません' }

  else if (s==='moving'){ E.stop='en'; E.run='cur'; whyDest='移動中は選べません（「停止」してから「中断」で選び直し）' }
  else if (s==='paused'){ E.run='en'; E.abort=true; whyDest='一時停止中は選べません（「走行」で続き／「中断」で選び直し）' }
  else if (s==='summon'){ E.abort=true; whyDest='呼び寄せの位置を指定しています（やめるときは「中断」）'; runNote='位置を指定すると出発します' }

  const st = {
    unloaded:['会場地図が開かれていません','地図の中央のボタンから開きます'],
    undeclared:['待機場所にいることを宣言してください','機体が待機場所にあることを確かめてから押します'],
    home:[ d.robot==='off'?'待機中 — 行き先を選んでください':'待機中 — 待機場所', d.dest&&d.how==='select' ? `行き先: ${destPin.name} —「走行する」で出発` : '行き先は地図のピンか下のボタンで選びます'],
    moving:[`移動中 → ${destPin?.name??''}`, '残り 4.2 m'],
    paused:[`一時停止中 → ${destPin?.name??''}`, '「走行する」で続きを走ります'],
    panel:[`盤の前 — 盤 A-1`, d.dest&&d.how==='select' ? `次の行き先: ${destPin.name} —「走行する」で出発` : '測定・撮影ができます'],
    summon:['呼び寄せ — 位置の指定', `${d.flowStep===2?'② 機体に向いてほしい方向':'① 機体に来てほしい位置'}に立って「記録」`],
  }[s]

  // 主表示
  let mainInner = ''
  const robot = ROBOT[d.robot]
  const path = (s==='moving'||s==='paused') ? [[130,450],[130,300],[300,300],[300,140]] : null
  const selLabel = d.how==='select' ? '行き先にする' : 'ここへ移動'
  if (s==='unloaded'){
    mainInner = `<div class="center" style="background:var(--inset)"><div class="card"><p>機体を待機場所に置いてから押します</p>${btn('openMap','会場地図を開く',{icon:'field',cls:'adv'})}</div></div>`

    if (s==='summon') mainInner += radarSVG(false) + `<div class="flow"><span class="stp">呼び寄せ ${d.flowStep||1}/2</span><span class="msg">${d.flowStep===2?'機体に向いてほしい方向へ 1 歩動いて「記録」':'機体に来てほしい位置に立って「記録」'}</span>${btn('rec','記録',{cls:'adv'})}</div>`
  }

  const ctl = `<div class="ctl">
    <div class="state full"><div class="s1">${st[0]}</div><div class="s2">${st[1]}</div></div>

      <div class="row" style="margin-top:8px">${btn('jog','手動',{icon:'jog',dis:!E.manual})}${btn('abort','中断',{icon:'abort',dis:!E.abort})}</div></div>
    <div class="sec"><h3>行き先</h3><div class="row">${btn('goHome','待機場所',{icon:'home',dis:!E.home})}${btn('goNext','次の配電盤',{icon:'panel',dis:!E.next})}</div>
      <div class="row" style="margin-top:8px">${btn('summon','呼び寄せ',{icon:'person',dis:!E.summon})}</div><div class="why">${whyDest}</div></div>

  </div>`
  return header('試験', true) + `<div class="body"><div class="opbar">${btn('toast:メインメニュー（試験場の階層）へ戻る','終了',{icon:'close',cls:'exit'})}</div>
    <div class="content"><div class="mainv">${mainInner}</div>${ctl}</div></div>`
}

const METHODS = [['person','人の位置で'],['pose','いまの姿勢で'],['tap','地図をタップして']]
function prepView(){

  const mapping = s==='mapping'
  const reserved = p.reserved==='dim' ? 'dis' : 'inert'

  if (s==='return'){ stop='en'; run='cur'; runNote='' }
  const canReg = mapping
  const personDis = p.trackerOff
  const st = {
    entry:['前回の地図とピンが残っています', `ピン ${p.pins} 件（待機場所 1・配電盤 5）`],
    mapping:['地図作成中 — 未保存の変更あり', `ピン ${p.pins} 件。方式を選んでから登録先を押します`],
    reg:['待機場所を登録中（人の位置で）', p.regStep===2?'② 機体に向いてほしい方向へ 1 歩動いて「記録」':'① 待機場所に立って「記録」'],
    return:['待機場所へ戻る途中', '「停止する」で止まります'],
  }[s]
  let mainInner = mapSVG({robot:s==='return'?[300,330,135]:[420,300,180], path:s==='return'?[[300,330],[130,330],[130,450]]:null, partial:true, scan:true})
  if (s==='entry') mainInner += `<div class="center"><div class="card"><p>前回の試験場内地図とピン（${p.pins} 件）が残っています</p>
      ${btn('resume','続きから再開',{icon:'play',cls:'adv'})}
      ${btn('fresh','新しい試験日として開始（前回を消す）',{icon:'close'})}<p style="font-size:13px">「新しい試験日」は押したあともう一度確かめてから消します</p></div></div>`
  if (mapping && p.method==='person' && !personDis) mainInner += radarSVG(false)
  if (mapping && p.method==='tap') mainInner += `<div class="flow"><span class="stp">地図をタップして</span><span class="msg">登録先を押したあと、地図の上で位置を押し、向きの方向へなぞります</span></div>`
  if (s==='reg') mainInner += radarSVG(false) + `<div class="flow"><span class="stp">待機場所 ${p.regStep}/2</span><span class="msg">${p.regStep===2?'機体に向いてほしい方向へ 1 歩動いて「記録」':'待機場所に立って「記録」'}</span>${btn('regRec','記録',{cls:'adv'})}${btn('regCancel','やめる')}</div>`

  const regWhy = s==='entry' ? '地図作成を始めてから登録できます' : s==='reg' ? '登録中です（やめるときは地図の上の「やめる」）' : s==='return' ? '待機場所へ戻る途中は登録できません' : (p.method==='person'&&personDis ? '人検出が止まっているため「人の位置で」は使えません' : '')
  const mseg = `<div class="mseg ${canReg?'':'dis'}" data-btn ${canReg?'':'data-dis'}>${METHODS.map(([k,n])=>`<div class="${p.method===k?'on':''} ${k==='person'&&personDis?'dis':''}" data-act="${canReg&&!(k==='person'&&personDis)?'method':''}" data-id="${k}">${n}</div>`).join('')}</div>`
  const regDis = !canReg || (p.method==='person'&&personDis)
  const ctl = `<div class="ctl">
    <div class="state full"><div class="s1">${st[0]}</div><div class="s2">${st[1]}</div></div>
    <div class="sec full"><h3>操作</h3>${tog(stop, run, {note: runNote})}
      <div class="row" style="margin-top:8px">${btn('toast:地図とピンを保存した','保存',{icon:'save',cls:'save',dis:!(mapping)})}${btn('jog','手動',{icon:'jog'})}</div></div>
    <div class="sec full"><h3>登録 — ① 方式 → ② 登録先</h3>${mseg}
      <div class="row">${btn('regHome','待機場所を登録',{icon:'home',dis:regDis})}${btn('regPanel','配電盤を登録',{icon:'panel',dis:regDis})}</div><div class="why">${regWhy}</div></div>
    <div class="sec full"><h3>戻す</h3>${btn('goHome','待機場所に戻る',{icon:'home',dis:!mapping})}</div>
  </div>`
  const unsaved = s!=='entry' ? '<span class="pill">未保存</span>' : ''
  return header('試験準備', true) + `<div class="body"><div class="opbar">${btn('toast:未保存があれば保存するか確かめてからメインメニューへ','終了',{icon:'close',cls:'exit'})}${unsaved}</div>
    <div class="content"><div class="mainv">${mainInner}</div>${ctl}</div></div>`
}

/* ---------------- 操作 ---------------- */
let toastT
function toast(msg){ const t=document.querySelector('#dev .toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600) }
const NEXT_PANEL = {HOME:'A-1','A-1':'A-2','A-2':'B-1','B-1':'B-2','B-2':'C-1','C-1':'HOME'}
function act(a, id){
  if (!a) return
  if (a.startsWith('toast:')) return toast(a.slice(6))
  if (a.startsWith('go:')){ S.menu.lvl=a.slice(3); return render() }
  if (a.startsWith('open:')){ S.scr=a.slice(5); if (S.scr==='prep') setSub('entry'); else setSub('unloaded'); return render() }
  const d=S.day, p=S.prep
  if (S.scr==='day'){
    const depart = dest => { d.dest=dest; d.sel=null; if (d.how==='go'){ d.sub='moving'; d.robot='mid' } render() }
    switch(a){
      case 'openMap': d.sub='undeclared'; break
      case 'declare': d.sub='home'; d.robot='home'; break
      case 'pin': if (d.sub==='home'||d.sub==='panel'){ d.sel = d.sel===id?null:id } break
      case 'pinGo': return depart(d.sel)
      case 'goHome': return depart('HOME')
      case 'goNext': return depart(d.sub==='panel' ? 'A-2' : 'A-1')
      case 'run': if (d.sub==='paused'||d.dest){ d.sub='moving'; d.robot='mid'; d.sel=null } break
      case 'stop': d.sub='paused'; break
      case 'abort': d.robot = d.sub==='summon' ? d.robot : 'off'; d.sub='home'; d.dest=null; d.flowStep=0; break
      case 'summon': d.sub='summon'; d.flowStep=1; d.sel=null; break
      case 'rec': if (d.flowStep<2){ d.flowStep=2 } else { d.dest='HOME'; d.sub='moving'; d.robot='mid'; d.flowStep=0; toast('呼び寄せの位置へ移動します') } break
      case 'jog': toast('手動操作パネル（W-6）が開く。触れたら一時停止'); if (d.sub==='moving'){ d.sub='paused' } break
    }
    return render()
  }
  if (S.scr==='prep'){
    switch(a){
      case 'resume': p.sub='mapping'; break
      case 'fresh': p.sub='mapping'; p.pins=0; toast('前回の地図とピンを消して、地図作成を始めた'); break
      case 'method': p.method=id; break
      case 'regHome': case 'regPanel': {
        const kind = a==='regHome' ? '待機場所' : '配電盤'
        if (p.method==='person'){ p.sub='reg'; p.regStep=1 }
        else if (p.method==='pose'){ p.pins++; toast(`いまの機体の位置で${kind}を登録した`) }
        else toast(`地図の上で${kind}の位置を押してください`)
        break }
      case 'regRec': if (p.regStep<2) p.regStep=2; else { p.sub='mapping'; p.pins++; toast('待機場所を登録した') } break
      case 'regCancel': p.sub='mapping'; break
      case 'goHome': p.sub='return'; break
      case 'stop': p.sub='mapping'; toast('止まった（帰還を取りやめ）'); break
      case 'inert': toast('押しても何も起きない（追従走行の予約）'); break
      case 'jog': toast('手動操作パネル（W-6）が開く'); break
    }
    return render()
  }
}

function countButtons(){
  const all=[...document.querySelectorAll('#dev [data-btn]')]
  const dis=all.filter(e=>e.classList.contains('dis')||e.hasAttribute('data-dis'))
  return [all.length, dis.length]
}
function renderNotes(){
  const n=NOTES[S.scr], [c,dc]=countButtons()
  const pinNote = S.scr==='menu' ? '' : '（地図のピンは数えない）'
  const cur = (k)=>S[k[0]][k[1]]
  document.getElementById('notes').innerHTML = `
    <h2>この状態のボタン</h2><div class="count"><b>${c}</b> 個（うち押せない ${dc}）${pinNote}<div class="ref">「操作のトグル」「方式の切り替え」は 1 個と数える。ヘッダの非常停止は除く</div></div>
    <h2>変えたところ</h2><ul>${n.changed.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h2>比べて決めてほしいこと</h2>${n.opts.map((o,i)=>`<div class="opt"><div class="q">${o.q}</div><span class="seg">${o.v.map(([v,l])=>`<button class="${cur(o.k)===v?'on':''}" data-opt="${i}" data-v='${JSON.stringify(v)}'>${l}</button>`).join('')}</span><div class="ref">${o.why}</div></div>`).join('')}
    <h2>見てほしいところ</h2><ul>${n.look.map(x=>`<li>${x}</li>`).join('')}</ul>
    <p class="ref" style="margin-top:14px">画面の中のボタンは押せます（動きは仮）。案の本文は docs/plan/ui-redesign-options.md。</p>`
}

/* ---------------- 描画 ---------------- */
function segHTML(items, cur, attr){ return items.map(([v,l])=>`<button class="${cur===v?'on':''}" ${attr}="${v}">${l}</button>`).join('') }
function render(){
  document.getElementById('scrSeg').innerHTML = segHTML(SCRS, S.scr, 'data-scr')
  document.getElementById('subSeg').innerHTML = segHTML(SUBS[S.scr], subOf(), 'data-sub')
  document.getElementById('oriSeg').innerHTML = segHTML([['L','横長 1280×720'],['P','縦長 960×1280']], S.ori, 'data-ori')
  const dev=document.getElementById('dev')
  const [W,H] = S.ori==='L' ? [1280,720] : [960,1280]
  dev.style.width=W+'px'; dev.style.height=H+'px'
  dev.className = S.ori==='P' ? 'portrait' : ''
  dev.innerHTML = (S.scr==='menu'?menuView():S.scr==='day'?dayView():prepView()) + '<div class="toast"></div>'
  if (S.ori==='P') dev.querySelectorAll('.content').forEach(c=>{ const mv=c.querySelector('.mainv'); if (mv) mv.style.minHeight='560px' })
  fit(); renderNotes()
}
function fit(){
  const wrap=document.getElementById('stageWrap'), dev=document.getElementById('dev'), box=document.getElementById('devBox')
  const W=parseFloat(dev.style.width), H=parseFloat(dev.style.height)
  const sc=Math.min((wrap.clientWidth-24)/W,(wrap.clientHeight-24)/H,1.4)
  dev.style.transform=`scale(${sc})`; box.style.width=W*sc+'px'; box.style.height=H*sc+'px'
}
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-scr],[data-sub],[data-ori],[data-opt],[data-act]')
  if (!t) return
  if (t.dataset.scr){ S.scr=t.dataset.scr; return render() }
  if (t.dataset.sub){ setSub(t.dataset.sub); return render() }
  if (t.dataset.ori){ S.ori=t.dataset.ori; return render() }
  if (t.dataset.opt!==undefined){ const o=NOTES[S.scr].opts[+t.dataset.opt]; S[o.k[0]][o.k[1]]=JSON.parse(t.dataset.v); return render() }
  if (t.closest('.dis,[data-dis]') && !t.dataset.act) return
  act(t.dataset.act, t.dataset.id)
})
window.addEventListener('resize', fit)
render()
