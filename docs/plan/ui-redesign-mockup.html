<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 作り直しの案</title>
<style>
/* ============================================================
   WebUI の作り直し — 案の画面（docs/plan/ui-redesign.md）
   未確定の検討メモの付録。正本のモックアップ（spec/mockup/）ではない。
   外部リソースを一切読み込まない（機体の AP 配下にネットが無いため）。
   ============================================================ */
:root{
  --bg:#0f1117; --panel:#1a1d24; --inset:#12141b;
  --ctrl:#252830; --ctrl-hi:#343849; --ctrl-on:#2c4a74;
  --bd:#2a2d35; --bd-hi:#3a3f4c;
  --tx:#e6e8ec; --mut:#8b93a1; --dim:#5c6470;
  --brand:#3f8ae0; --brand-lt:#7fb4ee; --brand-dk:#12233d;
  --ok:#4caf50; --ok-tx:#8fd694;
  --warn:#ffb74d; --warn-tx:#ffcc80;
  --ng:#ef5350; --ng-tx:#ff9b98;
  --estop:#c62828; --estop-hi:#e53935;
  --g-field:#26a69a; --g-drive:#3f8ae0; --g-maint:#a1887f;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07090d;color:var(--tx);font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- 外側（説明・切り替え） ---------- */
#bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);background:#0b0d12}
#bar h1{font-size:15px;font-weight:700;color:var(--mut);margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--bd-hi);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--mut);border-right:1px solid var(--bd-hi)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ctrl-on);color:#fff;font-weight:700}
.lbl{font-size:12px;color:var(--mut);margin-right:4px}
#main{flex:1;display:flex;min-height:0}
#stageWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
#notes{width:360px;flex:none;border-left:1px solid var(--bd);background:#0b0d12;overflow:auto;padding:14px 16px;font-size:13px;line-height:1.65}
#notes h2{font-size:14px;margin:14px 0 6px;color:var(--brand-lt)}
#notes h2:first-child{margin-top:0}
#notes ul{padding-left:18px}
#notes li{margin:3px 0}
#notes .count{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px}
#notes .count b{font-size:18px}
#notes .opt{margin:6px 0 10px}
#notes .opt .q{color:var(--tx);font-weight:700;margin-bottom:4px}
#notes .ref{color:var(--mut);font-size:12px}
@media (max-width:1000px){#main{flex-direction:column}#notes{width:auto;border-left:none;border-top:1px solid var(--bd);max-height:40vh}}

/* ---------- 機体の画面（論理サイズで描き、縮小して見せる） ---------- */
#dev{position:relative;background:var(--bg);overflow:hidden;transform-origin:top left;flex:none;box-shadow:0 0 0 1px var(--bd-hi),0 10px 40px #000}
#devBox{flex:none}
.hdr{height:110px;display:flex;flex-direction:column;border-bottom:2px solid var(--brand)}
.hdr .r1{height:50px;display:flex;align-items:center;padding:0 14px;background:linear-gradient(#182a45,#121c2c)}
.hdr .logo{flex:none;width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:8px}
.hdr .brand{flex:none;font-size:14px;line-height:1.2;color:#fff;font-weight:700}
.hdr .brand small{display:block;color:var(--brand-lt);font-size:11px;font-weight:400}
.hdr .title{flex:0 1 auto;min-width:0;margin-left:16px;font-size:26px;font-weight:800;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .gap{flex:1}
.hdr .zone{flex:none;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--warn);color:var(--warn-tx);white-space:nowrap}
.hdr .mst{flex:none;margin-left:8px;font-size:18px;font-weight:800;padding:3px 12px;border-radius:8px;background:#22314a;color:#fff;white-space:nowrap}
.hdr .mst.run{background:var(--brand)}
.hdr .mst.pause{background:var(--warn);color:#111}
.hdr .r2{flex:1;display:flex;align-items:stretch;background:#121722}
.hdr .st{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:16px}
.hdr .st i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
/* 非常停止（D39。2026-11-17）: 画面の中身とは別に、最初に描いていちばん上に重ねる。ほかの表示が壊れても残り、押せる */
.estop-top{position:absolute;z-index:100;right:6px;top:53px;height:51px;width:320px;box-sizing:border-box;border-radius:10px;border:2px solid #ff8a80;background:linear-gradient(#e53935,#b71c1c);color:#fff;font-size:26px;font-weight:800;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #6d1010,0 6px 10px #0009,inset 0 1px 0 #ffffff55;text-shadow:0 1px 2px #0008;cursor:pointer}
.estop-top:active{transform:translateY(3px);box-shadow:0 1px 0 #6d1010,inset 0 1px 0 #ffffff55}
.body{position:absolute;left:0;right:0;top:110px;bottom:0;display:flex;flex-direction:column}
.opbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--bd)}
.opbar .crumb{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.opbar .crumb svg{width:28px;height:28px}
.opbar .pill{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--ng);color:var(--ng-tx)}
.content{flex:1;min-height:0;display:flex;gap:12px;padding:12px 14px}
.portrait .content{flex-direction:column}

.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);background:var(--ctrl);border:1px solid var(--bd-hi);font-size:18px;font-weight:700;white-space:nowrap}
.b svg{width:22px;height:22px;flex:none}
.b.dis{opacity:.32;cursor:not-allowed;background:var(--inset);border-style:dashed}
.b.exit{min-height:42px;font-size:16px}
.b.save{background:#1f4d2a;border-color:var(--ok);color:var(--ok-tx)}
.b.adv{background:var(--ctrl-on);border-color:var(--brand)}

/* 対のトグル（R4） */
.tg{display:flex;border-radius:12px;border:2px solid var(--bd-hi);overflow:hidden;min-height:56px;background:var(--inset)}
.tg > div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:800;gap:1px;position:relative}
.tg > div small{font-size:11px;font-weight:400;color:var(--mut)}
.tg .cur{background:var(--ctrl-on);color:#fff}
.tg .cur small{color:#cfe1f7}
.tg .nstop{background:#8e1f1f;color:#fff;cursor:pointer}
.tg .nrun{background:var(--ctrl);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 3px #fff}
.tg .nrun.blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}}
.tg .off{color:var(--dim)}
.tg .sep{flex:none;width:2px;background:var(--bd-hi)}
.tg .inert{color:var(--mut);cursor:pointer}
.tg .press{background:var(--ctrl);cursor:pointer}
.tg.big{min-height:76px}
.tg.big > div{font-size:23px}
.tg.big > div small{font-size:12px}
.b.two span{line-height:1.15;text-align:left}
.b.two span small{display:block;font-size:14px;font-weight:700;color:var(--brand-lt);min-height:16px}
.b.f16{font-size:16px;padding:0 10px}
.sec.noh h3{display:none}
#dev [data-help]{-webkit-touch-callout:none;user-select:none}
.help{position:absolute;width:340px;background:#20283a;border:2px solid var(--brand-lt);border-radius:12px;padding:12px 14px;z-index:9;box-shadow:0 8px 28px #000a}
.help .ht{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:6px}
.help .ht span{flex:1}
.help .hx{flex:none;width:40px;height:40px;border-radius:8px;background:var(--ctrl);border:1px solid var(--bd-hi);display:none;align-items:center;justify-content:center}
.help .hx svg{width:20px;height:20px}
.help.sticky .hx{display:flex}
.help p{font-size:15px;line-height:1.6;color:#d6dbe4}

/* 2026-11-16 決定（D28）: 区画の枠なし・アイコンはメインメニューだけ・押せないボタンは点線にしない */
.sec{background:transparent !important;border-color:transparent !important}
.b{font-weight:600}
.b.dis{border-style:solid !important;background:var(--ctrl) !important;opacity:.36}

/* ボタンの形の比較（2026-11-16。位置と大きさは変えない） */
.shape-sq{--r:3px}
.shape-sq .tg,.shape-sq .mseg,.shape-sq .tile,.shape-sq .estop-top{border-radius:3px}
.shape-pill .b{border-radius:999px}
.shape-pill .tg,.shape-pill .mseg{border-radius:999px}
.shape-role .b{border-radius:3px}
.shape-role .tg,.shape-role .mseg{border-radius:4px}
.shape-role .b.go,.shape-role .b.adv{border-radius:999px}
.shape-role .b.exit{border-radius:3px 14px 14px 3px}

.mapctl{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;z-index:3}
.mapctl .b{min-height:44px;font-size:16px;background:#232733e6}

/* 右列（試験場内） */
.ctl{width:440px;flex:none;display:flex;flex-direction:column;gap:8px}
.portrait .ctl{width:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portrait .ctl .full{grid-column:1/-1}
.sec{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.sec h3{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px;letter-spacing:.05em}
.sec .row{display:flex;gap:8px}
.sec .row > *{flex:1}
.sec .why{height:18px;margin-top:6px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{padding:4px 2px}
.state .s1{font-size:22px;font-weight:800;height:32px;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state .s2{font-size:14px;color:var(--mut);margin-top:2px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden}
.mseg{display:flex;border:1px solid var(--bd-hi);border-radius:10px;overflow:hidden;margin-bottom:8px}
.mseg > div{flex:1;text-align:center;padding:10px 4px;font-size:15px;font-weight:700;color:var(--mut);border-right:1px solid var(--bd-hi);cursor:pointer}
.mseg > div:last-child{border-right:none}
.mseg > div.on{background:var(--ctrl-on);color:#fff}
.mseg > div.dis{opacity:.35;cursor:not-allowed}
.mseg.dis > div{opacity:.35;cursor:not-allowed}

/* 主表示 */
.mainv{flex:1;min-width:0;min-height:0;position:relative;background:var(--inset);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.mainv svg.map{position:absolute;inset:0;width:100%;height:100%}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,17,23,.72)}
.center .card{background:var(--panel);border:1px solid var(--bd-hi);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:420px;text-align:center}
.center .card p{color:var(--mut);font-size:15px}
.center .card .b{min-height:64px;font-size:20px}
.flow{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(26,29,36,.96);border:1px solid var(--bd-hi);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px}
.flow .stp{font-size:13px;color:var(--brand-lt);font-weight:700;white-space:nowrap}
.flow .msg{flex:1;font-size:16px}
.radar{position:absolute;top:12px;right:12px;width:300px;height:300px;background:rgba(18,20,27,.95);border:1px solid var(--bd-hi);border-radius:12px}
.radar.big{position:absolute;inset:12px 12px 96px 12px;width:auto;height:auto}
.radar .cap{position:absolute;left:10px;top:8px;font-size:12px;color:var(--mut)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#263248;border:1px solid var(--brand);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:5}
.toast.show{opacity:1}
/* 押せない理由（§6.6）: 押したボタンのすぐ上（入らなければ下）に、そのボタンを指して出す */
.why-pop{position:absolute;z-index:60;max-width:460px;background:#263248;border:2px solid var(--mut);color:#fff;padding:10px 14px;border-radius:10px;font-size:17px;line-height:1.4;pointer-events:none;box-shadow:0 6px 18px #000a}
.why-pop::after{content:'';position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#263248;border:2px solid var(--mut);transform:translateX(-50%) rotate(45deg)}
.why-pop.up::after{bottom:-8px;border-top:none;border-left:none}
.why-pop.down::after{top:-8px;border-bottom:none;border-right:none}

/* メインメニュー */
.tiles{flex:1;display:grid;gap:12px;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;min-height:0}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--panel);border:1px solid var(--bd-hi);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;padding:10px;text-align:center}
.tile svg{width:64px;height:64px}
.tile .nm{font-size:24px;font-weight:800}
.tile .nm .ar{font-size:18px;color:var(--mut);margin-left:4px}
.tile .why{font-size:13px;color:var(--warn-tx);min-height:18px}
.tile.dis{opacity:.38;cursor:not-allowed;border-style:dashed}
.tile.empty{visibility:hidden}
.tile.l svg{width:92px;height:92px}
.tile.l .nm{font-size:32px}
.tile.s{flex-direction:row;gap:14px}
.tile.s svg{width:36px;height:36px}
.tile.s .nm{font-size:20px}
.tg.sm{min-height:42px;border-radius:10px;width:250px}
.tg.sm > div{font-size:15px;flex-direction:row;gap:6px}
.tg.sm > div small{display:none}
.opbar .cap{font-size:14px;color:var(--mut);margin-left:14px;font-weight:700}
.tile.g{border-left-width:6px}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:12px}
.portrait .side{width:auto;display:grid;grid-template-columns:1fr 1fr}
.portrait .side .full{grid-column:1/-1}
.banner{display:flex;align-items:center;gap:12px;padding:0 14px;height:58px;font-size:22px;font-weight:800;border-radius:10px;margin-bottom:12px}
.banner svg{width:34px;height:34px}
.mcol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.kv{display:flex;align-items:center;gap:8px;font-size:15px}
.kv i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.cnt{margin-left:auto;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--ng);color:var(--ng-tx)}
.b.halt{background:#4a1717;border-color:#8e2b2b;color:var(--ng-tx);width:100%;margin-top:10px}

/* ============================================================
   2026-11-17 評価（critique）を受けた修正案（ui-redesign-options.md §6）
   どれも案。切り替えで 11-16 の版（下の上書きが効かない状態）と比べられる。
   ============================================================ */

/* §6.1 重さ: 塗るのは「いま押せる側」だけ。語は動詞で固定 */
.tg2 > div{font-weight:800}
.tg2 .idle{color:var(--dim);background:var(--inset)}
.tg2 .go-stop{background:#b3261e;color:#fff;cursor:pointer}
.tg2 .go-run{background:var(--act,var(--ctrl-on));color:#fff;cursor:pointer;box-shadow:inset 0 0 0 3px #fff}
.tg2 .go-run.blink{animation:blink2 1.1s ease-in-out infinite}
@keyframes blink2{50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);filter:brightness(1.25)}}
.tg.sm .curoff{background:var(--ctrl-hi);color:var(--tx)}
.where{display:flex;align-items:baseline;gap:12px;height:40px;padding:0 2px;white-space:nowrap;overflow:hidden}
.where span{flex:1;min-width:0;font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.where b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.b.next{width:100%;min-height:64px}
.b.next span small{font-size:16px}
.b.next.adv span small{color:#dbe7fb}
.b.next:not(.adv) span small{color:var(--mut)}

/* §6.2 大きさ: タブレット（iPad）では論理キャンバスが 0.8 倍に縮む。縮んでも押す的 44 px・文字 12 px を割らないよう、
   論理 px で 押す的 56 以上・文字 15 以上にする。非常停止（76）は画面でいちばん高いボタンに保つ */
.sz-new .hdr{height:134px}
.sz-new .hdr .r1{height:48px}
.sz-new .hdr .logo{font-size:13px}
.sz-new .hdr .brand small{font-size:13px}
.sz-new .hdr .zone{font-size:15px}
.sz-new .hdr .r2{align-items:center}
.sz-new .estop-top{top:52px;height:76px;width:max(330px,26%);font-size:28px}
.sz-new.portrait .estop-top{width:47%}
.sz-new .body{top:134px}
.sz-new .opbar{height:68px}
.sz-new .b,.sz-new .b.exit{min-height:56px}
.sz-new .b.exit{font-size:17px}
.sz-new .sec{padding:2px 2px}
.sz-new .sec h3{font-size:15px;margin-bottom:6px}
.sz-new .ctl{width:400px;gap:10px}
.sz-new.portrait .ctl{width:auto}
.sz-new .tg{min-height:60px}
.sz-new .tg.big{min-height:68px}
.sz-new .tg.sm{min-height:60px;width:260px}
.sz-new .tg.sm > div{font-size:17px}
.sz-new .opbar .cap{font-size:16px}
.sz-new .mseg > div{min-height:56px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1.2}
.sz-new .mapctl .b{min-height:56px}
.sz-new .tile .why{font-size:15px}
.sz-new .kv{font-size:16px}
.sz-new .cnt,.sz-new .opbar .pill{font-size:15px}
.sz-new .radar .cap,.sz-new .flow .stp{font-size:15px}
.sz-new .flow .msg{font-size:17px}
.sz-new .center .card .b{min-height:64px}
.sz-new .center .card p{font-size:17px}
.sz-new .radar:not(.big){width:250px;height:250px}
.sz-new .mainv.withradar svg.map{width:calc(100% - 274px)}
.sz-new .mainv.withflow svg.map{height:calc(100% - 96px)}
.sz-new .mapctl{top:10px;bottom:auto}
.sz-new .b.caution{border-color:var(--warn);color:var(--warn-tx)}
.bub{position:absolute;width:280px;background:#232733;border:2px solid var(--act-lt,#7fb4ee);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;z-index:4;box-shadow:0 6px 20px #000a}
.bub .nm{font-size:22px;font-weight:800}
.bub .b{width:100%;min-height:60px;font-size:20px}

/* §6.5 自律走行中の枠（案）: 画面の縁を「進む」の青で囲む。非常停止（z 100）より下、押す操作は邪魔しない */
.autoframe{position:absolute;left:0;right:0;bottom:0;top:110px;z-index:50;pointer-events:none;box-shadow:inset 0 0 0 6px var(--act-lt,#7fb4ee)}
.autoframe.pulse{animation:afp 2.4s ease-in-out infinite}
.sz-new .autoframe{top:134px}
@keyframes afp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.autoframe.pulse{animation:none}}
.broken{position:absolute;left:0;right:0;top:140px;padding:24px;font-size:20px;color:var(--warn-tx)}

/* §6.8 画面の地: 明るい（案）。1 色 1 意味（D37）はそのまま、地と文字の明暗だけを入れ替える */
.theme-light,.theme-light.pal-new{--bg:#f4f6f9;--panel:#ffffff;--inset:#eef1f5;--ctrl:#e6eaf0;--ctrl-hi:#d5dbe4;--ctrl-on:#2f6bc6;
  --bd:#d7dde5;--bd-hi:#b9c2ce;--tx:#161b22;--mut:#4f5866;--dim:#8d95a1;--brand-lt:#2a5fa8;
  --ok-tx:#1f7a2e;--warn:#e08a00;--warn-tx:#8a5300;--ng-tx:#b3261e;--act-lt:#2f6bc6;
  --sel-bg:#1f2733;--sel-tx:#ffffff;--pin-panel:#5b6675;--pin-home:#5b6675;--pin-sel:#1f2733;--pin-homesel:#1f2733;

/* ヘッダは地と分けて濃い墨色の帯にする（2026-11-19 の意見）。青は「機体が動く」の色なので帯には使わない */
.theme-light .hdr{color:#f2f5f9;border-bottom-color:#11161d}

.theme-light .hdr .r2{background:#20272f}
.theme-light .hdr .brand{color:#ffffff}
.theme-light .hdr .brand small{color:#b8c2cf}
.theme-light .hdr .st{color:#f2f5f9}
.theme-light .hdr .mst{background:#3c4756;color:#ffffff}
.theme-light .hdr .mst.run{color:#fff}
.theme-light.pal-new .hdr .zone{border-color:#7a8696;color:#dfe4ea}
.theme-light.pause-neutral .hdr .mst.pause,.theme-light.pal-new.pause-neutral .hdr .mst.pause{background:#ffffff;color:#161b22;box-shadow:none}
.theme-light .tg{border-color:var(--bd-hi)}
.theme-light .tg2 .go-run{box-shadow:inset 0 0 0 3px #fff}
/* 押せるボタンは白く浮かせ、押せないボタンは平たく沈める（明るい地では塗りの差だけだと見分けにくい） */
.theme-light .b:not(.adv):not(.dis),.theme-light .mseg{background:#ffffff;box-shadow:0 1px 3px #0000001f}
.theme-light .b:not(.adv):not(.dis){border-color:var(--bd-hi)}
.theme-light.pal-new .b.dis{background:transparent !important;border-color:var(--bd) !important;color:#7d8592;box-shadow:none}
.theme-light .tg{box-shadow:0 1px 3px #0000001f}
.theme-light.pal-new .mapctl .b,.theme-light.pal-new .mapctl .b.dis,.theme-light .mapctl .b{background:#ffffffee !important}
.theme-light .center{background:rgba(244,246,249,.78)}
.theme-light .flow{background:rgba(255,255,255,.97)}
.theme-light .radar{background:rgba(255,255,255,.97)}
.theme-light .bub{background:#ffffff}
.theme-light .help{background:#ffffff;border-color:var(--act-lt)}
.theme-light .help p{color:var(--tx)}

.theme-light .tile.dis,.theme-light .tile{box-shadow:0 1px 2px #0000000f}

/* §6.3 色: 1 色 1 意味。青＝機体が進むこと（出発・再開のボタン・機体・経路・行き先）／赤＝止める操作だけ／
   橙＝人が見るべき注意だけ／緑＝正常だけ／選んでいるもの＝明るい反転 */
.pal-new{--act:#2f6bc6;--act-lt:#8ab4f0;--sel-bg:#e6e8ec;--sel-tx:#0f1117;--g-drive:#9575cd;
  --pin-panel:#c3ccd8;--pin-sel:#ffffff;--pin-home:#c3ccd8;--pin-homesel:#ffffff;--dest:#8ab4f0;--route:#8ab4f0}
.pal-new .hdr .logo{background:#2a5fa8}
.pal-new .hdr .zone{border-color:var(--bd-hi);color:var(--mut)}
.pal-new .hdr .mst.run{background:var(--act)}
.pal-new.pause-neutral .hdr .mst.pause{background:var(--sel-bg);color:var(--sel-tx)}
.pal-new .b.adv{background:var(--act);border-color:var(--act);color:#fff}
.pal-new .b.save,.pal-new .b.halt{background:var(--ctrl);border-color:var(--bd-hi);color:var(--tx)}
.pal-new .b.dis{opacity:1 !important;background:transparent !important;border-color:var(--bd-hi) !important;color:#7a8291}
.pal-new .mapctl .b.dis,.pal-new .mapctl .b{background:#1a1d24f0 !important}
.pal-new .cnt,.pal-new .opbar .pill{border-color:var(--warn);color:var(--warn-tx)}
.pal-new .mseg > div.on{background:var(--sel-bg);color:var(--sel-tx)}
.pal-new .tg .cur{background:var(--sel-bg);color:var(--sel-tx)}
.pal-new .tg2 .go-run{background:var(--act)}
.pal-new .tile.g{border-left-width:1px;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 18%,var(--panel)),var(--panel) 62%)}
</style>
</head>
<body>
<div id="bar">
  <h1>UI 作り直しの案</h1>
  <span><span class="lbl">画面</span><span class="seg" id="scrSeg"></span></span>
  <span><span class="lbl">状態</span><span class="seg" id="subSeg"></span></span>
  <span><span class="lbl">向き</span><span class="seg" id="oriSeg"></span></span>
</div>
<div id="main">
  <div id="stageWrap"><div id="devBox"><div id="dev"></div></div></div>
  <div id="notes"></div>
</div>

<script>
/* ---------------- アイコン（インライン SVG・stroke） ---------------- */
const P = {
  field:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  drive:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M4.6 15.6l5.1-2.3M19.4 15.6l-5.1-2.3"/>',
  maint:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 10.5l1.6 1.6 3.4-3.4M8.5 16.5l1.6 1.6 3.4-3.4"/>',
  measure:'<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-5.5"/><circle cx="12" cy="17" r="1.4"/><path d="M6 13.5l1 .6M18 13.5l-1 .6M12 9v1.2"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  prep:'<path d="M3 6l6-2 6 2 6-2v8"/><path d="M3 6v14l6-2 4 1.4"/><path d="M9 4v14"/><path d="M15 21l1-3.5 5-5 2.5 2.5-5 5z"/>',
  day:'<path d="M5 21V3.5"/><path d="M5 4h12l-2.5 4.5L17 13H5"/>',
  follow:'<circle cx="7.5" cy="4.5" r="2"/><path d="M7.5 7.5v6l-2 6.5M7.5 13.5l2.5 6.5M4.5 10.5h6"/><path d="M14 12h7.5M18.5 9l3 3-3 3"/>',
  manual:'<circle cx="12" cy="6.5" r="3"/><path d="M12 9.5v6"/><rect x="4.5" y="15.5" width="15" height="5.5" rx="2"/>',
  teachF:'<circle cx="7" cy="4.5" r="2"/><path d="M7 7.5v6l-2 6.5M7 13.5l2.5 6.5M4 10.5h6"/><circle cx="17.5" cy="12" r="4.2"/><circle cx="17.5" cy="12" r="1.6" fill="currentColor"/>',
  teachM:'<circle cx="8" cy="7" r="2.6"/><path d="M8 9.6v5"/><rect x="2.5" y="14.6" width="11" height="5" rx="2"/><circle cx="17.5" cy="10" r="4.2"/><circle cx="17.5" cy="10" r="1.6" fill="currentColor"/>',
  replay:'<path d="M2.5 19c3.5-9 7.5 3 11.5-6.5"/><circle cx="2.5" cy="19" r="1" fill="currentColor"/><path d="M14.5 8.5l7 4-7 4z"/>',
  line:'<path d="M7 21.5L10.5 2.5M17 21.5L13.5 2.5"/><path d="M12 5.5v2.2M12 10.8v2.4M12 16.3v2.6"/>',
  leash:'<circle cx="6" cy="18" r="3.2"/><path d="M8.5 16C14 12 9.5 6.5 16.5 5"/><rect x="16" y="2" width="5.5" height="5.5" rx="1.2"/>',
  check:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 11.5l2 2 4.5-4.5"/>',
  calib:'<rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10.5 8v4M14.5 8v3M18.5 8v4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  home:'<path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v10h12V10"/>',
  panel:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  person:'<circle cx="12" cy="5" r="2.4"/><path d="M12 8.5v7l-2.5 6M12 15.5l2.5 6M8 12h8"/>',
  cam:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/><circle cx="12" cy="13.5" r="3.5"/>',
  jog:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  abort:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9l6 6M15 9l-6 6"/>',
  save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  stopSq:'<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/>',
  play:'<path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/>',
}
const ic = (k, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[k]}</svg>`

/* ---------------- 状態 ---------------- */
const S = {
  scr:'menu', ori:'L',
  tracker:true,   // 人検出（試験準備・試験で共有。左上の操作バーのトグル）
  menu:{lvl:'top', trackerOff:false, noRoute:false},
  wt:{v:'new'}, sz:{v:'new'}, pal:{v:'new', pause:'neutral'},   // 2026-11-17 に決定（D33〜D37）。'old' で 11-16 の版
  af:{v:'pulse'}, dbg:{v:'none'}, theme:{v:'light'},   // 画面の地（§6.8・案。2026-11-17 の意見）   // 自律走行中の枠（§6.5・案）／表示の不具合の試し（D39）
  font:{v:'sys'}, shape:{v:'role'}, map:{rot:0, view:'2d', wall:'wall', col:'now'}, trk:{w:'io'},
  day:{sub:'home', dest:null, sel:null, robot:'home', flowStep:0,
       abortLabel:'中断'},   // 2026-11-15: 「中断」のまま（D15）。別の語は案として残す
  help:{on:true},   // ヘルプ表示（2026-11-15 ユーザー案。設定で切り替え）
  prep:{sub:'mapping', method:'person', reserved:'dim', reg:null, regStep:0, pins:6},
}
const SUBS = {
  menu:[['top','一番上'],['field','試験場 ▸'],['drive','走行 ▸'],['maint','点検と校正 ▸']],
  day:[['unloaded','地図未読込'],['undeclared','宣言前'],['home','待機'],['moving','移動中'],['paused','一時停止'],['panel','盤の前'],['summon','呼び寄せ']],
  prep:[['entry','入口'],['mapping','地図作成中'],['reg','人の位置で登録'],['return','待機場所へ戻る途中']],
}
const SCRS = [['menu','メインメニュー（M2）'],['day','試験（当日）F2'],['prep','試験準備']]
const subOf = () => S.scr==='menu' ? S.menu.lvl : S[S.scr].sub
function setSub(v){
  if (S.scr==='menu') S.menu.lvl=v
  else if (S.scr==='day'){ const d=S.day; d.sub=v; d.sel=null; d.flowStep=0
    d.robot = v==='panel' ? 'panel' : (v==='moving'||v==='paused') ? 'mid' : 'home'
    if ((v==='moving'||v==='paused') && !d.dest) d.dest='A-1'
    if (v==='home'||v==='panel'||v==='unloaded'||v==='undeclared') d.dest=null }
  else { const p=S.prep; p.sub=v; if (v==='reg'){ p.reg='HOME'; p.method='person'; p.regStep=1 } else { p.reg=null; p.regStep=0 } }
}

/* ---------------- 部品 ---------------- */
function btn(act, label, {icon, cls='', dis=false, id, why='', help=''}={}){
  if (S.scr!=='menu') icon=null   // アイコンはメインメニューだけ（D28）
  return `<button class="b ${cls} ${dis?'dis':''}" data-btn data-act="${dis?'':act}" ${id?`data-id="${id}"`:''} ${dis&&why?`data-why="${why}"`:''} ${help?`data-help="${help}"`:''}>${icon?ic(icon):''}<span>${label}</span></button>`
}
// 対のトグル。stop/run: 'cur' | 'en' | 'dis' | 'inert'（予約で押しても何も起きない）
function tog(stop, run, {runLabel='走行', runHint='押すと走り出す', blink=true, note='', big=false, help=''}={}){
  const side = (k, st) => {
    const lab = k==='stop' ? '停止' : runLabel
    const icn = ''
    if (st==='cur') return `<div class="cur">${icn}<span>${k==='stop'?'停止中':'走行中'}</span></div>`
    if (st==='en') return k==='stop'
      ? `<div class="nstop" data-act="stop">${icn}<span>${lab}する</span></div>`
      : `<div class="nrun ${blink?'blink':''}" data-act="run">${icn}<span>${lab}する</span></div>`
    if (st==='inert') return `<div class="inert" data-act="inert">${icn}<span>${lab}</span></div>`
    return `<div class="off" data-act="" data-why="${note}">${icn}<span>${lab}</span></div>`
  }
  if (S.wt.v==='new') return tog2(stop, run, {runLabel, note, big, help})
  const pressable = [stop,run].some(s=>s==='en'||s==='inert')
  return `<div class="tg ${big?'big':''}" data-btn ${pressable?'':'data-dis'} ${help?`data-help="${help}" data-nolong`:''}>${side('stop',stop)}<span class="sep"></span>${side('run',run)}</div>`
}
// 2026-11-17 案（options §6.1）: 塗るのは「いま押せる側」だけ（止める＝赤・走る／再開＝青）。語は動詞で固定。
// いまの状態はヘッダの札（D21）が言うので、トグルは状態を言わない。押せない側は沈める。
function tog2(stop, run, {runLabel='走行', note='', big=false, help=''}={}){
  const side = (k, st) => {
    const lab = (k==='stop' ? '停止' : runLabel) + 'する'
    if (st==='en') return k==='stop'
      ? `<div class="go-stop" data-act="stop"><span>${lab}</span></div>`
      : `<div class="go-run blink" data-act="run"><span>${lab}</span></div>`
    if (st==='inert') return `<div class="inert" data-act="inert"><span>${k==='stop'?'停止':runLabel}</span></div>`
    const why = st==='cur' ? (k==='stop' ? '止まっています' : '走っています') : note
    return `<div class="idle off" data-act="" data-why="${why}"><span>${lab}</span></div>`
  }
  const pressable = [stop,run].some(s=>s==='en'||s==='inert')
  return `<div class="tg tg2 ${big?'big':''}" data-btn ${pressable?'':'data-dis'} ${help?`data-help="${help}" data-nolong`:''}>${side('stop',stop)}<span class="sep"></span>${side('run',run)}</div>`
}
// 人検出の開始／停止（2026-11-13: 案の画面に動かす手段が無かった。いまの実装は対象選択タブの中）。対のトグル（R4）。
// 呼び寄せ中・登録中は止められない（機体が拒否する。trackerControlPolicy.js）。
function trackerBar(canStop=true){
  const on=S.tracker, io=S.trk.w==='io'
  const [offDo, offCur, onDo, onCur] = io ? ['切','切','入','入'] : ['■ 止める','■ 停止中','● 動かす','● 動作中']
  // 2026-11-17 案（§6.1）: これは操作の対ではなく ON／OFF の切り替えなので、ON のときだけ明るく点ける。OFF は点けない
  const offCurCls = S.wt.v==='new' ? 'curoff' : 'cur'
  return `<span class="cap">人検出</span><div class="tg sm" data-btn data-help="tracker">
    ${on?(canStop?`<div class="press" data-act="trkOff">${offDo}</div>`:`<div class="off">${offDo}</div>`):`<div class="${offCurCls}">${offCur}</div>`}<span class="sep"></span>
    ${on?`<div class="cur">${onCur}</div>`:`<div class="press" data-act="trkOn">${onDo}</div>`}</div>`
}
// ヘッダ（2026-11-15 決定 D21〜D24）: ロゴ・プロジェクト名の真後ろに画面名称（位置をほぼ固定）。
// 右端の札はモードではなく状態。ゾーンは場内のときだけ「速度制限」。
function header(title, zone, state){
  const cls = /一時停止/.test(state) ? ' pause' : /移動中/.test(state) ? ' run' : ''
  return `<div class="hdr"><div class="r1"><div class="logo">TH</div><div class="brand"><small>MIRS2602-</small>高見舎プロジェクト</div><div class="title">${title}</div>
  <div class="gap"></div>${zone?'<span class="zone">速度制限</span>':''}${state?`<span class="mst${cls}">${state}</span>`:''}</div>
  <div class="r2"><div class="st"><i></i>正常</div></div></div>`   // 非常停止はここに描かない（render の estopHTML。D39）
}
const DAY_STATE = {unloaded:'準備中', undeclared:'準備中', home:'待機中', panel:'配電盤前', moving:'移動中', paused:'一時停止中', summon:'位置指示中'}
const PREP_STATE = {entry:'準備中', mapping:'地図作成中', reg:'登録中', return:'待機場所へ移動中'}

function mapProj(){

    labels += `<text x="${gx}" y="${gy+(d3?24:Z.ly)}" text-anchor="middle" font-size="${Z.lab}" font-weight="700" style="fill:var(--lab,#e6e8ec);stroke:var(--lab-bd,#0f1117)" stroke-width="5" paint-order="stroke" pointer-events="none">${p.name}</text>`
  }
  let bubble='', bubHTML=''
  // 2026-11-17 案 §6.2: 吹き出しを HTML にし、「行き先にする」を論理 px で高さ 60 にする（SVG の中だと地図と一緒に縮む）
  if (sel && S.sz.v==='new'){ const p=pinById(sel), [mx,my]=mk[sel]
    bubHTML = `<div class="bub" data-x="${mx}" data-y="${my}" data-r="${Z.hit}"><div class="nm">${p.name}</div>${btn('pinGo', selLabel, {cls:'go adv'})}</div>` }
  else if (sel){ const p=pinById(sel), [mx,my]=mk[sel]; const bx=Math.min(Math.max(mx-130,50),690), by=my>300?my-170:my+60
    bubble = `<g><rect x="${bx}" y="${by}" width="260" height="104" rx="12" fill="#232733" stroke="#7fb4ee" stroke-width="2"/>
      <text x="${bx+16}" y="${by+34}" font-size="24" font-weight="800" fill="#fff">${p.name}</text>
      <g data-act="pinGo" data-btn style="cursor:pointer"><rect x="${bx+14}" y="${by+48}" width="232" height="44" rx="8" fill="#2c4a74" stroke="#3f8ae0" stroke-width="2"/>
      <text x="${bx+130}" y="${by+78}" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">${selLabel}</text></g></g>`
  }
  const pl = path ? `<polyline points="${path.map(q=>pt(P(...q))).join(' ')}" fill="none" stroke="#0f1117" stroke-opacity=".7" stroke-width="9"/><polyline points="${path.map(q=>pt(P(...q))).join(' ')}" fill="none" style="stroke:var(--route,#ffd54f)" stroke-width="5" stroke-dasharray="14 9"/>` : ''
  return `<svg class="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">${clip}${floor}
    ${pl}${walls}${pts}${items.sort((a,b)=>a[0]-b[0]).map(i=>i[1]).join('')}${labels}${bubble}</svg>${bubHTML}`
}
function radarSVG(big, off=false){
  if (off) return `<div class="radar ${big?'big':''}" style="display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:15px;padding:16px">人検出が止まっています<br>左上の「人検出」で動かします</div>`
  const cands=[[60,-90,true],[-110,-40,false],[130,60,false],[-70,110,false]]
  let c=''
  cands.forEach(([x,y,s],i)=>{ c+=`<g><circle cx="${150+x}" cy="${150+y}" r="${s?15:11}" fill="${s?'#4caf50':'#8b93a1'}"/>${s?`<circle cx="${150+x}" cy="${150+y}" r="24" fill="none" stroke="#8fd694" stroke-width="3"/>`:''}<text x="${150+x}" y="${150+y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1117">${i+1}</text></g>` })
  return `<div class="radar ${big?'big':''}"><span class="cap">対象: 1 番（信頼度 87%）</span>
    <svg viewBox="0 0 300 300" style="width:100%;height:100%"><circle cx="150" cy="150" r="60" fill="none" stroke="#2a2d35"/><circle cx="150" cy="150" r="120" fill="none" stroke="#2a2d35"/>
    <path d="M150 20V280M20 150H280" stroke="#2a2d35"/><path d="M140 160L150 135L160 160Z" fill="#7fb4ee"/>${c}</svg></div>`
}

// size: 'l' 大 ／ '' 中 ／ 's' 小（横並び）。ga = grid-area（横長・縦長）。順位は仮。

const TOP_TILES = [

  {act:'go:drive', icon:'drive', name:'走行', sub:true, g:'drive', size:'', L:'1/2/3/3', P:'2/1/3/2'},

const GROUPS = {
  field:{name:'試験場', icon:'field', color:'var(--g-field)', items:[
    {k:'day', name:'試験（当日）', icon:'day', size:'l', L:'1/1/2/2', P:'1/1/2/2'},
    {k:'prep', name:'試験準備', icon:'prep', size:'', L:'1/2/2/3', P:'2/1/3/2'}]},
  drive:{name:'走行', icon:'drive', color:'var(--g-drive)', items:[

function tileHTML({act, icon, name, sub, color, size, area, why, dis}){
  return `<div class="tile g ${size} ${dis?'dis':''}" data-btn ${dis?'data-dis':''} data-act="${dis?'':act}" ${dis&&why?`data-why="${why}"`:''} style="grid-area:${area};border-left-color:${color||'var(--bd-hi)'};--gc:${color||'var(--panel)'}">
    <span style="color:${color||'var(--tx)'}">${ic(icon)}</span><div><div class="nm">${name}${sub?'<span class="ar">▸</span>':''}</div></div></div>`
}
function menuView(){
  const m=S.menu, lvl=m.lvl, o=S.ori
  const why = k => {
    if (m.trackerOff && (k==='follow'||k==='teachF')) return '人検出が止まっています'
    if (m.noRoute && k==='replay') return '経路がありません'
    return ''
  }
  const lay = LAYOUT[lvl][o]
  let left, tiles
  if (lvl==='top'){
    tiles = TOP_TILES.map(t=>tileHTML({...t, color: t.g ? GROUPS[t.g].color : '', area:t[o],
      why: t.g==='drive' && m.trackerOff ? '追従は人検出が止まっています' : ''})).join('')
    left = `<div class="tiles" style="grid-template-columns:${lay.cols};grid-template-rows:${lay.rows}">${tiles}</div>`
  } else {
    const g=GROUPS[lvl]
    tiles = g.items.map(it=>{ const w=why(it.k)
      const act = it.k==='prep' ? 'open:prep' : it.k==='day' ? 'open:day' : `toast:${it.name}へ（「終了」でこの「${g.name}」の階層に戻る）`
      return tileHTML({act, icon:it.icon, name:it.name, color:g.color, size:it.size, area:it[o], why:w, dis:!!w}) }).join('')
    left = `<div class="banner" style="background:linear-gradient(90deg, color-mix(in srgb, ${g.color} 35%, transparent), transparent);color:#fff"><span style="color:${g.color}">${ic(g.icon)}</span>${g.name}${S.wt.v==='new'?'':`<span style="color:var(--mut);font-size:16px;font-weight:400;margin-left:8px">メインメニュー ▸ ${g.name}</span>`}</div>
      <div class="tiles" style="grid-template-columns:${lay.cols};grid-template-rows:${lay.rows}">${tiles}</div>`
  }
  // §6.7: 接続確認は操作バーの右に置き、一番上でも帯が空にならないようにする（どの階層でも同じ場所）
  const link = `<div class="kv" style="margin-left:auto"><i></i>機体・ラズパイ・ESP32 と通信できています</div>${btn('toast:接続確認の詳細（S-00 相当）','詳細',{cls:'exit'})}`
  const opbar = S.wt.v==='new'
    ? `<div class="opbar">${lvl==='top'?'':btn('go:top','戻る',{icon:'back',cls:'exit'})}${link}</div>`
    : lvl==='top' ? `<div class="opbar"></div>` : `<div class="opbar">${btn('go:top','戻る',{icon:'back',cls:'exit'})}</div>`
  const side = `<div class="side">
    ${S.wt.v==='new' ? '' : `<div class="sec full"><h3>接続確認</h3><div class="kv"><i></i>機体・ラズパイ・ESP32 と通信できています</div>
      <div style="margin-top:10px">${btn('toast:接続確認の詳細（S-00 相当）','詳細',{cls:'exit'})}</div></div>`}
    <div class="sec"><h3>バッテリー</h3><div style="font-size:22px;font-weight:800">82 %</div></div>
    <div class="sec full"><h3>運用の終了</h3><div class="kv">未保存のデータ<span class="cnt">4 件</span></div>
      <button class="b halt" data-btn data-act="toast:未保存の一覧（W-4）が開く">制御系を停止する</button></div></div>`
  return header('メインメニュー', false, '') + `<div class="body">${opbar}<div class="content"><div class="mcol">${left}</div>${side}</div></div>`
}

/* ---------------- 試験（当日）F2 ---------------- */
function dayView(){
  const d=S.day, s=d.sub
  const ROBOT = {home:C(175,164,-90), mid:C(172,100,-90), panel:C(102,58,-150), off:C(172,112,-90)}
  const destPin = d.dest && pinById(d.dest)
  const choose = (s==='home'||s==='panel')
  // 9 個のボタンの押せる・押せない（位置は固定。R2）
  const E = {stop:'cur', run:'dis', manual:true, abort:false, home:false, next:false, summon:false, measure:false, cam:false}
  const AB = d.abortLabel
  let whyDest='', whyPanel='盤の前に着いたら押せます', runNote=''
  if (s==='unloaded'){ whyDest='会場地図を開いてから選べます'; runNote='行き先がありません' }
  else if (s==='undeclared'){ whyDest='待機場所にいることを宣言してから選べます'; runNote='行き先がありません' }
  else if (choose){ E.home = !(s==='home' && d.robot==='home'); E.next=true; E.summon=S.tracker
    runNote='行き先を押すと出発します'
    if (s==='panel'){ E.measure=true; E.cam=true; whyPanel='' }
    if (!S.tracker) whyDest='人検出を動かすと呼び寄せできます（左上）' }
  else if (s==='moving'){ E.stop='en'; E.run='cur'; E.abort=true; whyDest=`移動中は選べません（「${AB}」で止めて選び直し）` }
  else if (s==='paused'){ E.run='en'; E.abort=true; whyDest=`一時停止中は選べません（「再開」か「${AB}」）` }
  else if (s==='summon'){ E.abort=true; whyDest=`呼び寄せの位置を指定しています（やめるときは「${AB}」）`; runNote='位置を指定すると出発します' }

  const where = d.robot==='home' ? '待機場所' : d.robot==='panel' ? '盤 A-1' : '途中'
  const st = {
    unloaded:['会場地図が開かれていません',''],
    undeclared:['待機場所にいることを宣言してください',''],
    home:[ d.robot==='home'?'待機中　待機場所':'止まっています　行き先を選んでください', ''],
    moving:[`移動中 → ${destPin?.name??''}`, '残り 4.2 m'],
    paused:[`一時停止中 → ${destPin?.name??''}`, '残り 4.2 m'],
    panel:[`盤の前　盤 A-1`, ''],
    summon:['呼び寄せ　位置の指定', ''],
  }[s]

  let mainInner = ''
  const robot = ROBOT[d.robot]
  const path = (s==='moving'||s==='paused') ? [C(175,176),C(172,120),C(172,76),C(130,70),C(102,58),C(96,49)] : null
  if (s==='unloaded'){
    mainInner = `<div class="center" style="background:var(--inset)"><div class="card"><p>機体を待機場所に置いてから押します</p>${btn('openMap','会場地図を開く',{icon:'field',cls:'adv'})}</div></div>`
  } else {
    mainInner = mapSVG({robot, path, sel: choose ? d.sel : null, selLabel:'行き先にする', dest: (s==='moving'||s==='paused') ? d.dest : null})
    if (s==='undeclared') mainInner += `<div class="center"><div class="card"><p>機体が待機場所（家の印）にありますか</p>${btn('declare','待機場所にいます',{icon:'home',cls:'adv'})}</div></div>`
    if (s==='summon') mainInner += radarSVG(false, !S.tracker) + `<div class="flow"><span class="stp">呼び寄せ ${d.flowStep||1}/2</span><span class="msg">${d.flowStep===2?'機体に向いてほしい方向へ 1 歩動いて「記録」':'機体に来てほしい位置に立って「記録」'}</span>${btn('rec','記録',{cls:'adv',dis:!S.tracker})}</div>`
  }
  const runLabel = s==='paused' ? '再開' : '走行'
  const runHint = '押すと続きを走る'
  // 薄いボタンを押したときに出す理由（D16）
  const whyHome = choose && d.robot==='home' ? 'いま待機場所にいます' : whyDest
  const whySummon = choose && !S.tracker ? '人検出を動かすと呼び寄せできます（左上）' : whyDest
  const whyAbort = '取り消す行き先がありません（移動中・一時停止中・呼び寄せの位置指定中に押せます）'
  // 「次の配電盤」に行き先の名前（D14）。名前が無い状態でも 2 行ぶんの高さを保つ（R2）
  const nextId = s==='panel' ? 'A-2' : 'A-1'
  const nextLabel = `次の配電盤<small>${choose ? pinById(nextId).name+' へ' : '&nbsp;'}</small>`
  const ctl = `<div class="ctl">
    <div class="state full"><div class="s1">${st[0]}</div><div class="s2">${st[1]}</div></div>
    <div class="sec full noh"><h3>操作</h3>${tog(E.stop, E.run, {runLabel, runHint, note:runNote, big:true, help:'toggle'})}
      <div class="row" style="margin-top:8px">${btn('jog','手動',{icon:'jog',dis:!E.manual,help:'jog'})}${btn('abort',AB,{icon:'abort',dis:!E.abort,why:whyAbort,cls:AB.length>4?'f16':'',help:'abort'})}</div></div>
    <div class="sec"><h3>行き先</h3><div class="row">${btn('goHome','待機場所<small>&nbsp;</small>',{icon:'home',dis:!E.home,why:whyHome,cls:'two go',help:'home'})}${btn('goNext',nextLabel,{icon:'panel',dis:!E.next,why:whyDest,cls:'two go',help:'next'})}</div>
      <div class="row" style="margin-top:8px">${btn('summon','呼び寄せ',{icon:'person',dis:!E.summon,why:whySummon,cls:'go',help:'summon'})}</div></div>
    <div class="sec"><h3>盤の前</h3><div class="row">${btn('toast:測定機能の画面を開き、停止命令（測定中）に入る','測定機能へ',{icon:'measure',dis:!E.measure,why:whyPanel,help:'measure'})}${btn('toast:カメラ機能の画面を開く（状態は変えない）','カメラ',{icon:'cam',dis:!E.cam,why:whyPanel,help:'cam'})}</div></div>
  </div>`
  // 2026-11-17 案（options §6.1）: 右列の先頭は状態ではなく「どこへ・あとどれだけ」（状態はヘッダの札 D21）。
  // 「次の配電盤」を行き先の先頭に幅いっぱいで置き、押せるときは出発の青で塗る。ボタンの数と位置は全状態で同じ（R2）
  const WH = { unloaded:['',''], undeclared:['',''], home:[d.robot==='home'?'待機場所':'途中で停止',''],
    moving:[`${destPin?.name??''} へ`,'残り 4.2 m'], paused:[`${destPin?.name??''} へ`,'残り 4.2 m'],
    panel:['盤 A-1 の前',''], summon:['呼び寄せの位置',''] }[s]
  const ctlNew = `<div class="ctl">
    <div class="where full"><span>${WH[0]||'&nbsp;'}</span><b>${WH[1]}</b></div>
    <div class="sec"><h3>操作</h3>${tog(E.stop, E.run, {runLabel, note:runNote, big:true, help:'toggle'})}
      <div class="row" style="margin-top:8px">${btn('jog','手動',{dis:!E.manual,help:'jog'})}${btn('abort',AB,{dis:!E.abort,why:whyAbort,cls:AB.length>4?'f16':'',help:'abort'})}</div></div>
    <div class="sec"><h3>行き先</h3>${btn('goNext', `次の配電盤<small>${choose ? pinById(nextId).name+' へ' : '&nbsp;'}</small>`, {dis:!E.next, why:whyDest, cls:'two go next'+(E.next?' adv':''), help:'next'})}
      <div class="row" style="margin-top:8px">${btn('goHome','待機場所',{dis:!E.home,why:whyHome,cls:'go',help:'home'})}${btn('summon','呼び寄せ',{dis:!E.summon,why:whySummon,cls:'go',help:'summon'})}</div></div>
    <div class="sec full"><h3>盤の前</h3><div class="row">${btn('toast:測定機能の画面を開き、停止命令（測定中）に入る','測定機能へ',{dis:!E.measure,why:whyPanel,help:'measure'})}${btn('toast:カメラ機能の画面を開く（状態は変えない）','カメラ',{dis:!E.cam,why:whyPanel,help:'cam'})}</div></div>
  </div>`
  return header('試験', true, DAY_STATE[s]||'') + `<div class="body"><div class="opbar">${btn('toast:メインメニュー（試験場の階層）へ戻る','終了',{icon:'close',cls:'exit',help:'exit'})}${trackerBar(s!=='summon')}</div>
    <div class="content"><div class="mainv">${mainInner}</div>${S.wt.v==='new' ? ctlNew : ctl}</div></div>`
}

const METHODS = [['person','人の位置で'],['pose','いまの姿勢で'],['tap','地図をタップして']]
function prepView(){
  const p=S.prep, s=p.sub
  const mapping = s==='mapping'
  const reserved = p.reserved==='dim' ? 'dis' : 'inert'
  let stop='cur', run=reserved, runNote='追従走行（今後の予約）'
  if (s==='return'){ stop='en'; run='cur'; runNote='' }
  const canReg = mapping
  const needTrk = p.method==='person' && !S.tracker
  const st = {
    entry:['前回の地図とピンが残っています', `ピン ${p.pins} 件（待機場所 1・配電盤 5）`],
    mapping:['地図作成中　未保存の変更あり', `ピン ${p.pins} 件`],
    reg:['待機場所を登録中（人の位置で）', ''],
    return:['待機場所へ戻る途中', ''],
  }[s]
  let mainInner = mapSVG({robot:s==='return'?C(172,100,90):C(150,66,180), path:s==='return'?[C(172,100),C(172,150),C(175,176)]:null, partial:true, scan:true})
  mainInner += `<div class="mapctl">${btn('rotL','左へ回す',{dis:!mapping,why:'地図作成中に変えられます'})}${btn('rotR','右へ回す',{dis:!mapping,why:'地図作成中に変えられます'})}</div>`
  if (s==='entry') mainInner += `<div class="center"><div class="card"><p>前回の試験場内地図とピン（${p.pins} 件）が残っています</p>
      ${btn('resume','続きから再開',{icon:'play',cls:'adv'})}
      ${btn('fresh','新しい試験日として開始（前回を消す）',{icon:'close',cls:'caution'})}</div></div>`
  if (mapping && p.method==='person') mainInner += radarSVG(false, !S.tracker)
  if (s==='reg') mainInner += radarSVG(false, !S.tracker) + `<div class="flow"><span class="stp">待機場所 ${p.regStep}/2</span><span class="msg">${p.regStep===2?'機体に向いてほしい方向へ 1 歩動いて「記録」':'待機場所に立って「記録」'}</span>${btn('regRec','記録',{cls:'adv',dis:!S.tracker})}${btn('regCancel','やめる')}</div>`

  const regWhy = s==='entry' ? '地図作成を始めてから登録できます' : s==='reg' ? '登録中です（やめるときは地図の上の「やめる」）' : s==='return' ? '待機場所へ戻る途中は登録できません' : (needTrk ? '人検出を動かすと「人の位置で」登録できます（左上）' : '')
  const mseg = `<div class="mseg ${canReg?'':'dis'}" data-btn ${canReg?'':'data-dis'}>${METHODS.map(([k,n])=>`<div class="${p.method===k?'on':''}" data-act="${canReg?'method':''}" data-id="${k}">${n}</div>`).join('')}</div>`
  const regDis = !canReg || needTrk

let whyT
function whyAt(el, msg){
  const dev=document.getElementById('dev'); dev.querySelector('.why-pop')?.remove()
  const dr=dev.getBoundingClientRect(), W=parseFloat(dev.style.width), H=parseFloat(dev.style.height), sc=dr.width/W, r=el.getBoundingClientRect()
  const x=(r.left-dr.left)/sc, y=(r.top-dr.top)/sc, w=r.width/sc, h=r.height/sc
  const box=document.createElement('div'); box.className='why-pop'; box.textContent=msg; dev.appendChild(box)
  const bw=box.offsetWidth, bh=box.offsetHeight, top0=(dev.querySelector('.hdr')?.offsetHeight||110)+8
  const left=Math.min(Math.max(x+w/2-bw/2, 8), W-bw-8)
  const up = y-bh-12 >= top0
  box.classList.add(up?'up':'down'); box.style.left=left+'px'; box.style.top=(up ? y-bh-12 : Math.min(y+h+12, H-bh-8))+'px'
  box.style.setProperty('--ax', Math.min(Math.max(x+w/2-left, 16), bw-16)+'px')
  clearTimeout(whyT); whyT=setTimeout(()=>box.remove(), 3200)
}
function toast(msg){ const t=document.querySelector('#dev .toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600) }
function act(a, id){
  if (!a) return
  if (a.startsWith('toast:')) return toast(a.slice(6))
  if (a.startsWith('go:')){ S.menu.lvl=a.slice(3); return render() }
  if (a.startsWith('open:')){ S.scr=a.slice(5); if (S.scr==='prep') setSub('entry'); else setSub('unloaded'); return render() }
  if (a==='trkOn'){ S.tracker=true; return render() }
  if (a==='trkOff'){ S.tracker=false; return render() }
  const d=S.day, p=S.prep
  if (S.scr==='day'){
    const depart = dest => { d.dest=dest; d.sel=null; d.sub='moving'; d.robot='mid' }
    switch(a){
      case 'openMap': d.sub='undeclared'; break
      case 'declare': d.sub='home'; d.robot='home'; break
      case 'pin': if (d.sub==='home'||d.sub==='panel'){ d.sel = d.sel===id?null:id } break
      case 'pinGo': depart(d.sel); break
      case 'goHome': depart('HOME'); break
      case 'goNext': depart(d.sub==='panel' ? 'A-2' : 'A-1'); break
      case 'run': if (d.sub==='paused'){ d.sub='moving'; d.robot='mid' } break
      case 'stop': d.sub='paused'; break
      case 'abort':
        if (d.sub==='moving'||d.sub==='paused'){ d.robot='off'; d.sub='home'; toast('止めて、行き先の選び直しへ戻った') }
        else if (d.sub==='summon'){ d.sub='home' }
        d.dest=null; d.flowStep=0; break
      case 'summon': d.sub='summon'; d.flowStep=1; d.sel=null; d.dest=null; break
      case 'rec': if (d.flowStep<2){ d.flowStep=2 } else { d.dest='HOME'; d.sub='moving'; d.robot='mid'; d.flowStep=0; toast('呼び寄せの位置へ移動します') } break
      case 'jog': toast('手動操作パネル（W-6）が開く。触れたら一時停止'); if (d.sub==='moving'){ d.sub='paused' } break
    }
    return render()
  }
  if (S.scr==='prep'){
    switch(a){
      case 'rotL': S.map.rot=(S.map.rot+345)%360; break
      case 'rotR': S.map.rot=(S.map.rot+15)%360; break
      case 'resume': p.sub='mapping'; break
      case 'fresh': p.sub='mapping'; p.pins=0; toast('前回の地図とピンを消して、地図作成を始めた'); break
      case 'method': p.method=id; break
      case 'regHome': case 'regPanel': {
        const kind = a==='regHome' ? '待機場所' : '配電盤'
        if (p.method==='person'){ p.sub='reg'; p.regStep=1 }
        else if (p.method==='pose'){ p.pins++; toast(`いまの機体の位置で${kind}を登録した`) }
        else toast(`地図の上で${kind}の位置を押してください`)
        break }
      case 'regRec': if (p.regStep<2) p.regStep=2; else { p.sub='mapping'; p.pins++; toast('待機場所を登録した') } break
      case 'regCancel': p.sub='mapping'; break
      case 'goHome': p.sub='return'; break
      case 'stop': p.sub='mapping'; toast('止まった（帰還を取りやめ）'); break
      case 'inert': toast('押しても何も起きない（追従走行の予約）'); break
      case 'jog': toast('手動操作パネル（W-6）が開く'); break
    }
    return render()
  }
}

  {q:'表示の不具合の試し（D39）', k:['dbg','v'], v:[['none','なし'],['broken','画面の中身が描けない']], why:'画面の中身を描く処理が失敗しても、非常停止は最初に描いてあるので残り、押せる（試験準備・試験（当日）で試せる）'},
  {q:'フォント', k:['font','v'], v:Object.entries(FONTS).map(([k,v])=>[k,v[0]]), why:'「端末の標準」以外は、選ぶとインターネットから読み込む（比較のため）。実装ではファイルを同梱する。BIZ UDPゴシックは太さが 2 段階だけ'},
  {q:'ボタンの形', k:['shape','v'], v:[['role','役割で変える（決定）'],['round','角丸'],['sq','角ばった'],['pill','丸い']], why:'「役割で変える」: 行き先へ出発するボタンは丸、道具のボタンは角、「終了」は片側だけ丸。位置と大きさは変えない'},
]
// 2026-11-17 の評価を受けた修正案（options §6）。既定は案、「11-16 の版」で元に戻して比べる
const REV_OPTS = [
  {q:'§6.1 重さの付け方（決定 D33〜D35）', k:['wt','v'], v:[['new','押せる側を塗る（決定）'],['old','いまの側を塗る（11-16 の版）']], why:'案: 停止│走行は「いま押せる側」だけを塗る（止める＝赤・再開＝青）。語は「停止する」「走行する／再開する」で固定。状態はヘッダの札が言う。右列の先頭は「どこへ・残り」。「次の配電盤」を幅いっぱいで先頭に。人検出は ON のときだけ点ける。D2・R4・D17・D31 を見直す案', menu:false},
  {q:'§6.2 大きさの基準（決定 D36）', k:['sz','v'], v:[['new','タブレット実寸で決める（決定）'],['old','11-16 の版']], why:'縦長はタブレット（D38）で、論理キャンバスが 0.8 倍に縮む。縮んでも押す的 44 px・文字 12 px を割らないよう、論理 px で押す的 56 以上・小さい文字 15 以上にした。非常停止は高さ 76 で画面でいちばん高いボタン（Spec-webui.md §1.2）。停止│走行は 68 に下げた。「行き先にする」は高さ 60'},
  {q:'§6.3 配色（決定 D37）', k:['pal','v'], v:[['new','1 色 1 意味（決定）'],['old','11-16 の版']], why:'青＝機体が進むこと（出発・再開・機体・経路・行き先）／赤＝止める操作だけ／橙＝人が見るべき注意だけ／緑＝正常だけ／選んでいるもの＝明るい反転。配電盤のピンは中立の明るい灰、「走行」の区画は紫、「速度制限」「保存」「制御系を停止する」は中立'},
]
const optsOf = () => [...NOTES[S.scr].opts, ...REV_OPTS.filter(o=>S.scr!=='menu'||o.menu!==false), ...(S.scr==='menu'?[]:[AUTO_OPT]), ...(S.scr==='menu'?[]:MAP_OPTS), ...COMMON_OPTS]
function segHTML(items, cur, attr){ return items.map(([v,l])=>`<button class="${cur===v?'on':''}" ${attr}="${v}">${l}</button>`).join('') }
function render(){
  document.getElementById('scrSeg').innerHTML = segHTML(SCRS, S.scr, 'data-scr')
  document.getElementById('subSeg').innerHTML = segHTML(SUBS[S.scr], subOf(), 'data-sub')
  // 横長は PC の 16:9、縦長はタブレットとみなす（D38。2026-11-17）
  document.getElementById('oriSeg').innerHTML = segHTML([['L','横長 1280×720（PC）'],['P','縦長 960×1280（タブレット）']], S.ori, 'data-ori')
  const dev=document.getElementById('dev')
  const [W,H] = {L:[1280,720], P:[960,1280]}[S.ori]
  dev.style.width=W+'px'; dev.style.height=H+'px'
  dev.className = (S.ori==='P' ? 'portrait' : '') + ' shape-' + S.shape.v + ' sz-' + S.sz.v + ' pal-' + S.pal.v
    + ' wt-' + S.wt.v + (S.pal.pause==='neutral' ? ' pause-neutral' : '') + ' theme-' + S.theme.v
  applyFont(dev)
  // D39: 非常停止を最初に描く。画面の中身はその後で、描けなくても非常停止は残る
  dev.innerHTML = '<div class="estop-top" data-estop>非常停止</div><div class="toast"></div>'
  let view
  try { if (S.dbg.v==='broken' && S.scr!=='menu') throw new Error('（試し）画面の中身を描けなかった')
        view = S.scr==='menu'?menuView():S.scr==='day'?dayView():prepView() }
  catch(err){ view = `<div class="broken">表示の不具合: ${err.message}</div>` }
  dev.insertAdjacentHTML('afterbegin', view)
  // 自律走行中の枠（options §6.5・案）。機体が自分で走っている間だけ出す。手動・一時停止では出さない
  const auto = (S.scr==='day' && S.day.sub==='moving') || (S.scr==='prep' && S.prep.sub==='return')
  if (auto && S.af.v!=='none') dev.insertAdjacentHTML('beforeend', `<div class="autoframe ${S.af.v}"></div>`)
  if (S.ori==='P' && S.sz.v==='old') dev.querySelectorAll('.content').forEach(c=>{ const mv=c.querySelector('.mainv'); if (mv) mv.style.minHeight='560px' })
  dev.querySelectorAll('.mainv').forEach(m=>{ m.classList.toggle('withradar', !!m.querySelector('.radar')); m.classList.toggle('withflow', !!m.querySelector('.flow')) })
  fit(); placeBubble(dev); renderNotes()
}
// 吹き出し（HTML）をピンの上に置く。地図の SVG は viewBox 1000×620 を枠に「meet」で収めている
function placeBubble(dev){
  const b=dev.querySelector('.bub'); if (!b) return
  const mv=b.parentElement, cw=mv.clientWidth, ch=mv.clientHeight, s=Math.min(cw/1000, ch/620)
  const x=(cw-1000*s)/2 + (+b.dataset.x)*s, y=(ch-620*s)/2 + (+b.dataset.y)*s, r=(+b.dataset.r)*s
  const bw=b.offsetWidth, bh=b.offsetHeight
  const above = y - r - 8 - bh, below = y + r + 8
  b.style.left = Math.min(Math.max(x - bw/2, 8), cw - bw - 8) + 'px'
  b.style.top = (above >= 8 ? above : Math.min(below, ch - bh - 8)) + 'px'
}
function fit(){
  const wrap=document.getElementById('stageWrap'), dev=document.getElementById('dev'), box=document.getElementById('devBox')
  const W=parseFloat(dev.style.width), H=parseFloat(dev.style.height)
  const sc=Math.min((wrap.clientWidth-24)/W,(wrap.clientHeight-24)/H,1.4)
  dev.style.transform=`scale(${sc})`; box.style.width=W*sc+'px'; box.style.height=H*sc+'px'
}
/* ---------------- ヘルプ表示（2026-11-15 ユーザー案・未決） ----------------
   マウス: 重ねて 0.7 秒で出る。外すと消える。
   タップ: 長押し 0.6 秒で出る（その指を離してもボタンは押されない）。「×」か枠の外を押すと閉じる。
   停止│走行（data-nolong）は長押しの対象にしない。非常停止にはヘルプを付けない。 */
const HELP = {
  toggle:['停止 ／ 走行','「停止する」は移動をその場で止めます。行き先は残り、「再開する」で続きを走ります。'],
  jog:['手動','手動操作パネルを開きます。スティックに触れている間だけ動きます。移動中に触れると一時停止します。'],
  abort:['中断','移動をやめて、行き先を選び直します。待機場所へは戻りません。'],
  home:['待機場所','待機場所へ移動します。押すとそのまま出発します。'],
  next:['次の配電盤','登録した順で次の配電盤へ移動します。押すとそのまま出発します。'],
  summon:['呼び寄せ','選んでいる人のいる位置へ機体を呼びます。位置と向きを記録すると出発します。'],
  measure:['測定機能へ','測定機能の画面を開きます。測定中は機体が動きません。'],
  cam:['カメラ','カメラの画面を開きます。機体の状態は変わりません。'],
  exit:['終了','試験を終えてメインメニューへ戻ります。'],
  tracker:['人検出','人の検出を動かす／止めるを切り替えます。呼び寄せに使います。'],
}
let helpT=null, helpSwallow=false
function closeHelp(){ document.querySelector('#dev .help')?.remove() }
function showHelp(el, sticky){
  closeHelp()
  const h=HELP[el.dataset.help]; if (!h) return
  const dev=document.getElementById('dev'), dr=dev.getBoundingClientRect(), r=el.getBoundingClientRect()
  const W=parseFloat(dev.style.width), H=parseFloat(dev.style.height), sc=dr.width/W
  const x=(r.left-dr.left)/sc, y=(r.top-dr.top)/sc, w=r.width/sc, hh=r.height/sc
  const box=document.createElement('div'); box.className='help'+(sticky?' sticky':'')
  const tail = el.dataset.help==='toggle' ? (S.wt.v==='new' ? '色の付いた側が、いま押せる側です。' : '青い側がいまの状態です。') : ''
  box.innerHTML=`<div class="ht"><span>${h[0]}</span><button class="hx" data-helpclose>${ic('close')}</button></div><p>${h[1]}${tail}</p>`
  dev.appendChild(box)
  const ph=box.offsetHeight
  // 出す場所（2026-11-15 決定）: ヘッダ（非常停止）には絶対に重ねない。停止│走行はなるべく避ける。
  // 候補を左・上・下・右の順に試し、停止│走行に重ならない最初のものを使う。どれも重なるなら最初の候補。
  const TOP=(dev.querySelector('.hdr')?.offsetHeight||110)+8, clampX=v=>Math.min(Math.max(v,8),W-348), clampY=v=>Math.min(Math.max(v,TOP),H-ph-8)
  const cands=[[x-348,clampY(y+hh/2-ph/2)],[clampX(x+w/2-170),y-ph-8],[clampX(x+w/2-170),y+hh+8],[x+w+8,clampY(y+hh/2-ph/2)]]
    .filter(([l,t])=>l>=8 && l<=W-348 && t>=TOP && t<=H-ph-8)
  const tg=dev.querySelector('.ctl .tg'); let avoid=null
  if (tg){ const t=tg.getBoundingClientRect(); avoid=[(t.left-dr.left)/sc,(t.top-dr.top)/sc,(t.right-dr.left)/sc,(t.bottom-dr.top)/sc] }
  const hits=([l,t])=>avoid && l<avoid[2] && l+340>avoid[0] && t<avoid[3] && t+ph>avoid[1]
  const [l,t]=cands.find(c=>!hits(c)) || cands[0] || [clampX(x),clampY(y+hh+8)]
  box.style.left=l+'px'; box.style.top=t+'px'
}
document.addEventListener('pointerover', e=>{
  if (!S.help.on || e.pointerType!=='mouse') return
  const el=e.target.closest('#dev [data-help]'); if (!el || document.querySelector('#dev .help.sticky')) return
  clearTimeout(helpT); helpT=setTimeout(()=>showHelp(el,false),700)
})
document.addEventListener('pointerout', e=>{
  if (e.pointerType!=='mouse') return
  const el=e.target.closest('#dev [data-help]'); if (!el || el.contains(e.relatedTarget)) return
  clearTimeout(helpT); if (!document.querySelector('#dev .help.sticky')) closeHelp()
})
document.addEventListener('pointerdown', e=>{
  if (!S.help.on || e.pointerType==='mouse') return
  const el=e.target.closest('#dev [data-help]'); if (!el || el.hasAttribute('data-nolong')) return
  clearTimeout(helpT); helpT=setTimeout(()=>{ helpSwallow=true; showHelp(el,true) },600)
})
for (const ev of ['pointerup','pointercancel','pointermove']) document.addEventListener(ev, e=>{
  if (e.pointerType==='mouse') return
  if (ev==='pointermove' && Math.abs(e.movementX)+Math.abs(e.movementY)<6) return
  clearTimeout(helpT)
})
document.addEventListener('contextmenu', e=>{ if (e.target.closest('#dev')) e.preventDefault() })

document.addEventListener('click', e=>{
  clearTimeout(helpT)
  // 長押しでヘルプを出した指を離しても、ボタンは押されない
  if (helpSwallow){ helpSwallow=false; return }
  // 出したままのヘルプは「×」か枠の外を押すと閉じる（その 1 回はボタンを押したことにしない）。
  // ただしヘッダ（非常停止を含む）と赤い「停止する」は対象外で、ヘルプが出ていても 1 回で効く（2026-11-15 決定）
  const hb=document.querySelector('#dev .help')
  if (hb){ const st=hb.classList.contains('sticky')
    if (e.target.closest('[data-helpclose]') || !e.target.closest('.help')){ closeHelp(); if (st && !e.target.closest('.hdr,.estop-top,.nstop,.go-stop')) return } else return }
  // 薄いボタンを押したら、そのボタンの理由を出す（D16。区切りは空白。「—」は「一」と紛れる）
  const dz=e.target.closest('#dev [data-why]')
  if (dz && dz.dataset.why && dz.matches('.dis,.off')){
    if (S.scr==='day' && S.day.sel){ S.day.sel=null; render() }
    return S.sz.v==='new' ? whyAt(dz, '押せません　'+dz.dataset.why) : toast('押せません　'+dz.dataset.why)
  }
  // 試験（当日）: 吹き出しは、ピンと吹き出しのボタン以外を押すと消える（取り消し。D10）
  if (S.scr==='day' && S.day.sel && e.target.closest('#dev') && !e.target.closest('[data-act="pin"],[data-act="pinGo"],.bub')){
    S.day.sel=null
    const t0=e.target.closest('[data-act]')
    if (!t0 || !t0.dataset.act || t0.closest('.dis,[data-dis]')) return render()
  }
  const t=e.target.closest('[data-scr],[data-sub],[data-ori],[data-opt],[data-act]')
  if (!t) return
  if (t.dataset.scr){ S.scr=t.dataset.scr; return render() }
  if (t.dataset.sub){ setSub(t.dataset.sub); return render() }
  if (t.dataset.ori){ S.ori=t.dataset.ori; return render() }
  if (t.dataset.opt!==undefined){ const o=optsOf()[+t.dataset.opt]; S[o.k[0]][o.k[1]]=JSON.parse(t.dataset.v); return render() }
  if (t.closest('.dis,[data-dis]') && !t.dataset.act) return
  act(t.dataset.act, t.dataset.id)
})
window.addEventListener('resize', fit)
render()
</script>
