<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 作り直しの案</title>
<style>
/* ============================================================
   WebUI の作り直し — 案の画面（docs/plan/ui-redesign.md）
   未確定の検討メモの付録。正本のモックアップ（spec/mockup/）ではない。
   外部リソースを一切読み込まない（機体の AP 配下にネットが無いため）。
   ============================================================ */
:root{
  --bg:#0f1117; --panel:#1a1d24; --inset:#12141b;
  --ctrl:#252830; --ctrl-hi:#343849; --ctrl-on:#2c4a74;
  --bd:#2a2d35; --bd-hi:#3a3f4c;
  --tx:#e6e8ec; --mut:#8b93a1; --dim:#5c6470;
  --brand:#3f8ae0; --brand-lt:#7fb4ee; --brand-dk:#12233d;
  --ok:#4caf50; --ok-tx:#8fd694;
  --warn:#ffb74d; --warn-tx:#ffcc80;
  --ng:#ef5350; --ng-tx:#ff9b98;
  --estop:#c62828; --estop-hi:#e53935;
  --g-field:#26a69a; --g-drive:#3f8ae0; --g-maint:#a1887f;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07090d;color:var(--tx);font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- 外側（説明・切り替え） ---------- */
#bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);background:#0b0d12}
#bar h1{font-size:15px;font-weight:700;color:var(--mut);margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--bd-hi);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--mut);border-right:1px solid var(--bd-hi)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ctrl-on);color:#fff;font-weight:700}
.lbl{font-size:12px;color:var(--mut);margin-right:4px}
#main{flex:1;display:flex;min-height:0}
#stageWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
#notes{width:360px;flex:none;border-left:1px solid var(--bd);background:#0b0d12;overflow:auto;padding:14px 16px;font-size:13px;line-height:1.65}
#notes h2{font-size:14px;margin:14px 0 6px;color:var(--brand-lt)}
#notes h2:first-child{margin-top:0}
#notes ul{padding-left:18px}
#notes li{margin:3px 0}
#notes .count{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px}
#notes .count b{font-size:18px}
#notes .opt{margin:6px 0 10px}
#notes .opt .q{color:var(--tx);font-weight:700;margin-bottom:4px}
#notes .ref{color:var(--mut);font-size:12px}
@media (max-width:1000px){#main{flex-direction:column}#notes{width:auto;border-left:none;border-top:1px solid var(--bd);max-height:40vh}}

/* ---------- 機体の画面（論理サイズで描き、縮小して見せる） ---------- */
#dev{position:relative;background:var(--bg);overflow:hidden;transform-origin:top left;flex:none;box-shadow:0 0 0 1px var(--bd-hi),0 10px 40px #000}
#devBox{flex:none}
.hdr{height:110px;display:flex;flex-direction:column;border-bottom:2px solid var(--brand)}
.hdr .r1{height:50px;display:flex;align-items:center;padding:0 14px;background:linear-gradient(#182a45,#121c2c)}
.hdr .logo{flex:none;width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:8px}
.hdr .brand{flex:none;font-size:14px;line-height:1.2;color:#fff;font-weight:700}
.hdr .brand small{display:block;color:var(--brand-lt);font-size:11px;font-weight:400}
.hdr .title{flex:0 1 auto;min-width:0;margin-left:16px;font-size:26px;font-weight:800;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .gap{flex:1}
.hdr .zone{flex:none;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--warn);color:var(--warn-tx);white-space:nowrap}
.hdr .mst{flex:none;margin-left:8px;font-size:18px;font-weight:800;padding:3px 12px;border-radius:8px;background:#22314a;color:#fff;white-space:nowrap}
.hdr .mst.run{background:var(--brand)}
.hdr .mst.pause{background:var(--warn);color:#111}
.hdr .r2{flex:1;display:flex;align-items:stretch;background:#121722}
.hdr .st{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:16px}
.hdr .st i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
/* 非常停止（D39。2026-11-17）: 画面の中身とは別に、最初に描いていちばん上に重ねる。ほかの表示が壊れても残り、押せる */
.estop-top{position:absolute;z-index:100;right:6px;top:53px;height:51px;width:320px;box-sizing:border-box;border-radius:10px;border:2px solid #ff8a80;background:linear-gradient(#e53935,#b71c1c);color:#fff;font-size:26px;font-weight:800;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #6d1010,0 6px 10px #0009,inset 0 1px 0 #ffffff55;text-shadow:0 1px 2px #0008;cursor:pointer}
.estop-top:active{transform:translateY(3px);box-shadow:0 1px 0 #6d1010,inset 0 1px 0 #ffffff55}
.body{position:absolute;left:0;right:0;top:110px;bottom:0;display:flex;flex-direction:column}
.opbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--bd)}
.opbar .crumb{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.opbar .crumb svg{width:28px;height:28px}
.opbar .pill{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--ng);color:var(--ng-tx)}
.content{flex:1;min-height:0;display:flex;gap:12px;padding:12px 14px}
.portrait .content{flex-direction:column}

.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);background:var(--ctrl);border:1px solid var(--bd-hi);font-size:18px;font-weight:700;white-space:nowrap}
.b svg{width:22px;height:22px;flex:none}
.b.dis{opacity:.32;cursor:not-allowed;background:var(--inset);border-style:dashed}
.b.exit{min-height:42px;font-size:16px}
.b.save{background:#1f4d2a;border-color:var(--ok);color:var(--ok-tx)}
.b.adv{background:var(--ctrl-on);border-color:var(--brand)}

/* 対のトグル（R4） */
.tg{display:flex;border-radius:12px;border:2px solid var(--bd-hi);overflow:hidden;min-height:56px;background:var(--inset)}
.tg > div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:800;gap:1px;position:relative}
.tg > div small{font-size:11px;font-weight:400;color:var(--mut)}
.tg .cur{background:var(--ctrl-on);color:#fff}
.tg .cur small{color:#cfe1f7}
.tg .nstop{background:#8e1f1f;color:#fff;cursor:pointer}
.tg .nrun{background:var(--ctrl);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 3px #fff}
.tg .nrun.blink{animation:blink 2.4s ease-in-out infinite}   /* D43: 操作を促すのはゆっくりした明滅 */
@keyframes blink{50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}}
.tg .off{color:var(--dim)}
.tg .sep{flex:none;width:2px;background:var(--bd-hi)}
.tg .inert{color:var(--mut);cursor:pointer}
.tg .press{background:var(--ctrl);cursor:pointer}
.tg.big{min-height:76px}
.tg.big > div{font-size:23px}
.tg.big > div small{font-size:12px}
.b.two span{line-height:1.15;text-align:left}
.b.two span small{display:block;font-size:14px;font-weight:700;color:var(--brand-lt);min-height:16px}
.b.f16{font-size:16px;padding:0 10px}
.sec.noh h3{display:none}
#dev [data-help]{-webkit-touch-callout:none;user-select:none}
.help{position:absolute;width:340px;background:#20283a;border:2px solid var(--brand-lt);border-radius:12px;padding:12px 14px;z-index:9;box-shadow:0 8px 28px #000a}
.help .ht{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:6px}
.help .ht span{flex:1}
.help .hx{flex:none;width:40px;height:40px;border-radius:8px;background:var(--ctrl);border:1px solid var(--bd-hi);display:none;align-items:center;justify-content:center}
.help .hx svg{width:20px;height:20px}
.help.sticky .hx{display:flex}
.help p{font-size:15px;line-height:1.6;color:#d6dbe4}

/* 2026-11-16 決定（D28）: 区画の枠なし・アイコンはメインメニューだけ・押せないボタンは点線にしない */
.sec{background:transparent !important;border-color:transparent !important}
.b{font-weight:600}
.b.dis{border-style:solid !important;background:var(--ctrl) !important;opacity:.36}

/* ボタンの形の比較（2026-11-16。位置と大きさは変えない） */
.shape-sq{--r:3px}
.shape-sq .tg,.shape-sq .mseg,.shape-sq .tile,.shape-sq .estop-top{border-radius:3px}
.shape-pill .b{border-radius:999px}
.shape-pill .tg,.shape-pill .mseg{border-radius:999px}
.shape-role .b{border-radius:3px}
.shape-role .tg,.shape-role .mseg{border-radius:4px}
.shape-role .b.go,.shape-role .b.adv{border-radius:999px}
.shape-role .b.exit{border-radius:3px 14px 14px 3px}

.mapctl{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;z-index:3}
.mapctl .b{min-height:44px;font-size:16px;background:#232733e6}

/* 右列（試験場内） */
.ctl{width:440px;flex:none;display:flex;flex-direction:column;gap:8px}
.portrait .ctl{width:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portrait .ctl .full{grid-column:1/-1}
.sec{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.sec h3{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px;letter-spacing:.05em}
.sec .row{display:flex;gap:8px}
.sec .row > *{flex:1}
.sec .why{height:18px;margin-top:6px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{padding:4px 2px}
.state .s1{font-size:22px;font-weight:800;height:32px;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state .s2{font-size:14px;color:var(--mut);margin-top:2px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden}
.mseg{display:flex;border:1px solid var(--bd-hi);border-radius:10px;overflow:hidden;margin-bottom:8px}
.mseg > div{flex:1;text-align:center;padding:10px 4px;font-size:15px;font-weight:700;color:var(--mut);border-right:1px solid var(--bd-hi);cursor:pointer}
.mseg > div:last-child{border-right:none}
.mseg > div.on{background:var(--ctrl-on);color:#fff}
.mseg > div.dis{opacity:.35;cursor:not-allowed}
.mseg.dis > div{opacity:.35;cursor:not-allowed}

/* 主表示 */
.mainv{flex:1;min-width:0;min-height:0;position:relative;background:var(--inset);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.mainv svg.map{position:absolute;inset:0;width:100%;height:100%}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,17,23,.72)}
.center .card{background:var(--panel);border:1px solid var(--bd-hi);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:420px;text-align:center}
.center .card p{color:var(--mut);font-size:15px}
.center .card .b{min-height:64px;font-size:20px}
.flow{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(26,29,36,.96);border:1px solid var(--bd-hi);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px}
.flow .stp{font-size:13px;color:var(--brand-lt);font-weight:700;white-space:nowrap}
.flow .msg{flex:1;font-size:16px}
.radar{position:absolute;top:12px;right:12px;width:300px;height:300px;background:rgba(18,20,27,.95);border:1px solid var(--bd-hi);border-radius:12px}
.radar.big{position:absolute;inset:12px 12px 96px 12px;width:auto;height:auto}
.radar .cap{position:absolute;left:10px;top:8px;font-size:12px;color:var(--mut)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#263248;border:1px solid var(--brand);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:5}
.toast.show{opacity:1}
/* 押せない理由（§6.6）: 押したボタンのすぐ上（入らなければ下）に、そのボタンを指して出す */
.why-pop{position:absolute;z-index:60;max-width:460px;background:#263248;border:2px solid var(--mut);color:#fff;padding:10px 14px;border-radius:10px;font-size:17px;line-height:1.4;pointer-events:none;box-shadow:0 6px 18px #000a}
.why-pop::after{content:'';position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#263248;border:2px solid var(--mut);transform:translateX(-50%) rotate(45deg)}
.why-pop.up::after{bottom:-8px;border-top:none;border-left:none}
.why-pop.down::after{top:-8px;border-bottom:none;border-right:none}

/* メインメニュー */
.tiles{flex:1;display:grid;gap:12px;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;min-height:0}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--panel);border:1px solid var(--bd-hi);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;padding:10px;text-align:center}
.tile svg{width:64px;height:64px}
.tile .nm{font-size:24px;font-weight:800}
.tile .nm .ar{font-size:18px;color:var(--mut);margin-left:4px}
.tile .why{font-size:13px;color:var(--warn-tx);min-height:18px}
.tile.dis{opacity:.38;cursor:not-allowed;border-style:dashed}
.tile.empty{visibility:hidden}
.tile.l svg{width:92px;height:92px}
.tile.l .nm{font-size:32px}
.tile.s{flex-direction:row;gap:14px}
.tile.s svg{width:36px;height:36px}
.tile.s .nm{font-size:20px}
.tg.sm{min-height:42px;border-radius:10px;width:250px}
.tg.sm > div{font-size:15px;flex-direction:row;gap:6px}
.tg.sm > div small{display:none}
.opbar .cap{font-size:14px;color:var(--mut);margin-left:14px;font-weight:700}
.tile.g{border-left-width:6px}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:12px}
.portrait .side{width:auto;display:grid;grid-template-columns:1fr 1fr}
.portrait .side .full{grid-column:1/-1}
.banner{display:flex;align-items:center;gap:12px;padding:0 14px;height:58px;font-size:22px;font-weight:800;border-radius:10px;margin-bottom:12px}
.banner svg{width:34px;height:34px}
.mcol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.kv{display:flex;align-items:center;gap:8px;font-size:15px}
.kv i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.cnt{margin-left:auto;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--ng);color:var(--ng-tx)}
.b.halt{background:#4a1717;border-color:#8e2b2b;color:var(--ng-tx);width:100%;margin-top:10px}

/* ============================================================
   2026-11-17 評価（critique）を受けた修正案（ui-redesign-options.md §6）
   どれも案。切り替えで 11-16 の版（下の上書きが効かない状態）と比べられる。
   ============================================================ */

/* §6.1 重さ: 塗るのは「いま押せる側」だけ。語は動詞で固定 */
.tg2 > div{font-weight:800}
.tg2 .idle{color:var(--dim);background:var(--inset)}
.tg2 .go-stop{background:#b3261e;color:#fff;cursor:pointer}
.tg2 .go-run{background:var(--act,var(--ctrl-on));color:#fff;cursor:pointer;box-shadow:inset 0 0 0 3px #fff}
.tg2 .go-run.blink{animation:blink2 2.4s ease-in-out infinite}
@keyframes blink2{50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);filter:brightness(1.25)}}
.tg.sm .curoff{background:var(--ctrl-hi);color:var(--tx)}
.where{display:flex;align-items:baseline;gap:12px;height:40px;padding:0 2px;white-space:nowrap;overflow:hidden}
.where span{flex:1;min-width:0;font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.where b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.b.next{width:100%;min-height:64px}
.b.next span small{font-size:16px}
.b.next.adv span small{color:#dbe7fb}
.b.next:not(.adv) span small{color:var(--mut)}

/* §6.2 大きさ: タブレット（iPad）では論理キャンバスが 0.8 倍に縮む。縮んでも押す的 44 px・文字 12 px を割らないよう、
   論理 px で 押す的 56 以上・文字 15 以上にする。非常停止（76）は画面でいちばん高いボタンに保つ */
.sz-new .hdr{height:134px}
.sz-new .hdr .r1{height:48px}
.sz-new .hdr .logo{font-size:13px}
.sz-new .hdr .brand small{font-size:13px}
.sz-new .hdr .zone{font-size:15px}
.sz-new .hdr .r2{align-items:center}
.sz-new .estop-top{top:52px;height:76px;width:max(330px,26%);font-size:28px}
.sz-new.portrait .estop-top{width:47%}
.sz-new .body{top:134px}
.sz-new .opbar{height:68px}
.sz-new .b,.sz-new .b.exit{min-height:56px}
.sz-new .b.exit{font-size:17px}
.sz-new .sec{padding:2px 2px}
.sz-new .sec h3{font-size:15px;margin-bottom:6px}
.sz-new .ctl{width:400px;gap:10px}
.sz-new.portrait .ctl{width:auto}
.sz-new .tg{min-height:60px}
.sz-new .tg.big{min-height:68px}
.sz-new .tg.sm{min-height:60px;width:260px}
.sz-new .tg.sm > div{font-size:17px}
.sz-new .opbar .cap{font-size:16px}
.sz-new .mseg > div{min-height:56px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1.2}
.sz-new .mapctl .b{min-height:56px}
.sz-new .tile .why{font-size:15px}
.sz-new .kv{font-size:16px}
.sz-new .cnt,.sz-new .opbar .pill{font-size:15px}
.sz-new .radar .cap,.sz-new .flow .stp{font-size:15px}
.sz-new .flow .msg{font-size:17px}
.sz-new .center .card .b{min-height:64px}
.sz-new .center .card p{font-size:17px}
.sz-new .radar:not(.big){width:250px;height:250px}
.sz-new .mainv.withradar svg.map{width:calc(100% - 274px)}
.sz-new .mainv.withflow svg.map{height:calc(100% - 96px)}
.sz-new .mapctl{top:10px;bottom:auto}
.sz-new .b.caution{border-color:var(--warn);color:var(--warn-tx)}
.bub{position:absolute;width:280px;background:#232733;border:2px solid var(--act-lt,#7fb4ee);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;z-index:4;box-shadow:0 6px 20px #000a}
.bub .nm{font-size:22px;font-weight:800}
.bub .b{width:100%;min-height:60px;font-size:20px}

/* §6.5 自律走行中の枠: 画面の縁を「進む」の色で囲む。非常停止（z 100）より下、押す操作は邪魔しない
   点滅の 3 段（D43）: 操作を促す＝ゆっくりした明滅（2.4 s）／注意＝点滅（1 Hz で点く・消える）／より高い注意＝高速点滅（予約。3 Hz 未満） */
.autoframe{position:absolute;left:0;right:0;bottom:0;top:110px;z-index:50;pointer-events:none;box-shadow:inset 0 0 0 6px var(--act-lt,#7fb4ee)}
.autoframe.pulse{animation:afp 1s steps(1,end) infinite}
.blink-fast{animation:afp .4s steps(1,end) infinite}   /* 予約（D43）。いまは使わない */
.sz-new .autoframe{top:134px}
@keyframes afp{0%{opacity:1}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.autoframe.pulse,.blink-fast,.tg .nrun.blink,.tg2 .go-run.blink{animation:none}}
.broken{position:absolute;left:0;right:0;top:140px;padding:24px;font-size:20px;color:var(--warn-tx)}

/* §6.8 画面の地: 明るい（案）。1 色 1 意味（D37）はそのまま、地と文字の明暗だけを入れ替える */
.theme-light,.theme-light.pal-new{--bg:#f4f6f9;--panel:#ffffff;--inset:#eef1f5;--ctrl:#e6eaf0;--ctrl-hi:#d5dbe4;--ctrl-on:#2f6bc6;
  --bd:#d7dde5;--bd-hi:#b9c2ce;--tx:#161b22;--mut:#4f5866;--dim:#8d95a1;--brand-lt:#2a5fa8;
  --ok-tx:#1f7a2e;--warn:#e08a00;--warn-tx:#8a5300;--ng-tx:#b3261e;--act-lt:#2f6bc6;
  --sel-bg:#1f2733;--sel-tx:#ffffff;--pin-panel:#5b6675;--pin-home:#5b6675;--pin-sel:#1f2733;--pin-homesel:#1f2733;--pin-tx:#ffffff;
  --dest:#2f6bc6;--route:#2f6bc6;--robot:#2f6bc6;--robot-fp:rgba(47,107,198,.18);--lab:#161b22;--lab-bd:#ffffff;color:var(--tx)}
/* ヘッダは青の帯（2026-11-19 ユーザー決定: 青は我々を象徴する色で UI のメインカラー。意味を持たせない）。
   青は操作・状態の色には使わないので、帯が青でも札やボタンの意味と重ならない */
.theme-light .hdr{color:#ffffff;border-bottom:2px solid #163d75}
.theme-light .hdr .r1{background:#1f4f96}
.theme-light .hdr .r2{background: #d1d7e0ff;border-bottom:1px solid #b9c2ce}
.theme-light .hdr .logo,.theme-light.pal-new .hdr .logo{background:#ffffff;color:#1f4f96}
.theme-light .hdr .brand{color:#ffffff}
.theme-light .hdr .brand small{color:#cfdcf0}
.theme-light .hdr .st{color:#161b22}
.theme-light .hdr .st i{box-shadow:none}
.theme-light .hdr .mst{background:#ffffff;color:var(--tx);box-shadow:none}
.theme-light .hdr .mst.run{color:#fff;box-shadow:inset 0 0 0 2px #ffffff}
.theme-light.pal-new .hdr .zone{border-color:#cfdcf0;color:#ffffff;background:transparent}
.theme-light.pause-neutral .hdr .mst.pause,.theme-light.pal-new.pause-neutral .hdr .mst.pause{background:#ffffff;color:#161b22;box-shadow:none}
.theme-light .tg{border-color:var(--bd-hi)}
.theme-light .tg2 .go-run{box-shadow:inset 0 0 0 3px #fff}
/* 押せるボタンは白く浮かせ、押せないボタンは平たく沈める（明るい地では塗りの差だけだと見分けにくい） */
.theme-light .b:not(.adv):not(.dis),.theme-light .mseg{background:#ffffff;box-shadow:0 1px 3px #0000001f}
.theme-light .b:not(.adv):not(.dis){border-color:var(--bd-hi)}
.theme-light.pal-new .b.dis{background:transparent !important;border-color:var(--bd) !important;color:#7d8592;box-shadow:none}
.theme-light .tg{box-shadow:0 1px 3px #0000001f}
.theme-light.pal-new .mapctl .b,.theme-light.pal-new .mapctl .b.dis,.theme-light .mapctl .b{background:#ffffffee !important}
.theme-light .center{background:rgba(244,246,249,.78)}
.theme-light .flow{background:rgba(255,255,255,.97)}
.theme-light .radar{background:rgba(255,255,255,.97)}
.theme-light .bub{background:#ffffff}
.theme-light .help{background:#ffffff;border-color:var(--act-lt)}
.theme-light .help p{color:var(--tx)}
.theme-light .banner{color:var(--tx) !important}
.theme-light .tile.dis,.theme-light .tile{box-shadow:0 1px 2px #0000000f}

/* §6.3 色: 1 色 1 意味。青＝機体が進むこと（出発・再開のボタン・機体・経路・行き先）／赤＝止める操作だけ／
   橙＝人が見るべき注意だけ／緑＝正常だけ／選んでいるもの＝明るい反転 */
.pal-new{--act:#2f6bc6;--act-lt:#8ab4f0;--sel-bg:#e6e8ec;--sel-tx:#0f1117;--g-drive:#8f8a3e;
  --pin-panel:#c3ccd8;--pin-sel:#ffffff;--pin-home:#c3ccd8;--pin-homesel:#ffffff;--dest:#8ab4f0;--route:#8ab4f0}
.pal-new .hdr .logo{background:#2a5fa8}
.pal-new .hdr .zone{border-color:var(--bd-hi);color:var(--mut)}
.pal-new .hdr .mst.run{background:var(--act)}
.pal-new.pause-neutral .hdr .mst.pause{background:var(--sel-bg);color:var(--sel-tx)}
.pal-new .b.adv{background:var(--act);border-color:var(--act);color:#fff}
.pal-new .b.save,.pal-new .b.halt{background:var(--ctrl);border-color:var(--bd-hi);color:var(--tx)}
.pal-new .b.dis{opacity:1 !important;background:transparent !important;border-color:var(--bd-hi) !important;color:#7a8291}
.pal-new .mapctl .b.dis,.pal-new .mapctl .b{background:#1a1d24f0 !important}
.pal-new .cnt,.pal-new .opbar .pill{border-color:var(--warn);color:var(--warn-tx)}
.pal-new .mseg > div.on{background:var(--sel-bg);color:var(--sel-tx)}
.pal-new .tg .cur{background:var(--sel-bg);color:var(--sel-tx)}
.pal-new .tg2 .go-run{background:var(--act)}
.pal-new .tile.g{border-left-width:1px;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 18%,var(--panel)),var(--panel) 62%)}

/* §6.9 色を JIS B 9960-1:2019（IEC 60204-1）に合わせる（案。2026-11-19）
   10.2.1 アクチュエータ: 非常停止＝赤、そのすぐ背後は黄（赤と黄の組は非常停止だけ）／起動＝白・灰・黒・緑（赤は不可）／
     停止＝黒が一番よい（赤は非常停止の近くでは使わない）／入切の交互切換え・押している間だけ動く＝白・灰・黒／黄＝異常、自動サイクルの中断
   10.3.2 表示: 赤＝非常／黄＝異常／青＝試験員の行動が必要／緑＝正常／白＝中立
   10.3.3 点滅: 注意・即時行動の要求・変化が進行中 */
.pal-new.col-jis{--act:#1f7a35;--act-lt:#5cc477;--dest:#5cc477;--route:#5cc477;--robot:#5cc477;--robot-fp:rgba(92,196,119,.22);
  --stop:#0b0d10;--jis-y:#ffd100;--warn:#e6b800;--warn-tx:#ffd84d}
.theme-light.pal-new.col-jis{--act:#1f7a35;--act-lt:#1f7a35;--dest:#1f7a35;--route:#1f7a35;--robot:#1f7a35;--robot-fp:rgba(31,122,53,.16);
  --stop:#161b22;--warn:#d9a800;--warn-tx:#5c4700;--sel-bg:#5b6675;--sel-tx:#ffffff}
.estop-plate{display:none}
/* 非常停止のすぐ背後の黄は、ボタンの縁ではなく「地」として見せる: ヘッダ下段の右端を角の無い黄の板にし、その上に赤を載せる */
.col-jis .estop-plate{display:block;position:absolute;z-index:99;right:0;top:50px;height:60px;width:332px;background:var(--jis-y,#ffd100)}
.col-jis.sz-new .estop-plate{top:48px;height:86px;width:calc(max(330px,26%) + 12px)}
.col-jis.sz-new.portrait .estop-plate{width:calc(47% + 12px)}
/* 板の中心に置く: 下に落とす立体の影は板の上で中心がずれて見えるので外し、ボタン（76）を板（86）の上下中央（上下 5・左右 6）に置く */
.col-jis .estop-top{box-shadow:inset 0 1px 0 #ffffff55,inset 0 -3px 0 #00000033}
.col-jis .estop-top:active{transform:none;filter:brightness(.85)}
.col-jis.sz-new .estop-top{top:53px}
.col-jis:not(.sz-new) .estop-top{top:54.5px}
.pal-new.col-jis .tg2 .go-stop{background:var(--stop);color:#fff}
.pal-new.col-jis:not(.theme-light) .tg2 .go-stop{box-shadow:inset 0 0 0 2px #ffffff55}
.pal-new.col-jis .b.interrupt:not(.dis){background:var(--jis-y);border-color:#a88a00;color:#161b22}
.theme-light.col-jis .help{border-color:#8d97a5}

/* ============================================================
   2026-11-21 目標 G1（読まずに分かる）・G2（AI っぽさを無くす）
   ui-redesign-ai-tells.md §2.2 の B1〜B3 と B6（異常時の画面）
   ============================================================ */
/* B3: 数値は桁の揃う数字（Spec-webui.md §8） */
#dev{font-variant-numeric:tabular-nums}
/* B2: 角は 3 段だけ（4 px＝操作／8 px＝入れ物・浮く窓／丸＝出発と札）。片側だけ丸い「終了」は D32 のまま */
.shape-role .b,.shape-role .tg,.shape-role .mseg,.shape-role .hdr .mst,.shape-role .mapctl .b{border-radius:4px}
.shape-role .b.go,.shape-role .b.adv{border-radius:999px}
.shape-role .b.exit{border-radius:4px 999px 999px 4px}
.shape-role .tile,.shape-role .mainv,.shape-role .sec,.shape-role .center .card,.shape-role .flow,.shape-role .radar,
.shape-role .bub,.shape-role .help,.shape-role .why-pop,.shape-role .banner,.shape-role .win,.shape-role .estop-top{border-radius:8px}
/* B1: 装飾のグラデーションを外す（非常停止の立体だけは「押しボタンに見せる」ため残す。D29） */
.hdr .r1{background:#182a45}
.pal-new .tile.g{background:color-mix(in srgb,var(--gc) 10%,var(--panel))}

/* B6: 異常時の画面（Spec-webui.md §4 W-1・W-2・§1.5 解除バー）。窓は地図の上に置き、右列（停止・中断）を覆わない */
.hdr .r2 .al{display:flex;align-items:center;gap:10px;padding:0 16px;font-size:18px;font-weight:800;white-space:nowrap}
.hdr .r2 .al svg{width:24px;height:24px;flex:none}
.hdr .r2 .al.ab{background:var(--jis-y,#ffd100);color:#161b22}          /* 異常＝黄（JIS 10.3.2） */
.hdr .r2 .al.em{background:#b71c1c;color:#fff}                           /* 非常停止中＝赤 */
.hdr .r2 .al.past{color:var(--mut);font-weight:600;font-size:16px}       /* 直近の異常（3 分ほどで消える。D23・D45） */
/* 2026-11-21 ユーザー決定: 異常の窓は画面の中央に置き、ヘッダ以外を暗くする（異常の間は操作させず、ハードの異常の解消を待たせる） */
.scrim{position:absolute;inset:0;z-index:6;background:rgba(10,14,22,.55)}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 48px));z-index:7;background:var(--panel);border:2px solid var(--bd-hi);padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 18px #0003}
.win.ab{border-color:var(--jis-y,#ffd100);border-width:3px}
.win.em{border-color:#b71c1c;border-width:3px}
.win .pict svg[data-act]{cursor:pointer}
.win .wt{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800}
.win .wt svg{width:34px;height:34px;flex:none}
.win .wl{font-size:18px;line-height:1.5}
.win .wl.mut{color:var(--mut);font-size:16px}
.win .wb{display:flex;gap:10px}
.win .wb .b{flex:1;min-height:64px;font-size:20px}
.win .wb .b.sm{flex:none;min-width:120px}
.win .pict{display:flex;align-items:center;gap:18px}
.win .pict svg{width:96px;height:96px;flex:none;color:var(--tx)}
/* 解除の帯（D52）: 白地・黒の太い枠・角なし。誤って押さないよう小さめ。画面の配置に左右されないよう、本文の下端の中央に固定（D53） */
.relbar{position:absolute;z-index:8;left:50%;transform:translateX(-50%);width:300px;bottom:20px;height:56px;box-shadow:0 4px 14px #0003;display:flex;align-items:center;justify-content:center;gap:12px;background:#ffffff;color:#161b22;border:3px solid #161b22;font-size:20px;font-weight:800;cursor:pointer;border-radius:0}
.relbar svg{width:26px;height:26px}
.hdr .r2 .al{align-self:stretch}
@media (prefers-reduced-motion:no-preference){.win .b.adv.blink{animation:blink2 2.4s ease-in-out infinite}}

/* 2026-11-22 ユーザー決定（D54）: 試験準備は地図を手動で作るので、仮想スティックを常設する（「手動」ボタンで開閉しない）。
   地図の右の帯（レーダーと同じ幅）の下に固定。レーダーの有無・登録中の帯に左右されず、いつも同じ場所 */
.mainv.withstick svg.map{width:calc(100% - 274px)}
.mainv.withstick .flow{right:274px}
.stick{position:absolute;right:12px;bottom:12px;width:250px;height:216px;z-index:3;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--bd-hi);border-radius:8px;touch-action:none;cursor:pointer}
.stick svg{width:196px;height:196px}
.stick .cap{position:absolute;left:10px;top:8px;font-size:15px;color:var(--mut);font-weight:700}
.stick:active .knob{transform:translateY(-22px)}
.stick .knob{transition:transform .08s}

/* ============================================================
   2026-11-22 試験準備の配置案（スティックを常設した D54 の後付け感を受けて）。切り替え「試験準備の配置（案）」
   手動操作は実装の部品（JogConsole: 速度のスライダ＋スティック＋速度の段）と同じ組み。場内なので「高速」は出さない
   ============================================================ */
.jogc{display:flex;gap:10px;align-items:stretch;min-height:0;flex:1}
.jogc .sl{flex:none;width:30px;border-radius:999px;background:var(--inset);border:1px solid var(--bd-hi);position:relative}
.jogc .sl i{position:absolute;left:3px;right:3px;bottom:3px;height:55%;border-radius:999px;background:var(--ctrl-hi)}
.jogc .stk{flex:1;min-width:160px;display:flex;align-items:center;justify-content:center;background:var(--inset);border:1px solid var(--bd-hi);border-radius:8px;cursor:pointer;touch-action:none}
.jogc .stk svg{width:100%;height:100%;max-height:260px;max-width:260px}
.jogc .stk:active .knob{transform:translateY(-22px)}
.jogc .stk .knob{transition:transform .08s}
.jogc .spp{flex:none;width:84px;display:flex;flex-direction:column;gap:8px}
.jogc .spp .b{flex:1;min-height:56px;padding:0}
.jogc .spp .b.on{background:var(--sel-bg) !important;color:var(--sel-tx) !important}
.lay .content{display:grid;gap:12px}
.lay .blk{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.lay .blk h3{font-size:15px;color:var(--mut);font-weight:700;letter-spacing:.05em}
.lay .blk .row{display:flex;gap:8px}
.lay .blk .row > *{flex:1}
.lay .mainv{grid-area:map}
.lay .b-ops{grid-area:ops}.lay .b-jog{grid-area:jog}.lay .b-reg{grid-area:reg}
.lay .b-reg .radar{position:relative !important;inset:auto !important;width:100% !important;height:220px !important;flex:none}
.lay .b-reg .mseg{flex:none;margin:0}
.lay .b-reg .b{font-size:17px;padding:0 8px}
.lay .regbar{display:flex;gap:8px;align-items:stretch}
.lay .regbar .mseg{flex:1.4;margin:0}
.lay .regbar .b{flex:1}
/* 案 A: 追従走行（S-10）と同じ並び。右列＝操作カード＋手動。登録は地図の下の帯 */
.lay-A .content{grid-template-columns:1fr 400px;grid-template-rows:auto 1fr auto;grid-template-areas:"map ops" "map jog" "reg jog"}
.lay-A.portrait .content{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto auto;grid-template-areas:"map map" "reg reg" "ops jog"}
.lay-A.portrait .b-jog{height:290px}
/* 案 B: 役割で左右に分ける。左＝走らせる（左手）／中央＝地図／右＝登録する */
.lay-B .content{grid-template-columns:400px 1fr 320px;grid-template-areas:"jog map reg"}
.lay-B.portrait .content{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"map map" "jog reg"}
/* 案 C: 地図を左に寄せ、右に 2 列（登録する｜走らせる）。スティックが右端（右手） */
.lay-C .content{grid-template-columns:1fr 320px 400px;grid-template-areas:"map reg jog"}
.lay-C.portrait .content{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"map map" "reg jog"}
.lay-B .b-jog .jogc,.lay-C .b-jog .jogc{max-height:300px}
.lay-B.portrait .b-reg .radar,.lay-C.portrait .b-reg .radar{max-height:210px}
.lay .b-reg .mseg.vert{flex-direction:column}
.lay .b-reg .mseg.vert > div{border-right:none;border-bottom:1px solid var(--bd-hi)}
.lay .b-reg .mseg.vert > div:last-child{border-bottom:none}
.lay .b-reg .mseg.vert > div{min-height:48px}

/* ピンの編集の吹き出し（試験準備） */
.bub .pin-name{width:100%;min-height:56px;font:inherit;font-size:20px;padding:0 12px;border:2px solid var(--bd-hi);border-radius:4px;background:var(--panel);color:var(--tx)}
.bub .row{display:flex;gap:8px}.bub .row .b{flex:1;font-size:18px}
.bub .b.caution.armed{background:var(--jis-y,#ffd100) !important;color:#161b22 !important}

/* 2026-11-22 案の画面に無かった機能（options §3.4） */
.win .big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.bub .ordrow{display:flex;align-items:center;gap:8px;font-size:17px}
.bub .ordrow span{flex:1;white-space:nowrap}
.bub .ordrow .b{width:auto !important;flex:none;min-width:76px;font-size:17px}
.mainv svg.tapmk{position:absolute;inset:0;width:100%;height:100%}
.mainv.withradar svg.tapmk{width:calc(100% - 274px)}
.mainv.withflow svg.tapmk{height:calc(100% - 96px)}

/* 2026-11-22 帯（地図の下）。登録の帯に重ねて出す（D66） */
/* 帯は登録の帯の上に重ねる（D66）。地図の大きさは変えない。登録の帯の段は 64 px で固定 */
.lay-A .b-reg{position:relative;min-height:64px;justify-content:center}
.bandc.over{position:absolute;inset:0;z-index:2}
.bandc{display:flex;align-items:center;gap:10px;min-height:64px;padding:4px 8px;border:1px solid var(--bd-hi);border-radius:8px;background:var(--panel)}
.bandc.ab,.flow.ab{border:3px solid var(--jis-y,#ffd100)}
.bandc .stp{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;white-space:nowrap}
.bandc .stp svg{width:22px;height:22px}
.bandc .msg{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bandc .b{flex:none;font-size:16px;padding:0 12px}

/* ============================================================
   2026-11-23 全画面への展開（ui-redesign-screens.md）。画面の 3 つの型
   走らせる＝.g-drv（主表示＋右列 ①どこへ ②停止│走行 ③その画面の操作 ④手動）
   手順を進める＝.g-list（左＝項目の一覧／右＝手順。下端に やめる｜進む）
   見る・変える＝.g-list（左＝区分の一覧／右＝中身。下端の右に 保存）・S-00 は .g-conn
   ============================================================ */
.content.g-drv{display:grid;gap:12px;grid-template-columns:1fr 400px;grid-template-rows:minmax(0,1fr)}
.g-drv .rcol{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.g-drv .rops{display:flex;flex-direction:column;gap:10px;flex:none}
.g-drv .rrow{display:flex;flex-direction:column;gap:8px;min-height:56px}
.g-drv .rrow .row{display:flex;gap:8px}.g-drv .rrow .row > *{flex:1}
.g-drv .rjog{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.g-drv .rjog .jogc{flex:1}
.g-drv .rjog h3,.g-drv .rrow h3{font-size:15px;color:var(--mut);font-weight:700;letter-spacing:.05em}
.portrait .content.g-drv{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
.portrait .g-drv .rcol{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.portrait .g-drv .rjog{height:330px}
.g-drv .b.stopone{width:100%;min-height:68px;font-size:23px;font-weight:800}
.g-drv .b.stopone:not(.dis){background:#b3261e;border-color:#b3261e;color:#fff}
.col-jis .g-drv .b.stopone:not(.dis){background:var(--stop);border-color:var(--stop)}
.b.big{min-height:72px;font-size:21px;width:100%}
.mkline{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;white-space:nowrap}
.where .mkline{flex:1}
.where .mk{flex:none !important}
/* 進むボタン: 機体が動くときだけ出発の色（adv）で塗る。動かない「確かめる」「確定する」「この経路で進む」は太い縁（1 色 1 意味。D37） */
.b.fwd{border:3px solid var(--tx) !important;font-weight:800}
.tg3{display:flex}

/* 結果の印（P1）: 形で区別する。赤は使わない */
.mk{display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:900;line-height:1}
.mk.ok{background:var(--ok);color:#fff}
.mk.warn{border:3px solid var(--warn);color:var(--warn-tx);background:transparent}
.mk.ng{background:var(--jis-y,#ffd100);color:#161b22;border-radius:6px}
.mk.none{border:2px solid var(--bd-hi);color:var(--dim)}
.mk.sm{width:24px;height:24px;font-size:14px}

/* 手順を進める型・見る型 */
.content.g-list{display:grid;gap:14px;grid-template-columns:380px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.g-list .lst{display:flex;flex-direction:column;gap:8px;min-height:0}
.g-list .lhd{display:flex;align-items:center;gap:10px;height:40px;font-size:20px;font-weight:800}
.g-list .lrow{display:flex;align-items:center;gap:12px;min-height:72px;padding:0 14px;border:1px solid var(--bd-hi);border-radius:8px;background:var(--panel);cursor:pointer}
.g-list .lrow .nm{flex:1;min-width:0;font-size:20px;font-weight:700}
.g-list .lrow .nm small{display:block;font-size:15px;font-weight:400;color:var(--mut)}
.g-list .lrow.on{background:var(--sel-bg);color:var(--sel-tx);border-color:var(--sel-bg)}
.g-list .lrow.on .nm small{color:inherit;opacity:.8}
.g-list .lrow.dis{opacity:.4;cursor:not-allowed}
.g-list .lst.sec7{gap:4px}
.g-list .lst.sec7 .lrow{min-height:56px}
.g-list .pane{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;border:1px solid var(--bd);border-radius:8px;background:var(--panel);padding:14px 16px}
.g-list .phd{display:flex;align-items:center;gap:14px;min-height:56px}
.g-list .phd .pt{font-size:24px;font-weight:800;white-space:nowrap}
.g-list .pbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.g-list .pfoot{display:flex;gap:10px;align-items:center;flex:none;min-height:64px}
.g-list .pfoot .b{min-width:200px;min-height:64px;font-size:20px}
.g-list .pfoot .grow{flex:1}
.g-list .pfoot .when{font-size:15px;color:var(--mut);padding:4px 10px;border:1px solid var(--bd-hi);border-radius:999px;white-space:nowrap}
.portrait .content.g-list{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.portrait .g-list .lst{display:grid;grid-template-columns:1fr 1fr}
.portrait .g-list .lst .lhd{grid-column:1/-1}
.portrait .g-list .lst.sec7{grid-template-columns:1fr 1fr 1fr 1fr}
/* 段の印（P2）: 文字の「Step 3/4」ではなく、並びで進みを読む */
.steps{display:flex;gap:6px;flex:1;min-width:0}
.steps .st{flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border:2px solid var(--bd-hi);border-radius:4px;color:var(--dim);white-space:nowrap}
.steps .st.done{background:var(--ctrl-hi);color:var(--tx);border-color:var(--ctrl-hi)}
.steps .st.cur{border:4px solid var(--tx);color:var(--tx)}
.fig{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:28px}
.fig svg{max-height:100%;height:100%;width:auto;max-width:100%}
.fig .cell{display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;min-height:0;justify-content:center}
.fig .cell svg{height:auto;width:200px;max-height:70%}
.fig .cell .cap{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.oneline{font-size:19px;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:18px}
.tbl td,.tbl th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tbl th{font-size:15px;color:var(--mut);font-weight:700}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.out td{background:color-mix(in srgb,var(--jis-y,#ffd100) 45%,transparent)}
.prog{height:22px;border-radius:999px;background:var(--inset);border:1px solid var(--bd-hi);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ctrl-hi)}
.arrows{display:grid;grid-template-columns:repeat(3,96px);grid-template-rows:repeat(3,96px);gap:10px;justify-content:center}
.arrows .b{min-height:96px;font-size:20px;padding:0}
.chk{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 14px;border:1px solid var(--bd-hi);border-radius:8px;font-size:19px;cursor:pointer;background:var(--panel)}
.chk .bx{width:34px;height:34px;border:3px solid var(--bd-hi);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900}
.chk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:52px;height:52px;flex:none;color:var(--mut)}
.inp{min-height:56px;font:inherit;font-size:22px;padding:0 12px;border:2px solid var(--bd-hi);border-radius:4px;background:var(--panel);color:var(--tx);width:200px;font-variant-numeric:tabular-nums}
.grp{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.grp:last-child{border-bottom:none}
.grp .gh{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.grp .gh .when{font-size:14px;font-weight:400;color:var(--mut);padding:2px 10px;border:1px solid var(--bd-hi);border-radius:999px}
.grp .gr{display:flex;align-items:center;gap:12px;font-size:18px;min-height:56px}
.grp .gr > span:first-child{width:190px;flex:none;color:var(--mut)}
.grp .mseg{margin:0;min-width:260px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .b{width:56px;padding:0}
.stepper b{width:90px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}

/* S-00 接続確認: 機器のつながりの図 */
.content.g-conn{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
.g-conn .diag{position:relative;border:1px solid var(--bd);border-radius:8px;background:var(--inset);display:flex;flex-direction:column;min-height:0;padding:10px}
.g-conn .diag svg{flex:1;min-height:0;width:100%}
.g-conn .fix{min-height:56px;display:flex;align-items:center;gap:10px;font-size:19px;padding:0 6px}
.g-conn .side2{display:flex;flex-direction:column;gap:14px;min-height:0}
.g-conn .ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-conn .ac div{display:flex;align-items:center;gap:10px;font-size:18px;min-height:48px}
.g-conn h3{font-size:15px;color:var(--mut);font-weight:700}
.portrait .content.g-conn{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}

/* 手動の窓（W-6）: 上＝自動ブレーキ、下＝手動の一式の縦並び（A-18: スティックが窓の外へはみ出さない）。
   右列（停止│走行・中断）を覆わないよう、主表示の右下に浮かせる（縦長は主表示の上） */
.w6{position:absolute;z-index:5;right:440px;bottom:26px;width:420px;height:470px;display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--panel);border:2px solid var(--bd-hi);border-radius:8px;box-shadow:0 6px 20px #0004}
.w6 .w6h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.w6 .w6h b{flex:1}
.w6 .w6b{display:flex;align-items:center;gap:10px}
.w6 .w6b .cap{font-size:16px;color:var(--mut);font-weight:700}
.w6 .jogc{flex:1;min-height:0}
.portrait .w6{left:26px;right:26px;top:94px;bottom:auto;width:auto;height:430px}
.tg.sm.brk{width:200px}
.b.lockb{min-width:200px;gap:10px}
.b.lockb.armed{background:var(--jis-y,#ffd100) !important;color:#161b22 !important;border-color:#a88a00 !important}

/* 入口のカード（P7）の一覧 */
.center .card.wide{min-width:560px;max-width:92%}
.rtl{display:flex;flex-direction:column;gap:8px;text-align:left}
.rtl .rt{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 14px;border:1px solid var(--bd-hi);border-radius:4px;cursor:pointer;font-size:19px;font-weight:700;background:var(--panel)}
.rtl .rt span{flex:1}
.rtl .rt small{font-size:15px;color:var(--mut);font-weight:400}
.rtl .rt.on{background:var(--sel-bg);color:var(--sel-tx)}
.rtl .rt.on small{color:inherit}
/* */
.rtl .rt.armed{background:var(--jis-y,#ffd100);color:#161b22;border-color:#a88a00}
.tagx{font-size:14px;padding:2px 8px;border:1px solid var(--warn);color:var(--warn-tx);border-radius:999px;font-weight:700}
.maplab{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:24px;font-weight:800;padding:14px 22px;background:var(--panel);border:1px solid var(--bd-hi);border-radius:8px;z-index:2}
.nearlab{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:22px;font-weight:800;padding:8px 16px;border:3px solid var(--warn);color:var(--warn-tx);background:var(--panel);border-radius:8px;z-index:2;white-space:nowrap}
.minimap{position:absolute;left:12px;bottom:12px;width:300px;height:200px;border:1px solid var(--bd-hi);border-radius:8px;background:var(--panel);overflow:hidden;z-index:2;cursor:pointer}
.minimap svg.map{position:absolute;inset:0;width:100% !important;height:100% !important}
.minimap .cap{position:absolute;left:8px;top:6px;font-size:14px;color:var(--mut);z-index:1}
.radar.full{position:absolute !important;inset:12px !important;width:auto !important;height:auto !important}
/* 「記録中」の札の色（未決。A-20 ① と D37） */
.hdr .mst.rec-red{background:#b3261e !important;color:#fff !important}
.hdr .mst.rec-neutral{background:#fff;color:var(--tx)}
.hdr .mst.rec-neutral::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px}
/* 開発モード: ヘッダの色を変える（D44） */
.devmode .hdr .r1,.theme-light.devmode .hdr .r1{background:#7a5312}
.shape-role .g-list .lrow,.shape-role .g-list .pane,.shape-role .w6,.shape-role .chk,.shape-role .g-conn .diag{border-radius:8px}
.theme-light .g-list .lrow:not(.on):not(.dis),.theme-light .chk,.theme-light .rtl .rt:not(.on){box-shadow:0 1px 3px #0000001f}
</style>
</head>
<body>
<div id="bar">

  <span><span class="lbl">状態</span><span class="seg" id="subSeg"></span></span>
  <span><span class="lbl">向き</span><span class="seg" id="oriSeg"></span></span>
  <span><span class="lbl">異常（全画面）</span><span class="seg" id="abSeg"></span></span>
</div>
<div id="main">
  <div id="stageWrap"><div id="devBox"><div id="dev"></div></div></div>
  <div id="notes"></div>
</div>

<script>
/* ---------------- アイコン（インライン SVG・stroke） ---------------- */
const P = {
  field:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  drive:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M4.6 15.6l5.1-2.3M19.4 15.6l-5.1-2.3"/>',
  maint:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 10.5l1.6 1.6 3.4-3.4M8.5 16.5l1.6 1.6 3.4-3.4"/>',
  measure:'<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-5.5"/><circle cx="12" cy="17" r="1.4"/><path d="M6 13.5l1 .6M18 13.5l-1 .6M12 9v1.2"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  prep:'<path d="M3 6l6-2 6 2 6-2v8"/><path d="M3 6v14l6-2 4 1.4"/><path d="M9 4v14"/><path d="M15 21l1-3.5 5-5 2.5 2.5-5 5z"/>',
  day:'<path d="M5 21V3.5"/><path d="M5 4h12l-2.5 4.5L17 13H5"/>',
  follow:'<circle cx="7.5" cy="4.5" r="2"/><path d="M7.5 7.5v6l-2 6.5M7.5 13.5l2.5 6.5M4.5 10.5h6"/><path d="M14 12h7.5M18.5 9l3 3-3 3"/>',
  manual:'<circle cx="12" cy="6.5" r="3"/><path d="M12 9.5v6"/><rect x="4.5" y="15.5" width="15" height="5.5" rx="2"/>',
  teachF:'<circle cx="7" cy="4.5" r="2"/><path d="M7 7.5v6l-2 6.5M7 13.5l2.5 6.5M4 10.5h6"/><circle cx="17.5" cy="12" r="4.2"/><circle cx="17.5" cy="12" r="1.6" fill="currentColor"/>',
  teachM:'<circle cx="8" cy="7" r="2.6"/><path d="M8 9.6v5"/><rect x="2.5" y="14.6" width="11" height="5" rx="2"/><circle cx="17.5" cy="10" r="4.2"/><circle cx="17.5" cy="10" r="1.6" fill="currentColor"/>',
  replay:'<path d="M2.5 19c3.5-9 7.5 3 11.5-6.5"/><circle cx="2.5" cy="19" r="1" fill="currentColor"/><path d="M14.5 8.5l7 4-7 4z"/>',
  line:'<path d="M7 21.5L10.5 2.5M17 21.5L13.5 2.5"/><path d="M12 5.5v2.2M12 10.8v2.4M12 16.3v2.6"/>',
  leash:'<circle cx="6" cy="18" r="3.2"/><path d="M8.5 16C14 12 9.5 6.5 16.5 5"/><rect x="16" y="2" width="5.5" height="5.5" rx="1.2"/>',
  check:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 11.5l2 2 4.5-4.5"/>',
  calib:'<rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10.5 8v4M14.5 8v3M18.5 8v4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  home:'<path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v10h12V10"/>',
  panel:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  person:'<circle cx="12" cy="5" r="2.4"/><path d="M12 8.5v7l-2.5 6M12 15.5l2.5 6M8 12h8"/>',
  cam:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/><circle cx="12" cy="13.5" r="3.5"/>',
  jog:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  abort:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9l6 6M15 9l-6 6"/>',
  save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  stopSq:'<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/>',
  play:'<path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".6" fill="currentColor"/>',
  lidar:'<circle cx="12" cy="14" r="3"/><path d="M5.5 7.5a9 9 0 0 1 13 0M8 10a5.5 5.5 0 0 1 8 0"/><path d="M12 17v4"/>',
  estopBtn:'<rect x="4" y="14" width="16" height="7" rx="1"/><path d="M6 14c0-4 2.7-6 6-6s6 2 6 6"/><path d="M16.5 4.5a6 6 0 0 1 3 4"/><path d="M20 5.5l-.5 3-3-.3"/>',
  release:'<path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3.5v3.5h3.5"/>',
}
const ic = (k, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[k]}</svg>`

/* ---------------- 状態 ---------------- */
const S = {
  scr:'menu', ori:'L',
  tracker:true,   // 人検出（試験準備・試験で共有。左上の操作バーのトグル）
  menu:{lvl:'top', trackerOff:false, noRoute:false},
  wt:{v:'new'}, sz:{v:'new'}, pal:{v:'new', pause:'neutral'},   // 2026-11-17 に決定（D33〜D37）。'old' で 11-16 の版
  af:{v:'pulse'}, dbg:{v:'none'}, theme:{v:'light'}, col:{v:'jis'},   // 画面の地（§6.8・案。2026-11-17 の意見）   // 自律走行中の枠（§6.5・案）／表示の不具合の試し（D39）
  font:{v:'sys'}, shape:{v:'role'}, map:{rot:0, view:'2d', wall:'wall', col:'now'}, trk:{w:'io'},
  day:{sub:'home', dest:null, sel:null, robot:'home', flowStep:0,
       abortLabel:'中断'},   // 2026-11-15: 「中断」のまま（D15）。別の語は案として残す
  ab:{k:'none', cause:null, recent:null},
  target:0,   // 人検出の対象（レーダーの候補の番号。null＝選んでいない。見失っても自動で選び直さない）
  order:['A-1','A-2','B-2','B-1','C-1'],   // 配電盤の順番（「次の配電盤」の順。D60）   // 異常（全画面に共通。D53）
  help:{on:true},   // ヘルプ表示（2026-11-15 ユーザー案。設定で切り替え）
  prep:{lay:'A', sel:null, edit:null, del:[], warn:null, nearWall:false, tap:null, ordering:null, sub:'mapping', method:'person', reserved:'dim', reg:null, regStep:0, pins:6},
}
const SUBS = {
  menu:[['top','一番上'],['field','試験場 ▸'],['drive','走行 ▸'],['maint','点検と校正 ▸']],
  day:[['unloaded','地図未読込'],['home','待機'],['moving','移動中'],['paused','一時停止'],['blocked','経路が塞がれた'],['panel','盤の前'],['working','測定中'],['summon','呼び寄せ'],['waitclear','退避待ち']],
  prep:[['entry','入口'],['mapping','地図作成中'],['reg','人の位置で登録'],['return','待機場所へ戻る途中']],
}
const SCRS = [['menu','メインメニュー（M2）'],['day','試験（当日）F2'],['prep','試験準備']]
const subOf = () => S.scr==='menu' ? (S.menu.win||S.menu.lvl) : S[S.scr].sub
function setSub(v){
  if (extSetSub(v)) return
  if (S.scr==='menu') S.menu.lvl=v
  else if (S.scr==='day'){ const d=S.day; d.sub=v; d.sel=null; d.flowStep=0
    d.robot = v==='panel' ? 'panel' : (v==='moving'||v==='paused'||v==='blocked') ? 'mid' : 'home'
    if ((v==='moving'||v==='paused'||v==='blocked') && !d.dest) d.dest=S.order[0]
    if (v==='working') d.robot='panel'
    d.modal=null
    if (v==='home'||v==='panel'||v==='unloaded'||v==='working'||v==='summon'||v==='waitclear') d.dest=null }
  else { const p=S.prep; p.sub=v; p.sel=null; p.edit=null; if (v==='reg'){ p.reg='HOME'; p.method='person'; p.regStep=1 } else { p.reg=null; p.regStep=0 } }
}

/* ---------------- 部品 ---------------- */
function btn(act, label, {icon, cls='', dis=false, id, why='', help=''}={}){
  if (S.scr!=='menu') icon=null   // アイコンはメインメニューだけ（D28）
  return `<button class="b ${cls} ${dis?'dis':''}" data-btn data-act="${dis?'':act}" ${id?`data-id="${id}"`:''} ${dis&&why?`data-why="${why}"`:''} ${help?`data-help="${help}"`:''}>${icon?ic(icon):''}<span>${label}</span></button>`
}
// 対のトグル。stop/run: 'cur' | 'en' | 'dis' | 'inert'（予約で押しても何も起きない）
function tog(stop, run, {runLabel='走行', runHint='押すと走り出す', blink=true, note='', big=false, help=''}={}){
  const side = (k, st) => {
    const lab = k==='stop' ? '停止' : runLabel
    const icn = ''
    if (st==='cur') return `<div class="cur">${icn}<span>${k==='stop'?'停止中':'走行中'}</span></div>`
    if (st==='en') return k==='stop'
      ? `<div class="nstop" data-act="stop">${icn}<span>${lab}する</span></div>`
      : `<div class="nrun ${blink?'blink':''}" data-act="run">${icn}<span>${lab}する</span></div>`
    if (st==='inert') return `<div class="inert" data-act="inert">${icn}<span>${lab}</span></div>`
    return `<div class="off" data-act="" data-why="${note}">${icn}<span>${lab}</span></div>`
  }
  if (S.wt.v==='new') return tog2(stop, run, {runLabel, note, big, help})
  const pressable = [stop,run].some(s=>s==='en'||s==='inert')
  return `<div class="tg ${big?'big':''}" data-btn ${pressable?'':'data-dis'} ${help?`data-help="${help}" data-nolong`:''}>${side('stop',stop)}<span class="sep"></span>${side('run',run)}</div>`
}
// 2026-11-17 案（options §6.1）: 塗るのは「いま押せる側」だけ（止める＝赤・走る／再開＝青）。語は動詞で固定。
// いまの状態はヘッダの札（D21）が言うので、トグルは状態を言わない。押せない側は沈める。
function tog2(stop, run, {runLabel='走行', note='', big=false, help=''}={}){
  const side = (k, st) => {
    const lab = (k==='stop' ? '停止' : runLabel) + 'する'
    if (st==='en') return k==='stop'
      ? `<div class="go-stop" data-act="stop"><span>${lab}</span></div>`
      : `<div class="go-run blink" data-act="run"><span>${lab}</span></div>`
    if (st==='inert') return `<div class="inert" data-act="inert"><span>${k==='stop'?'停止':runLabel}</span></div>`
    const why = st==='cur' ? (k==='stop' ? '止まっています' : '走っています') : note
    return `<div class="idle off" data-act="" data-why="${why}"><span>${lab}</span></div>`
  }
  const pressable = [stop,run].some(s=>s==='en'||s==='inert')
  return `<div class="tg tg2 ${big?'big':''}" data-btn ${pressable?'':'data-dis'} ${help?`data-help="${help}" data-nolong`:''}>${side('stop',stop)}<span class="sep"></span>${side('run',run)}</div>`
}
// 人検出の開始／停止（2026-11-13: 案の画面に動かす手段が無かった。いまの実装は対象選択タブの中）。対のトグル（R4）。
// 呼び寄せ中・登録中は止められない（機体が拒否する。trackerControlPolicy.js）。
function trackerBar(canStop=true){
  const on=S.tracker, io=S.trk.w==='io'
  const [offDo, offCur, onDo, onCur] = io ? ['切','切','入','入'] : ['■ 止める','■ 停止中','● 動かす','● 動作中']
  // 2026-11-17 案（§6.1）: これは操作の対ではなく ON／OFF の切り替えなので、ON のときだけ明るく点ける。OFF は点けない
  const offCurCls = S.wt.v==='new' ? 'curoff' : 'cur'
  return `<span class="cap">人検出</span><div class="tg sm" data-btn data-help="tracker">
    ${on?(canStop?`<div class="press" data-act="trkOff">${offDo}</div>`:`<div class="off">${offDo}</div>`):`<div class="${offCurCls}">${offCur}</div>`}<span class="sep"></span>
    ${on?`<div class="cur">${onCur}</div>`:`<div class="press" data-act="trkOn">${onDo}</div>`}</div>`
}
// ヘッダ（2026-11-15 決定 D21〜D24）: ロゴ・プロジェクト名の真後ろに画面名称（位置をほぼ固定）。
// 右端の札はモードではなく状態。ゾーンは場内のときだけ「速度制限」。
function header(title, zone, state, alert, stCls){
  const cls = stCls ?? (/一時停止/.test(state) ? ' pause' : /移動中/.test(state) ? ' run' : '')
  return `<div class="hdr"><div class="r1"><div class="logo">TH</div><div class="brand"><small>MIRS2602-</small>高見舎プロジェクト</div><div class="title">${title}</div>
  <div class="gap"></div>${zone?'<span class="zone">速度制限</span>':''}${state?`<span class="mst${cls}">${state}</span>`:''}</div>
  <div class="r2">${alert||''}</div></div>`   // 正常は出さない。異常のときだけここに出す（D45）   // 非常停止はここに描かない（render の estopHTML。D39）
}

  const clip = partial ? `<clipPath id="exp">${poly(EXPLORED.map(q=>P(...q)),'')}</clipPath>` : ''
  const floor = `<g ${partial?'clip-path="url(#exp)"':''}><image href="${MAPDATA.pngs[S.theme.v==='light' && S.map.col==='now' ? 'b' : S.map.col]}" x="${MX0}" y="${MY0}" width="${MAPDATA.w*CS}" height="${MAPDATA.h*CS}" transform="${mtx}" preserveAspectRatio="none" style="image-rendering:pixelated"/></g>`
    + (partial ? poly(EXPLORED.map(q=>P(...q)), 'fill="none" stroke="#3a3f4c" stroke-dasharray="6 6"') : '')
  const walls = d3 ? wallBoxes(partial) : ''
  // いま LiDAR に見えている点（機体のまわりの壁）
  let pts=''
  if (scan && robot){ const R=MAPDATA.runs, H=hpx(S.map.wall==='wall'?WALL_M:0.5)
    for (let i=0;i<R.length;i+=3){ const g=C(R[i+1]+R[i+2]/2, R[i]+.5), dx=g[0]-robot[0], dy=g[1]-robot[1]
      if (dx*dx+dy*dy>170*170 || (i/3)%2) continue
      const [px,py]=P(g[0],g[1]); pts+=`<circle cx="${px.toFixed(1)}" cy="${(py-H).toFixed(1)}" r="2.4" fill="#e05252" opacity=".8"/>` } }
  // 奥から手前へ重ねるもの（機体・印）
  const items=[]
  if (robot){ const [rx,ry,ra]=robot, a=ra*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a)
    const L=(x,y)=>[rx+x*ca-y*sa, ry+x*sa+y*ca]
    const fp=[[-17.6,-17.6],[17.6,-17.6],[17.6,17.6],[-17.6,17.6]].map(q=>L(...q)), g=fp.map(q=>P(...q)), hz=hpx(0.35)
    const tri=[[-9,-10],[13,0],[-9,10]].map(q=>L(...q)).map(q=>P(...q)).map(([x,y])=>[x,y-hz])
    let body = poly(g, 'style="fill:var(--robot-fp,rgba(63,138,224,.3));stroke:var(--robot,#7fb4ee)" stroke-width="1.5" stroke-linejoin="round"')
    // （機体・経路・行き先の輪は「機体が進むこと」の青。2026-11-17 案 §6.3 でもこの色のまま）
    if (d3){ const t=g.map(([x,y])=>[x,y-hz]); let faces=[]
      for (let i=0;i<4;i++){ const j=(i+1)%4; faces.push([(g[i][1]+g[j][1])/2, poly([g[i],g[j],t[j],t[i]], 'fill="#2c5a93" stroke="#7fb4ee" stroke-width="1"')]) }
      body = faces.sort((a,b)=>a[0]-b[0]).map(f=>f[1]).join('') + poly(t, 'fill="#3f8ae0" stroke="#7fb4ee" stroke-width="1.5" stroke-linejoin="round"') }
    items.push([depth(fp)+1, body + poly(tri, 'style="fill:var(--robot,#7fb4ee)" stroke="#fff" stroke-width="2" stroke-linejoin="round"')]) }
  const lift = d3 ? 30 : 0, mk={}; let labels=''
  // ピンの大きさ（viewBox の単位）。2026-11-17 案 §6.2: 地図は枠に合わせて 0.6〜0.9 倍で描かれ、タブレットでさらに 0.8 倍になる。
  // 当たり判定の直径 112（いちばん近い盤 B-1・B-2 でも重ならない。レーダーで地図が縮む地図作成中でも約 63 論理 px）・印 36・名前 24 にする
  const Z = S.sz.v==='new' ? {r:18, hit:56, lab:24, ly:48, hr:20} : {r:14, hit:34, lab:22, ly:40, hr:16}
  for (const p of pins){
    const isSel = sel===p.id, [gx,gy]=P(p.x,p.y), x=gx, y=gy-lift; mk[p.id]=[x,y]
    items.push([gy+2, `<g data-act="pin" data-id="${p.id}" style="cursor:pointer">
      ${d3?`<ellipse cx="${gx}" cy="${gy}" rx="9" ry="6" fill="#000" opacity=".45"/><path d="M${gx} ${gy}V${y}" stroke="#0f1117" stroke-width="6"/><path d="M${gx} ${gy}V${y}" stroke="#e6e8ec" stroke-width="3"/>`:''}
      <circle cx="${x}" cy="${y}" r="${Z.hit}" fill="transparent"/>
      ${pinShape(p.kind, x, y, d3 ? 0 : (p.yaw??0)+S.map.rot, {r:Z.r, fill: p.kind==='home' ? (isSel?'var(--pin-homesel,#8fd694)':'var(--pin-home,#4caf50)') : (isSel?'var(--pin-sel,#7fb4ee)':'var(--pin-panel,#3f8ae0)')})}
      ${dest===p.id?`<circle cx="${x}" cy="${y}" r="${Z.r+16}" fill="none" style="stroke:var(--dest,#ffd54f)" stroke-width="5"/>`:''}
      ${isSel?`<circle cx="${x}" cy="${y}" r="${Z.r+10}" fill="none" stroke="#fff" stroke-width="3"/>`:''}
      ${order && p.kind==='panel' && OL.includes(p.id) ? `<text x="${x}" y="${y+8}" text-anchor="middle" font-size="23" font-weight="800" style="fill:var(--pin-tx,#0f1117)" pointer-events="none">${OL.indexOf(p.id)+1}</text>` : ''}
      </g>`])
    labels += `<text x="${gx}" y="${gy+(d3?24:Z.ly)}" text-anchor="middle" font-size="${Z.lab}" font-weight="700" style="fill:var(--lab,#e6e8ec);stroke:var(--lab-bd,#0f1117)" stroke-width="5" paint-order="stroke" pointer-events="none">${p.name}</text>`
  }
  let bubble='', bubHTML=''
  // 2026-11-17 案 §6.2: 吹き出しを HTML にし、「行き先にする」を論理 px で高さ 60 にする（SVG の中だと地図と一緒に縮む）
  if (sel && S.sz.v==='new'){ const p=pinById(sel), [mx,my]=mk[sel]
    bubHTML = `<div class="bub" data-x="${mx}" data-y="${my}" data-r="${Z.hit}"><div class="nm">${p.name}</div>${bubBody ?? btn('pinGo', selLabel, {cls:'go adv'})}</div>` }
  else if (sel){ const p=pinById(sel), [mx,my]=mk[sel]; const bx=Math.min(Math.max(mx-130,50),690), by=my>300?my-170:my+60
    bubble = `<g><rect x="${bx}" y="${by}" width="260" height="104" rx="12" fill="#232733" stroke="#7fb4ee" stroke-width="2"/>
      <text x="${bx+16}" y="${by+34}" font-size="24" font-weight="800" fill="#fff">${p.name}</text>
      <g data-act="pinGo" data-btn style="cursor:pointer"><rect x="${bx+14}" y="${by+48}" width="232" height="44" rx="8" fill="#2c4a74" stroke="#3f8ae0" stroke-width="2"/>
      <text x="${bx+130}" y="${by+78}" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">${selLabel}</text></g></g>`
  }
  const pl = path ? `<polyline points="${path.map(q=>pt(P(...q))).join(' ')}" fill="none" stroke="#0f1117" stroke-opacity=".7" stroke-width="9"/><polyline points="${path.map(q=>pt(P(...q))).join(' ')}" fill="none" style="stroke:var(--route,#ffd54f)" stroke-width="5" stroke-dasharray="14 9"/>` : ''
  return `<svg class="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">${clip}${floor}
    ${pl}${walls}${pts}${items.sort((a,b)=>a[0]-b[0]).map(i=>i[1]).join('')}${labels}${bubble}</svg>${bubHTML}`
}
function radarSVG(big, off=false){
  if (off) return `<div class="radar ${big?'big':''}" style="display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:15px;padding:16px">人検出が止まっています<br>左上の「人検出」で動かします</div>`
  const cands=[[60,-90,true],[-110,-40,false],[130,60,false],[-70,110,false]]
  let c=''
  cands.forEach(([x,y],i)=>{ const s = S.target===i
    c+=`<g data-act="cand" data-id="${i}" style="cursor:pointer"><circle cx="${150+x}" cy="${150+y}" r="30" fill="transparent"/><circle cx="${150+x}" cy="${150+y}" r="${s?15:11}" fill="${s?'#4caf50':'#8b93a1'}"/>${s?`<circle cx="${150+x}" cy="${150+y}" r="24" fill="none" stroke="#8fd694" stroke-width="3"/>`:''}<text x="${150+x}" y="${150+y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1117">${i+1}</text></g>` })
  return `<div class="radar ${big?'big':''}"><span class="cap">${S.target==null ? '<b style="color:var(--warn-tx)">対象を選んでいません</b>' : `対象: ${S.target+1} 番（信頼度 87%）`}</span>
    <svg viewBox="0 0 300 300" style="width:100%;height:100%"><circle cx="150" cy="150" r="60" fill="none" stroke="#2a2d35"/><circle cx="150" cy="150" r="120" fill="none" stroke="#2a2d35"/>
    <path d="M150 20V280M20 150H280" stroke="#2a2d35"/><path d="M140 160L150 135L160 160Z" fill="#7fb4ee"/>${c}</svg></div>`
}

/* ---------------- メインメニュー（M2） ---------------- */
// タイルの大きさ（2026-11-13 ユーザー指摘）: 使う頻度・重要度で大きさを変える。
// size: 'l' 大 ／ '' 中 ／ 's' 小（横並び）。ga = grid-area（横長・縦長）。順位は仮。
const LAYOUT = {
  top:{ L:{cols:'1.35fr 1fr 1fr', rows:'1fr 1fr .42fr'}, P:{cols:'1fr 1fr', rows:'1.25fr 1fr .42fr'} },
  field:{ L:{cols:'1.3fr 1fr', rows:'1fr'}, P:{cols:'1fr', rows:'1.3fr 1fr'} },
  drive:{ L:{cols:'repeat(6,1fr)', rows:'1.3fr 1fr'}, P:{cols:'1fr 1fr', rows:'1.25fr 1fr 1fr'} },
  maint:{ L:{cols:'1.4fr 1fr', rows:'1fr'}, P:{cols:'1fr', rows:'1.3fr 1fr'} },
}
const TOP_TILES = [
  {act:'go:field', icon:'field', name:'試験場', sub:true, g:'field', size:'l', L:'1/1/4/2', P:'1/1/2/3'},
  {act:'go:drive', icon:'drive', name:'走行', sub:true, g:'drive', size:'', L:'1/2/3/3', P:'2/1/3/2'},
  {act:'go:maint', icon:'maint', name:'点検と校正', sub:true, g:'maint', size:'', L:'1/3/3/4', P:'2/2/3/3'},
  {act:'autoask', icon:'measure', name:'自律測定', size:'s', L:'3/2/4/3', P:'3/1/4/2'},
  {act:'openx:settings', icon:'gear', name:'設定', size:'s', L:'3/3/4/4', P:'3/2/4/3'},
]
// ライン誘導・電子リードは開発中止（2026-11-13 ユーザー）で削除。
const GROUPS = {
  field:{name:'試験場', icon:'field', color:'var(--g-field)', items:[
    {k:'day', name:'試験（当日）', icon:'day', size:'l', L:'1/1/2/2', P:'1/1/2/2'},
    {k:'prep', name:'試験準備', icon:'prep', size:'', L:'1/2/2/3', P:'2/1/3/2'}]},
  drive:{name:'走行', icon:'drive', color:'var(--g-drive)', items:[
    {k:'follow', name:'追従走行', icon:'follow', size:'l', L:'1/1/2/4', P:'1/1/2/2'},
    {k:'manual', name:'手動走行', icon:'manual', size:'l', L:'1/4/2/7', P:'1/2/2/3'},
    {k:'replay', name:'教示再生', icon:'replay', size:'', L:'2/1/3/3', P:'2/1/3/2'},
    {k:'teachF', name:'教示（追従）', icon:'teachF', size:'', L:'2/3/3/5', P:'2/2/3/3'},
    {k:'teachM', name:'教示（手動）', icon:'teachM', size:'', L:'2/5/3/7', P:'3/1/4/2'}]},
  maint:{name:'点検と校正', icon:'maint', color:'var(--g-maint)', items:[
    {k:'check', name:'始業点検', icon:'check', size:'l', L:'1/1/2/2', P:'1/1/2/2'},
    {k:'calib', name:'校正', icon:'calib', size:'', L:'1/2/2/3', P:'2/1/3/2'}]},
}
function tileHTML({act, icon, name, sub, color, size, area, why, dis}){
  return `<div class="tile g ${size} ${dis?'dis':''}" data-btn ${dis?'data-dis':''} data-act="${dis?'':act}" ${dis&&why?`data-why="${why}"`:''} style="grid-area:${area};border-left-color:${color||'var(--bd-hi)'};--gc:${color||'var(--panel)'}">
    <span style="color:${color||'var(--tx)'}">${ic(icon)}</span><div><div class="nm">${name}${sub?'<span class="ar">▸</span>':''}</div></div></div>`
}
function menuView(){
  const m=S.menu, lvl=m.lvl, o=S.ori
  const why = k => {
    if (m.trackerOff && (k==='follow'||k==='teachF')) return '人検出が止まっています'
    if (m.noRoute && k==='replay') return '経路がありません'
    return ''
  }
  const lay = LAYOUT[lvl][o]
  let left, tiles
  if (lvl==='top'){
    tiles = TOP_TILES.map(t=>tileHTML({...t, color: t.g ? GROUPS[t.g].color : '', area:t[o],
      why: t.g==='drive' && m.trackerOff ? '追従は人検出が止まっています' : ''})).join('')
    left = `<div class="tiles" style="grid-template-columns:${lay.cols};grid-template-rows:${lay.rows}">${tiles}</div>`
  } else {
    const g=GROUPS[lvl]
    tiles = g.items.map(it=>{ const w=why(it.k)
      const act = it.k==='prep' ? 'open:prep' : it.k==='day' ? 'open:day' : `openx:${it.k}`
      return tileHTML({act, icon:it.icon, name:it.name, color:g.color, size:it.size, area:it[o], why:w, dis:!!w}) }).join('')
    left = `<div class="banner" style="background:color-mix(in srgb, ${g.color} 16%, transparent);color:#fff"><span style="color:${g.color}">${ic(g.icon)}</span>${g.name}${S.wt.v==='new'?'':`<span style="color:var(--mut);font-size:16px;font-weight:400;margin-left:8px">メインメニュー ▸ ${g.name}</span>`}</div>
      <div class="tiles" style="grid-template-columns:${lay.cols};grid-template-rows:${lay.rows}">${tiles}</div>`
  }
  // §6.7: 接続確認は操作バーの右に置き、一番上でも帯が空にならないようにする（どの階層でも同じ場所）
  // 「通信できています」の常に緑の表示は出さない（D45。通信が切れたら異常として出す）。接続確認のボタンだけ残す
  const link = `<span style="margin-left:auto"></span>${btn('toast:接続確認の詳細（S-00 相当）','接続確認',{cls:'exit'})}`
  const opbar = S.wt.v==='new'
    ? `<div class="opbar">${lvl==='top'?'':btn('go:top','戻る',{icon:'back',cls:'exit'})}${link}</div>`
    : lvl==='top' ? `<div class="opbar"></div>` : `<div class="opbar">${btn('go:top','戻る',{icon:'back',cls:'exit'})}</div>`
  const side = `<div class="side">
    ${S.wt.v==='new' ? '' : `<div class="sec full"><h3>接続確認</h3><div class="kv"><i></i>機体・ラズパイ・ESP32 と通信できています</div>
      <div style="margin-top:10px">${btn('toast:接続確認の詳細（S-00 相当）','詳細',{cls:'exit'})}</div></div>`}
    <div class="sec"><h3>バッテリー</h3><div style="font-size:22px;font-weight:800">82 %</div></div>
    <div class="sec full"><h3>運用の終了</h3><div class="kv">未保存のデータ<span class="cnt">4 件</span></div>
      <button class="b halt" data-btn data-act="shutdown">制御系を停止する</button></div></div>`
  return header('メインメニュー', false, '') + `<div class="body">${opbar}<div class="content"><div class="mcol">${left}</div>${side}</div></div>`
}

/* ---------------- 試験（当日）F2 ---------------- */
function dayView(){
  const d=S.day, s=d.sub
  const ROBOT = {home:C(175,164,-90), mid:C(172,100,-90), panel:C(102,58,-150), off:C(172,112,-90)}
  const destPin = d.dest && pinById(d.dest)
  const choose = (s==='home'||s==='panel')
  // 9 個のボタンの押せる・押せない（位置は固定。R2）
  const E = {stop:'cur', run:'dis', manual:true, abort:false, home:false, next:false, summon:false, measure:false, cam:false}
  const AB = d.abortLabel
  let whyDest='', whyPanel='盤の前に着いたら押せます', runNote=''
  if (s==='unloaded'){ whyDest='会場地図を開いてから選べます'; runNote='行き先がありません' }
  else if (choose){ E.home = !(s==='home' && d.robot==='home'); E.next=true; E.summon=S.tracker
    runNote='行き先を押すと出発します'
    if (s==='panel'){ E.measure=true; E.cam=true; whyPanel='' }
    if (!S.tracker) whyDest='人検出を動かすと呼び寄せできます（左上）' }
  else if (s==='moving'){ E.stop='en'; E.run='cur'; E.abort=true; whyDest=`移動中は選べません（「${AB}」で止めて選び直し）` }
  else if (s==='paused'){ E.run='en'; E.abort=true; whyDest=`一時停止中は選べません（「再開」か「${AB}」）` }
  else if (s==='blocked'||s==='working'||s==='waitclear'){ runNote='窓で選びます'; whyDest=runNote }
  else if (s==='summon'){ E.abort=true; whyDest=`呼び寄せの位置を指定しています（やめるときは「${AB}」）`; runNote='位置を指定すると出発します' }

  const where = d.robot==='home' ? '待機場所' : d.robot==='panel' ? '盤 A-1' : '途中'
  const st = {
    unloaded:['会場地図が開かれていません',''],
    home:[ d.robot==='home'?'待機中　待機場所':'止まっています　行き先を選んでください', ''],
    moving:[`移動中 → ${destPin?.name??''}`, '残り 4.2 m'],
    paused:[`一時停止中 → ${destPin?.name??''}`, '残り 4.2 m'],
    panel:[`盤の前　盤 A-1`, ''],
    summon:['呼び寄せ　位置の指定', ''],
    blocked:['経路待ち',''], working:['測定中',''], waitclear:['退避待ち',''],
  }[s]

  let mainInner = ''
  const robot = ROBOT[d.robot]
  const path = (s==='moving'||s==='paused'||s==='blocked') ? [C(175,176),C(172,120),C(172,76),C(130,70),C(102,58),C(96,49)] : null
  if (s==='unloaded'){
    mainInner = `<div class="center" style="background:var(--inset)"><div class="card"><p>機体を待機場所に置いてから押します</p>${btn('openMap','会場地図を開く',{icon:'field',cls:'fwd'})}</div></div>`
  } else {
    mainInner = mapSVG({robot, path, sel: choose ? d.sel : null, selLabel:'行き先にする', dest: (s==='moving'||s==='paused'||s==='blocked') ? d.dest : null, order:true})
    if (s==='summon') mainInner += radarSVG(false, !S.tracker) + `<div class="flow"><span class="stp">呼び寄せ ${d.flowStep||1}/2</span><span class="msg">${d.flowStep===2?'機体に向いてほしい方向へ 1 歩動いて「記録」':'機体に来てほしい位置に立って「記録」'}</span>${btn('rec','記録',{cls:'adv',dis:!S.tracker||S.target==null,why:'対象を選んでから（レーダーの候補を押す）'})}</div>`
  }
  const runLabel = s==='paused' ? '再開' : '走行'
  const runHint = '押すと続きを走る'
  // 薄いボタンを押したときに出す理由（D16）
  const whyHome = choose && d.robot==='home' ? 'いま待機場所にいます' : whyDest
  const whySummon = choose && !S.tracker ? '人検出を動かすと呼び寄せできます（左上）' : whyDest
  const whyAbort = '取り消す行き先がありません（移動中・一時停止中・呼び寄せの位置指定中に押せます）'
  // 「次の配電盤」に行き先の名前（D14）。名前が無い状態でも 2 行ぶんの高さを保つ（R2）
  const nextId = s==='panel' ? S.order[1] : S.order[0]
  const nextLabel = `次の配電盤<small>${choose ? pinById(nextId).name+' へ' : '&nbsp;'}</small>`
  const ctl = `<div class="ctl">
    <div class="state full"><div class="s1">${st[0]}</div><div class="s2">${st[1]}</div></div>
    <div class="sec full noh"><h3>操作</h3>${tog(E.stop, E.run, {runLabel, runHint, note:runNote, big:true, help:'toggle'})}
      <div class="row" style="margin-top:8px">${btn('jog','手動',{icon:'jog',dis:!E.manual,help:'jog'})}${btn('abort',AB,{icon:'abort',dis:!E.abort,why:whyAbort,cls:'interrupt'+(AB.length>4?' f16':''),help:'abort'})}</div></div>
    <div class="sec"><h3>行き先</h3><div class="row">${btn('goHome','待機場所<small>&nbsp;</small>',{icon:'home',dis:!E.home,why:whyHome,cls:'two go',help:'home'})}${btn('goNext',nextLabel,{icon:'panel',dis:!E.next,why:whyDest,cls:'two go',help:'next'})}</div>
      <div class="row" style="margin-top:8px">${btn('summon','呼び寄せ',{icon:'person',dis:!E.summon,why:whySummon,cls:'go',help:'summon'})}</div></div>
    <div class="sec"><h3>盤の前</h3><div class="row">${btn('toast:測定機能の画面を開き、停止命令（測定中）に入る','測定機能へ',{icon:'measure',dis:!E.measure,why:whyPanel,help:'measure'})}${btn('toast:カメラ機能の画面を開く（状態は変えない）','カメラ',{icon:'cam',dis:!E.cam,why:whyPanel,help:'cam'})}</div></div>
  </div>`
  // 2026-11-17 案（options §6.1）: 右列の先頭は状態ではなく「どこへ・あとどれだけ」（状態はヘッダの札 D21）。
  // 「次の配電盤」を行き先の先頭に幅いっぱいで置き、押せるときは出発の青で塗る。ボタンの数と位置は全状態で同じ（R2）
  const WH = { unloaded:['',''], blocked:[`${destPin?.name??''} へ`,'残り 4.2 m'], working:['盤 A-1 の前',''], waitclear:['呼び寄せの位置',''], home:[d.robot==='home'?'待機場所':'途中で停止',''],
    moving:[`${destPin?.name??''} へ`,'残り 4.2 m'], paused:[`${destPin?.name??''} へ`,'残り 4.2 m'],
    panel:['盤 A-1 の前',''], summon:['呼び寄せの位置',''] }[s]
  const ctlNew = `<div class="ctl">
    <div class="where full"><span>${WH[0]||'&nbsp;'}</span><b>${WH[1]}</b></div>
    <div class="sec"><h3>操作</h3>${tog(E.stop, E.run, {runLabel, note:runNote, big:true, help:'toggle'})}
      <div class="row" style="margin-top:8px">${btn('jog','手動',{dis:!E.manual,help:'jog'})}${btn('abort',AB,{dis:!E.abort,why:whyAbort,cls:'interrupt'+(AB.length>4?' f16':''),help:'abort'})}</div></div>
    <div class="sec"><h3>行き先</h3>${btn('goNext', `次の配電盤<small>${choose ? pinById(nextId).name+' へ' : '&nbsp;'}</small>`, {dis:!E.next, why:whyDest, cls:'two go next'+(E.next?' adv':''), help:'next'})}
      <div class="row" style="margin-top:8px">${btn('goHome','待機場所',{dis:!E.home,why:whyHome,cls:'go',help:'home'})}${btn('summon','呼び寄せ',{dis:!E.summon,why:whySummon,cls:'go',help:'summon'})}</div></div>
    <div class="sec full"><h3>盤の前</h3><div class="row">${btn('measure','測定機能へ',{dis:!E.measure,why:whyPanel,help:'measure'})}${btn('toast:カメラ機能の画面を開く（状態は変えない）','カメラ',{dis:!E.cam,why:whyPanel,help:'cam'})}</div></div>
  </div>`
  return header('試験', true, DAY_STATE[s]||'') + `<div class="body">${dayWindow(s)}<div class="opbar">${btn('toast:メインメニュー（試験場の階層）へ戻る','終了',{icon:'close',cls:'exit',help:'exit'})}${trackerBar(s!=='summon')}</div>
    <div class="content"><div class="mainv">${mainInner}</div>${S.wt.v==='new' ? ctlNew : ctl}</div></div>`
}
// ============ 試験（当日）の窓（2026-11-22。案の画面に無かった機能 M7・M8・M10） ============
// 本文の中央・ヘッダ以外を暗くする出し方は異常の窓と同じ（D53）。枠は中立の色（異常ではない）
function dayWindow(s){
  const d=S.day, sc='<div class="scrim"></div>'
  if (d.modal==='stow') return sc+`<div class="win"><div class="wt">腕を格納しましたか</div>
    <div class="wl">停止を解くと機体が動けるようになります</div><div class="wb">${btn('stowOk','格納した',{cls:'adv'})}${btn('stowNo','やめる')}</div></div>`
  if (s==='blocked') return sc+`<div class="win"><div class="wt">経路が塞がれています</div>
    <div class="wl mut">${pinById(d.dest)?.name??''} へ　空けば自動で続きを走ります</div><div class="wb">${btn('reroute','再検索')}${btn('abort','中断',{cls:'interrupt'})}</div></div>`
  if (s==='working') return sc+`<div class="win"><div class="wt">測定中</div>
    <div class="wl mut">測定機能が終えると自動で解けます</div><div class="wb">${btn('unstop','停止を解く')}</div></div>`
  if (s==='waitclear') return sc+`<div class="win"><div class="wt">退いてください</div>
    <div class="big">あと 0.8 m</div><div class="wl mut">空いたら自動で走り出します</div><div class="wb">${btn('waitStop','中止')}</div></div>`
  return ''
}

// ============ 異常（全画面に共通。2026-11-21〜22 ユーザー決定 D45〜D53） ============
// ・ヘッダの下段は異常のときだけ出す（D45）。異常＝黄、非常停止中＝赤、解消した直近の異常＝灰の文字（3 分ほどで消える）
// ・窓は画面の中央に置き、ヘッダ以外を暗くする。異常の間は必ず一時停止し、中断・再開もさせず、ハードの解消を待つ（D47）
// ・画面の非常停止も同じ窓を出して暗くする（D50）。解除の帯は白・小さめで本文の下端の中央（D52）
// ・解消・解除の窓は知らせるだけで、走行の再開を持たない（D48）。機体の非常停止ボタン（運用では手押し）も画面では非常停止（D46）
// ・窓の題は何が起きたか（D49）。全画面で同じ出し方にし、画面の配置に左右されない（D53）
const AB_KINDS = [['none','なし'],['fault','異常'],['estop','非常停止（画面）'],['carry','非常停止（機体のボタン）'],['resolved','解消・解除']]
const CAUSE = {fault:['LiDAR 途絶','0.1 秒'], estop:['画面の非常停止','44 秒'], carry:['機体の非常停止ボタン','3 分 12 秒']}
function abAlert(){
  const a=S.ab
  if (a.k==='fault') return `<div class="al ab">${ic('warn')}LiDAR 途絶</div>`
  if (a.k==='estop') return `<div class="al em">画面の非常停止</div>`   // 札（非常停止中）と同じ語を並べず、どこで押されたかを言う
  if (a.k==='carry') return `<div class="al em">機体の非常停止ボタン</div>`
  const past = a.k==='resolved' ? (a.cause||'fault') : a.recent
  return past ? `<div class="al past">直近の異常　${CAUSE[past][0]}　12:34:56</div>` : ''
}
function abWindow(){
  const a=S.ab, sc='<div class="scrim"></div>'
  if (a.k==='fault') return sc+`<div class="win ab"><div class="wt">${ic('lidar')}LiDAR 途絶</div>
    <div class="wl">LiDAR の電源とケーブルを確かめる</div></div>`
  if (a.k==='estop') return sc+`<div class="win em"><div class="wt">非常停止</div>
    <div class="wl mut">画面の非常停止　12:34:56</div></div>
    <div class="relbar" data-btn data-act="release">${ic('release')}非常停止を解除する</div>`
  if (a.k==='carry') return sc+`<div class="win em"><div class="wt">非常停止</div>
    <div class="pict">${ic('estopBtn','data-act="carryRel" data-btn')}<div class="wl">機体後部の赤いボタンを右へひねって戻す</div></div></div>`
  if (a.k==='resolved'){ const c=a.cause||'fault', [nm,dur]=CAUSE[c]
    return sc+`<div class="win"><div class="wt">${c==='fault' ? '異常が解消しました' : '非常停止を解除しました'}</div>
    <div class="wl mut">${nm}　${dur}　12:34:56</div>
    <div class="wb">${btn('ack','確認')}</div></div>` }
  return ''
}
// 異常になったら必ず一時停止（D47）。案の画面では、試験（当日）の移動中を一時停止にする
function setAb(k){
  const a=S.ab
  if (k==='resolved' && a.k!=='none' && a.k!=='resolved') a.cause=a.k
  else if (k==='resolved' && !a.cause) a.cause='fault'
  a.k=k; if (k!=='none' && k!=='resolved') a.recent=null
  if (k!=='none' && S.scr==='day' && S.day.sub==='moving') S.day.sub='paused'
  if (k!=='none' && k!=='resolved') pauseOnAb()
}
function applyAb(dev){
  const a=S.ab, r2=dev.querySelector('.hdr .r2'), mst=dev.querySelector('.hdr .mst')
  if (r2) r2.innerHTML = abAlert()
  if (a.k==='estop'||a.k==='carry'){
    if (mst){ mst.textContent='非常停止中'; mst.className='mst' }
    else dev.querySelector('.hdr .gap')?.insertAdjacentHTML('afterend','<span class="mst">非常停止中</span>') }
  if (a.k!=='none') dev.querySelector('.body')?.insertAdjacentHTML('beforeend', abWindow())
}
